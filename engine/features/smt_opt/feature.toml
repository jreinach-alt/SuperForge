# smt_opt — OFFSET-PER-TILE: BG3's tilemap as this scene's per-column scroll
# table.
#
# =============================================================================
# WHAT THE CLAIM SAYS THAT NO OTHER CLAIM COULD
# =============================================================================
# The table itself is an ordinary [[claims.vram]] tilemap region and always
# was. What the claim classes could not say is the CONSEQUENCE: in this scene
# BG3 IS NOT A LAYER. The PPU reads its map entries as scroll offsets and
# never renders it (Mesen2 Core/SNES/SnesPpu.cpp RenderMode2 draws BG1, BG2
# and OBJ only), so every other feature's belief that it can draw on BG3 is
# false here — and before [[claims.offset]] nothing collided: a text feature
# and this one both owned "their" BG3 and the build was green.
#
# [[claims.offset]] moves ownership to the thing actually contended, the BG3
# fetch path. The composition synthesizes ownership of BG3SC/BG3HOFS/BG3VOFS,
# so `bg_text` meets this feature as an ordinary register intersection with a
# message that names the mechanism — and the same scene composing a
# `bg3 -> main` designation refuses in the composition. tests/test_smelter.py
# quotes both refusals verbatim off this tree's own features.
#
# =============================================================================
# ZERO HDMA CHANNELS DURING ACTIVE DISPLAY. THAT IS THE HEADLINE.
# =============================================================================
# Every other per-column or per-scanline effect in this tree buys its
# displacement with an HDMA channel running the length of the picture:
# `haze` spends two, `rgb_gradient` spends three. Offset-per-tile spends NONE.
# The words ride the tilemap fetch BG3 already pays for, so the entire cost is
# getting the row into VRAM — 64 B in one VBlank transfer, declared below —
# and 32 independent columns cost exactly what 1 would.
#
# =============================================================================
# ONE VALUE A COLUMN, TWO GATES — the constraint this rail is drawn around
# =============================================================================
# A word carries ONE offset and two enable bits. BG1 and BG2 can each be gated
# in or out of a column, but they cannot take DIFFERENT offsets in the same
# one. So the columns are partitioned: a plate's four columns drive BG1 and
# leave BG2 at its base, and the gap columns drive BG2 and leave BG1 at its.
# The melt is calm under the plates and erupts in the gaps — which is a
# picture, not a workaround, and it is the honest shape of the silicon.
name = "smt_opt"
role = "feature"
depends = ["smt_rom"]

# ---- the vocabulary -------------------------------------------------------
# `axis = "v"` because this rail displaces vertically and only vertically: a
# horizontal offset is 8-PIXEL granular (the layer keeps its own low three
# bits — SnesPpu.cpp:157) and could not lift a crust line by a pixel. The H
# row is still uploaded, all zero, because mode 2 FETCHES a word for each axis
# whether or not you mean to use one.
[[claims.offset]]
name = "smt_table"
axis = "v"
layers = ["bg1", "bg2"]

# The scene's mode. Mode 2 rather than 4: mode 4's BG1 is 8bpp and its BG2 is
# 2bpp — a different art path and four colours for the melt — and it fetches
# ONE word per column with bit 15 choosing the axis, so a column carries one
# axis instead of two. Mode 2 gives 4bpp on both layers, which is the art path
# this tree already ships, and two independent words a column.
[[claims.video]]
name = "smt_mode"
mode = 2

# ---- the table's VRAM -----------------------------------------------------
# 0x400 words because BG3SC bases are 1K-word granular; the fetch reads two
# rows of it (row 0 = the H words, row 1 = the V words, because BG3VOFS is 0
# and the V row is the H row plus 0x20 words — SnesPpu.cpp:273). The other 30
# rows are addressable and never read, which is what a 1K-word granularity
# costs and is cheaper than any way of avoiding it.
[[claims.vram]]
name = "smt_tab"
kind = "tilemap"
words = 0x400

# ---- getting a row in, every frame ----------------------------------------
# The V row, into VRAM, in VBlank: 32 words through the word port, from the
# resident blob. One queued transfer, 64 B — 1.1% of the measured VBlank byte
# pin — and it is the WHOLE per-frame cost of every column on screen moving.
[[claims.hdma]]
name = "smt_vrow"
registers = ["VMDATAL", "VMDATAH"]
mode = 1                 # 2-reg write-once: the $2118/$2119 word port
band = "scene"
phase = "vblank"
channels = 1

# ...and the melt's CHR under it: 4 contiguous tiles, 128 B, through the same
# word port on the same channel. TWO transfers a frame now, and the second is
# what makes the lava churn without a single extra tilemap word.
[claims.dma]
vblank_bytes_per_frame = 192
vblank_transfers_per_frame = 2

# ---- state ----------------------------------------------------------------
[[claims.dp]]
name = "smt_phase"
bytes = 2                # the accumulated animation phase, 8.8. The scene
                         # ADVANCES it through TS_STEP; this feature READS it
                         # in its VBlank commit — lakeside's division between
                         # `water`'s scroll and the scene that drives it

# The camera's world X, in pixels. It is smt_opt's because the TABLE is what it
# indexes: the read head moves with it, the two H ports carry it, and screen
# column 0's fallback is read at it. The knight follows it (smt_obj); nothing
# else in the rail has an opinion about it.
[[claims.dp]]
name = "smt_cam"
bytes = 2

# THE NMI'S OWN SCRATCH, AND IT IS SEPARATE ON PURPOSE. `smt_scratch` below is
# main-thread working space — `smt_plate_top` and the knight's draw hold
# intermediates in it — and the NMI can preempt either of them mid-use. The
# VBlank row walker now needs three words of its own (the row base, the camera
# column, and the word it reads back for screen column 0), and borrowing the
# main thread's would be a silent-corruption bug that only fired on the frames
# where the interrupt landed between two instructions.
[[claims.dp]]
name = "smt_nmi_scratch"
bytes = 6

# THE CAMERA THE PICTURE WAS ACTUALLY DRAWN FROM, published by the NMI at the
# moment it uses it. The main thread moves `smt_cam` AFTER the transfer has
# fired, so the camera a reader sees is one frame ahead of the one on screen —
# and at the world's left edge the clamp hides that, which is exactly the shape
# of thing that gets discovered late. This is the same fix the wall's pairing
# needed: JOIN ON WHAT DREW THE FRAME, not on the counter it came from. It is
# read only by tests; the rail itself never looks at it.
[[claims.dp]]
name = "smt_cam_shown"
bytes = 2

[[claims.dp]]
name = "smt_flatsel"
bytes = 2                # 0 = the running table, 1 = the flat control row

[[claims.dp]]
name = "smt_scratch"
bytes = 6                # THREE words of main-thread working space, at +0, +2
                         # and +4. `smt_plate_top` needs one because it wants
                         # both index registers to reach the blob
                         # (absolute-long indexed exists for X only) and so
                         # cannot hold its intermediate in one; the knight's
                         # draw needs three, to carry a driving quantity, a
                         # (mask, shift) pair and a table row across the same
                         # register pressure.
                         #
                         # ONE BLOCK, OFFSETS INSIDE IT, rather than three
                         # claims: they are one routine's scratch at a time and
                         # never live across a call, so three names would say
                         # they were independent when the thing that keeps them
                         # apart is that nothing else runs in between

# C4: the two fallback scrolls, in THIS scene.
#
# BG2VOFS is not decoration here: it is the level the melt sits at in every
# column whose bit 14 is clear, which is every plate column. BG1VOFS is the
# fallback for the gap columns, where BG1 is transparent at every row — so its
# value is unobservable and it is written anyway, because a register nobody
# establishes holds whatever the previous scene left in it.
#
# BG3's own registers are NOT here. The offset composition owns BG3SC,
# BG3HOFS and BG3VOFS and grants this scene's enter code the consent to write
# them; a raw claim on them beside the composition is the refusal above.
[[claims.reg]]
name = "smt_fallback"
registers = ["BG1VOFS", "BG2VOFS", "BG1HOFS", "BG2HOFS"]
scene_writes = ["BG1VOFS", "BG2VOFS", "BG1HOFS", "BG2HOFS"]

# ...AND THE OWNER CO-WRITES ALL FOUR, EVERY VBLANK, WHICH IS A SEPARATE
# PERMISSION. The scene's enter establishes them; `smt_nmi_row` then rewrites
# them per frame, because scrolling turned all four into live ports:
#
#   BG1HOFS / BG2HOFS  ARE the camera. The table quantises to 8 px and these
#       do not, so the read head steps one word per 8-px boundary and these
#       carry the remainder.
#   BG1VOFS / BG2VOFS  are the FALLBACK for every column the table does not
#       drive on that layer — which is a whole-screen quantity, not screen
#       column 0's. A word carries one enable bit, so a plate column displaces
#       BG1 and leaves BG2 here; a gap column displaces BG2 and leaves BG1
#       here. Column 0 is on top of that: the PPU clears the offset latches at
#       the start of each scanline's fetch, so the leftmost column cannot be
#       displaced at all and reads these too.
#       Loading them with column 0's own word — which the rail did, and shipped
#       — gave every plate column's melt one shared height belonging to the
#       left edge. BG2VOFS now carries the melt's base for the sixteen columns
#       that read it, and BG1VOFS carries column 0's word, because the columns
#       falling back on IT are gap columns with no plate pixels to place.
#       docs/100 §12.1.
#
# Declared rather than left to be inferred: the gate refused the build by name
# until it was, which is the check working. `scene_writes` says who ELSE may
# write; it does not say the owner stays out.
scene_writes_shared = ["BG1VOFS", "BG2VOFS", "BG1HOFS", "BG2HOFS"]
