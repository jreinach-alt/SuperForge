# sau_rom — boss_saucer's art and its five matrix tracks, in ROM. Global.
#
# ROM claims cannot be scene-scoped (mo_rom's ruling): the allocator packs one
# ROM window set for the whole composition. Every claim here is BACKED by an
# `.incbin` claim site in game/boss_saucer/main.asm (`make rom-unbacked`,
# docs/37). Bs_rom is this file's shape; the delta is the LUNGE pair and the
# larger OBJ sheet the rail's text cards need.
#
# THE BLOBS ARE AUTHORED, NOT IMPORTED (mo_rom's route).
# Tools/gen_saucer_assets.py draws the "Sable Halo" saucer from
# concentric-band predicates over the 128x128 tile grid: there is no source
# asset, so there is no converter between an asset and this output and nothing
# to ground-truth a converter against. Tools/gen_saucer_tracks.py bakes the
# five matrix blobs from the schedule constants the state machine uses, listed
# line by line in its header.
name = "sau_rom"
role = "blob"

# The interleaved Mode 7 VRAM image: even bytes = 128x128 tilemap, odd bytes =
# 8bpp CHR, exactly as the PPU reads the region. 32 KB = one whole LoROM
# window, so the single enter DMA cannot cross a bank boundary.
[[claims.rom]]
name = "sau_map"
bytes = 32768
dma_source = true

# --- the matrix tracks (format = m7_track's header) ------------------------
# THE RING: 256 headings at the rest scale (900 — a 100 px disc). On THIS rail
# only HOLD indexes it, because the fight does not rotate (`stz b_angle` at
# the HOLD exit); it also supplies the reference entry the generator's four
# seam asserts compare against. 2 + 256*4 bytes.
[[claims.rom]]
name = "sau_ring"
bytes = 1026

# THE REVEAL ramp: entry 0 = the pre-reveal pose (angle 0, scale 1260 — the
# matrix battle_init shows before the fade lifts), entries 1..60 = the grow-in,
# angle f, scale lerped 1260 -> 900 endpoint-exact. Entry 60 == ring[60], the
# reveal->hold seam. 2 + 61*4 bytes.
[[claims.rom]]
name = "sau_reveal"
bytes = 246

# THE LUNGE, approach half: entry 0 = the FAR/rest pose (== ring[0]), entries
# 1..44 = the dive, angle 0, scale 900 -> 637 at -6/frame, terminal clamp
# on the 44th. The ramp ends by COMPARISON against the target scale, not by
# counting frames, so 44 — not the nominal 40 — is the realized length; the
# generator DERIVES that rather than trusting the nominal figure. 2 + 45*4
# bytes.
[[claims.rom]]
name = "sau_appr"
bytes = 182

# THE LUNGE, retreat half: entry 0 = the apex pose (== appr[44]), entries 1..44
# = the climb back, +6/frame, terminal clamp onto ring[0]. A SEPARATE blob
# because the two ramps are NOT each other's reverse — the truncation lands on
# different frames (reversed-approach frame 1 is 642, retreat frame 1 is 643),
# and the generator asserts they differ so a "just walk one blob backwards"
# simplification cannot land silently. 2 + 45*4 bytes.
[[claims.rom]]
name = "sau_retr"
bytes = 182

# THE DEATH ramp: entry 0 = ring[0] (the fight->death seam — EXACT here, not
# captured, because the fight holds angle 0), entries 1..60 = the recede, angle
# 3f, scale 900 + 6f. It LANDS on the reveal's own start scale at f=60
# (900 + 360 = 1260), so the saucer recedes to exactly the distance it arrived
# from and the loop closes on one size — asserted in the generator. 2 + 61*4
# bytes.
[[claims.rom]]
name = "sau_death"
bytes = 246

# The floor palette: 16 BGR555 words. Mode 7 is 8bpp with ABSOLUTE CGRAM
# indices and index 0 is the backdrop slot — the generator's predicate paints
# world tile (0,0) with the night sky so the row-major dedup lands it there by
# construction. Authored colours are fewer than 16; the generator pads the tail
# with the sky tone so the claim, the file and the CGRAM upload are all exactly
# 16 words.
[[claims.rom]]
name = "sau_pal"
bytes = 32

# The OBJ sheet: 48 tiles x 32 B (three 16-tile VRAM rows) — bs_rom's 32 plus
# one row, because this rail composes its title and result cards out of GLYPH
# sprites. Player 16x16 x2 frames at {0,1,16,17}/{2,3,18,19}; the 8x8 cast in
# row 0's tail (shot 5, pip lit 6, pip dim 7, beam body 8, beam telegraph 12,
# muzzle flare 13, far star 14, near star 15) plus the exhaust and banner
# cells; the eighteen glyph faces from tile 20. The two star faces cost the
# sheet nothing — they took row 0's last two cells, which were already
# allocated and blank.
[[claims.rom]]
name = "sau_sprite_chr"
bytes = 1536

# BOTH OBJ palettes, 32 BGR555 words: palette 0 (the cast, CGRAM 128..143)
# then palette 1 (the star field, 144..159). One blob because the two cgram
# claims are pinned contiguous, so one enter-time loop uploads both; sau_obj's
# feature.toml carries why the stars get a palette of their own.
[[claims.rom]]
name = "sau_sprite_pal"
bytes = 64
