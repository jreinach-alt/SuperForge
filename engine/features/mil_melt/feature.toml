# mil_melt — the melt's BANDS: the offset table read three rows at a time.
#
# The hall reads ONE row of mil_opt's table for the whole frame. This room
# reads THREE, one per band of the picture, because the PPU fetches the row
# BG3VOFS names (rowOffset = VScroll >> 3, SnesPpu.cpp:257-276) and a channel
# rewriting that port per scanline hands each band its own 32 words:
#
#   band A  the machines and the car      the hall's running row
#   band B  the deck                      a row with NO enable bit — the
#                                         control, in the picture itself
#   band C  the channel                   a RIPPLE row: every column a
#                                         vertical word, in the same screen
#                                         columns that carry a HORIZONTAL
#                                         word two bands up
#
# That last line is what this room exists to show: mode 4 makes the axis a
# per-column choice, and bands make it a per-column, per-BAND choice.
#
# The declaration is the SCENE's, not the table's. mil_opt's offset claim is
# global — every room of the rail composes it — and only this room reads it
# in bands, so `[[claims.offset_bands]]` rides on a scene-scoped feature
# beside the table rather than as a field on it. The composition synthesizes
# the channel that drives BG3VOFS (`mil_bands_rowsel`), assigns it, emits it,
# and marks its own BG3VOFS ownership `seed`; this feature arms the channel
# through the scene_mgr shadow at enter and never touches HDMAEN itself.
name = "mil_melt"
role = "feature"
depends = ["mil_opt"]

[[claims.offset_bands]]
name = "mil_bands"
rows = 3

# THE HDMA TABLE: three non-repeat entries and a terminator, 10 bytes used.
# Built once at enter — the melt's camera does not move, so its band edges
# are constants of the picture (SMIL_BAND_*_LINES, from the generator).
[[claims.wram]]
name = "mil_bandtab"
bytes = 16
dma_source = true        # HDMA reads it; it must not straddle a WRAM bank
