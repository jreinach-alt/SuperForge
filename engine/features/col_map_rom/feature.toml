# col_map_rom — the world's collision flag table (global feature).
#
# A separate feature from the scene-scoped `col_map` for the same reason
# `vwf_rom` is separate from `vwf` and `font_rom` from `bg_text`: ROM data is
# physically game-lifetime, one .incbin serves every scene. Here that split is
# not merely conventional but FORCED — the .incbin + .assert site lives at top
# level in game/microzero/main.asm, and docs/09 §4.1 records that top-level
# code cannot dereference a scene-scoped symbol. A scene-scoped claim would not
# link.
#
# Generated by tools/gen_col_flags.py, DERIVED from gen_m7_assets' own
# DRIVABLE_TILE_IDS / TRACK_TILE_IDS rather than authored — see that file's
# header and the audit record decision D2. One definition of the tile
# vocabulary, so the flags cannot drift from the map.
name = "col_map_rom"
role = "blob"

[[claims.rom]]
name = "col_flags"
bytes = 256              # one flag byte per world tile id.
                         #
                         # 256 entries is TOTAL, not generous: the world blob
                         # is one byte per tile (gen_m7_assets.world_map), so
                         # every id a world byte can hold has an entry and the
                         # lookup needs no bounds check. Index a 10-bit tile id
                         # with `& $FF` instead and two different tiles quietly
                         # share a flag byte; one-byte ids remove that trap
                         # rather than documenting it.

# --- the flag bits (DECLARED here; mirrored in tools/gen_col_flags.py) -------
#
#  bit 0 DRIVABLE the car belongs on it: road, centre line, start/finish
#  bit 1 TRACK part of the course surface: DRIVABLE plus the kerbs
#
# A byte of independent bits rather than one "solid" bit, at identical cost:
# the table is a byte LUT either way and col_map returns the byte it loaded, so
# the caller masks the bit it wants with one `and`. The two bits are a real
# lattice, not two names for one predicate — every DRIVABLE tile is TRACK, and
# a kerb is TRACK without being DRIVABLE. The four rails that demand col_map
# (mode7_explore, platformer_stream, m7_dungeon, m7_oshoot) need more than
# "solid"; platformer_stream distinguishes SOLID / PLATFORM / HAZARD.
# Design-study decision D3.
