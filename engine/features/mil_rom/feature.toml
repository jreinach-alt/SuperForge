# mil_rom — the machine hall's blobs, in ROM.
#
# Split from mil_bg for the reason every *_rom feature in this tree is split:
# a ROM claim is placed by the packer and read by an .incbin whose address the
# main file asserts, so the claim and the art belong together and the CODE that
# uploads them does not.
name = "mil_rom"
role = "blob"

# The offset row table: SMIL_PHASES rows of SMIL_COLS words. One word a column
# — mode 4 fetches ONE (SnesPpu.cpp FetchTileData case 2 under BgMode 4) — and
# bit 15 of each picks whether it displaces vertically or horizontally.
[[claims.rom]]
name = "mil_row"
bytes = 8256             # 128 phases + the flat control, x 32 words

[[claims.rom]]
name = "mil_chr1"
bytes = 24576            # 384 tiles x 64 B. EIGHT bpp: a tile is 64 bytes, not
                         # 32, which is the whole reason O9 exists.
                         #
                         # RAISED from 20,480 when the palette was fitted to the
                         # art instead of interpolated through it: a richer
                         # palette DEDUPES LESS, because fewer 8x8 blocks come
                         # out byte-identical once the shading between them
                         # survives quantisation. 328 tiles needed against the
                         # old 320-tile page, and the page is the resource — how
                         # much of it the art uses is a number the generator
                         # prints.

[[claims.rom]]
name = "mil_chr2"
bytes = 1024             # 64 tiles x 16 B. TWO bpp, on the same screen

[[claims.rom]]
name = "mil_map1"
bytes = 4096             # 32x64 words

[[claims.rom]]
name = "mil_map2"
bytes = 4096

# ONE BLOB, TWO GROUPS, SMIL_PAL2_OFF between them. Two claims would be two
# blobs the packer orders by SIZE, and an uploader that reached the second by a
# distance from the first would be reading a signed offset whose sign the
# packer decides. smt_pal.bin is one blob for the same reason.
[[claims.rom]]
name = "mil_pal"
bytes = 208              # BG1's 96-word ramp set, then BG2's two groups

# ---- the rider ------------------------------------------------------------
[[claims.rom]]
name = "mil_obj"
bytes = 8192             # 16 slots x 16 tiles x 32 B — ten rider cells and the
                         # lift leaf, in one blob and one upload

# The lobby's own BG1 tilemap. The CHR page is shared with the hall, so this is
# the entire cost of a second room.
[[claims.rom]]
name = "mil_lobby"
bytes = 4096             # 32x64 words, the same shape as the hall's

[[claims.rom]]
name = "mil_obj_pal"
bytes = 64               # 32 words: OBJ palettes 0 (rider) and 1 (leaf)
