# shp_floor — the split_h_persp_demo rail's Mode 7 plane. Scene-scoped.
#
# The world under BOTH perspective bands: one 128x128 wrapping checker plane,
# uploaded once at scene enter and never touched again. Everything that makes
# the two bands look different is the CAMERA's doing (shp_cam), not this
# feature's — which is the whole point of the rail and the reason the plane is
# declared separately from the split.
#
# WHY NOT `sh2_floor`, which this is otherwise shaped exactly like — same five
# CGRAM words at 0, same one-DMA interleaved upload, same BGMODE/TM/M7SEL.
# ONE of three differs rather than three of three: `depends = ["sh2_rom"]`
# binds it to the split_h_2p rail's blobs and its floor_arm names that rail's
# labels. That is a thinner margin than the ruling `shm_floor` took against
# this same feature (three of three) and it is worth saying plainly: a feature
# in this allocator cannot take a blob as a PARAMETER — `depends` is by name
# and floor_arm's `.incbin` labels are resolved at assembly — so "the same
# code against a different blob" is a new feature here by construction, not by
# judgement. If features ever gain a blob parameter, this pair and `shm_floor`
# are the first three that collapse into one.
#
# WHY NOT `mode7_floor`: it depends on `world_rom` (a 256 KB map this rail
# never reads) and pins CGRAM 0..16 for microzero's palette.
#
# WHY NO `hdma` CLAIM. The plane is static: the world does not scroll, rotate
# or stream. Every per-scanline channel on this rail belongs to shp_cam.
name = "shp_floor"
role = "feature"
depends = ["shp_rom"]

# The enter-time upload: ONE DMA for the whole interleaved blob. mode 1 drives
# VMDATAL then VMDATAH alternately, which IS the interleave — even source byte
# to $2118 (tilemap), odd to $2119 (CHR) — so the blob streams straight in with
# no unpacking and no second pass. phase forced_blank: scene_mgr's enter clears
# HDMAEN and zeroes NMITIMEN, so this cannot race an active or vblank claim
# even on a shared channel number.
[[claims.dma_init]]
name = "shp_up"
channel = 0
registers = ["VMDATAL", "VMDATAH"]
mode = 1

# The Mode 7 region is the fixed pinned 32 KB at words $0000-$3FFF — a hardware
# address, not a packing decision, which is why `kind = "mode7"` takes neither
# `words` nor `tiles` (giving them is a schema error).
[[claims.vram]]
name = "m7"
kind = "mode7"

# HARDWARE CONTRACT: a Mode 7 8bpp pixel value IS an absolute CGRAM index, so
# this palette can only live at 0. Five colours is the whole world — a
# backdrop, a COOL pair with red 0 and a WARM pair with red high.
#
# Word 0 is included DELIBERATELY and is not spare: it is both palette index 0
# and the Mode 7 BACKDROP slot. A scene composing `backdrop` alongside this
# must refuse the build — colour 0 has one owner (and sh2_floor /
# shm_floor / m7dg_floor / mode7_floor all say the same).
[[claims.cgram]]
name = "shp_pal"
words = 5
at = 0

# C4 (docs/09 §2.1): the scene's base display shape, written ONCE under forced
# blank for the whole frame.
#
# THIS RAIL DOES NOT SPLIT THE VIDEO MODE. Both bands are Mode 7 for all 224
# lines; the split is a split of the camera MATRIX and ORIGIN, not of
# BGMODE/TM. That is why `split_band` is not composed and is not generalised —
# there is no second splitter here (the same ruling sh2_floor's and
# shm_floor's headers record).
#
# ATTRIBUTION. M7SEL is written by this feature's own floor_arm — it is a Mode
# 7 register and Mode 7 is this feature's mechanism. BGMODE and TM are written
# by the scene's enter code, which has no feature.toml of its own, so they are
# attributed to the feature they SERVE and opened through `scene_writes`. The
# lies-check compares per REGISTER, which is why this works: the opened set
# (BGMODE, TM) and the owner-written set (M7SEL) are disjoint.
[[claims.reg]]
name = "shp_display"
registers = ["BGMODE", "TM", "M7SEL"]
scene_writes = ["BGMODE", "TM"]
