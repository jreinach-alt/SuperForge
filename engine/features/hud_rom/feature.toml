# hud_rom — the hud_game rail's art: one OBJ tile and one OBJ palette.
#
# GLOBAL blob feature rather than claims hung on hud_obj, for the reason
# room_rom, font_rom and breaker_rom all state: ROM data is physically
# game-lifetime (one .incbin serves every scene), and the mechanical reason is
# binding — ca65 resolves scopes BACKWARD, so a `.incbin` site in main.asm
# cannot name a symbol from a `.scope play` included after it.
#
# Generated by tools/gen_hud_assets.py; each claim site .asserts the blob's
# linker bank/addr against the emitted symbols, so allocator<->linker drift
# refuses the build.
name = "hud_rom"
role = "blob"

[[claims.rom]]
name = "hud_obj_chr_rom"
bytes = 32               # 1 tile x 32 B 4bpp: the player block

[[claims.rom]]
name = "hud_obj_pal_rom"
bytes = 32               # 16 BGR555 words — OBJ palette 0
