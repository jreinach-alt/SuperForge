# haze — heat shimmer: a per-scanline BG1HOFS displacement, delivered by HDMA.
#
# =============================================================================
# THE WARP IS A TABLE, NOT ARTWORK
# =============================================================================
# The obvious way to draw heat haze is to draw it — author a "warped" copy of
# every affected tile and animate between them. That doubles the tile budget,
# warps only what was pre-drawn, and buys a distortion that cannot follow the
# art it distorts. The PPU already bends a whole layer for free: a different
# BG1HOFS per scanline, delivered by an HDMA channel during active display, at
# no CPU cost at all while the picture is being drawn.
#
# So nothing here is a haze tile. What this feature owns is a CHANNEL and a
# per-frame CHOICE of which resident phase that channel reads.
#
# =============================================================================
# ONE WRITE A FRAME, AND WHY THE STRIDE IS 256
# =============================================================================
# hz_rom holds 32 complete phases at 256 B each. A phase's address is
# HZ_WARP + (index << 8) — low byte always zero — so advancing the animation
# is ONE 8-bit store to the channel's A1T high byte in the VBlank hook. The
# alternative, rebuilding the table per frame, is priced by platformer_bg at
# ~16 cycles an entry (platformer_bg.asm:386): ~1,700 CPU cycles a frame over
# this band, every frame, for a picture that is already in ROM.
#
# THE RAMP IS BAKED IN AND THE PHASES SCROLL THROUGH IT. Amplitude is a
# function of SCREEN y — zero at the horizon, widest at the viewer's feet.
# Phase is a function of the table index. Because each blob carries its own
# correctly-ramped column, advancing the index scrolls the wave UPWARD through
# a ramp that stays pinned to the screen. Heat rises, for nothing.
#
# =============================================================================
# BG1HOFS IS CLAIMED TWICE BY THIS FEATURE, ON PURPOSE
# =============================================================================
# `hzwarp` drives the port per scanline across the band; `hz_seed` is the CPU
# write that establishes the base scroll the head-skip entry restates and that
# holds for lines 0..119. A CPU-written register with a transfer claim on the
# same port refuses unless the CPU write says it is a seed the transfer
# overrides (allocate.check_reg_ownership, checks 2 and 3) — and a seed with
# nothing overriding it is itself refused, so the pair has to be real. shg_cam
# declares the same shape for the same reason.
#
# =============================================================================
# REGION
# =============================================================================
# The phase advance is a RATE — phases per frame — so it takes exactly one
# factor of the region ratio, which is exactly what one TS_STEP applies. The
# accumulator pair belongs to the CONSUMER and lives in the rail's state.toml;
# what this feature holds is the accumulated phase itself, because the routine
# that READS it is this feature's own VBlank commit.
name = "haze"
role = "feature"
depends = ["hz_rom"]

# ---- the vocabulary (stage 2) --------------------------------------------
# THE DISPLACEMENT AND THE BLEND ARE ONE FEATURE, and that is the composition
# this rail exists to show. `hz_bg` designates bg1 and bg3 to the main screen
# and knows nothing about either; this feature designates bg2 to the SUB
# screen, declares what the blender does with it, and separately owns two HDMA
# channels. Four write-only ports — TM, TS, CGWSEL, CGADSUB — are composed
# from claims, and no feature claims one.
[[claims.screen]]
layer = "bg2"
on = "sub"

# `half` is what makes this glare rather than a wash: CGADSUB bit 6 shifts the
# sum right by one, so a composited pixel is min((main + sub) >> 1, 31) per
# 5-bit channel.
#
# `source = "sub"` is the load-bearing field. With it the addend is the sub
# screen's pixel, and where the sub screen is EMPTY the hardware substitutes
# the fixed colour AND DISABLES HALVING — so the world arrives unhalved
# everywhere the shimmer is transparent, which is most of the band. That
# fallback is what keeps the desert bright instead of fogged, and it is the
# case that tells a real sub-screen blend from a palette trick.
#
# THE `math` LIST IS ["bg1"] AND THE OMISSIONS ARE THE POINT:
#   bg1       the world — the thing the heat is coming off. This is the blend.
#   backdrop  ABSENT. The backdrop is this rail's sky, above the band, and
#             admitting it would glare the sky too — which is the concept
#             sheet's "use heat haze locally, only near sources" refused at
#             the declaration rather than by hoping the art stays out of the
#             way. `water` admits it and is right to: there, a hole in the
#             world under the surface should still read as water.
#   bg3       ABSENT. The text draws over the desert and must stay legible, so
#             its pixels are not admitted and render at full intensity.
#   obj       absent because this rail has no sprites to designate.
#
# clip/prevent stay at their defaults ("never"): this rail programs no colour
# window, and a windowed mode with no window claimant would compose a mode
# that collapses to a fixed one (docs/99 section 8).
[[claims.blend]]
op = "add"
half = true
source = "sub"
math = ["bg1"]

# ---- the channel ----------------------------------------------------------
# Mode 2 is one register written TWICE per transfer, which is exactly what a
# BGnHOFS write-twice latch wants — platformer_bg's parallax channel says the
# same thing about the same port. Direct, not indirect: the ROM blob IS the
# source.
#
# `band` is the declared truth about WHERE the port is driven per scanline.
# The table's leading non-repeat entry covers lines 0..119 by restating the
# seed value, which is the head-skip an HDMA channel needs because HDMA always
# begins at line 0 — it holds the base, it does not distort.
[[claims.hdma]]
name = "hzwarp"
registers = ["BG1HOFS"]
mode = 2
band = [100, 224]
phase = "active"
channels = 1

# THE SHIMMER'S OWN CHANNEL, and the reason it is a second one rather than a
# second register on the first: HDMA mode 2 drives ONE register. So the layer
# in front and the world behind it get a channel each, both reading the SAME
# 33-blob table — at phases HZ_SHIM_LEAD apart.
#
# THAT OFFSET IS THE WHOLE TRICK. Real heat haze is refraction: the thing
# doing the bending and the thing being bent do not move together. Give both
# layers the same phase and the shimmer rides the world like a decal; give
# them different phases and the glare slides across a surface that is itself
# moving, which is what the eye reads as air. It costs one more 8-bit store a
# frame and no extra ROM at all.
[[claims.hdma]]
name = "hzshim"
registers = ["BG2HOFS"]
mode = 2
band = [100, 224]
phase = "active"
channels = 1

# The base scrolls, established at scene enter and overridden by the two
# channels across the band. See the header: each pair is required to be real —
# a seed with nothing overriding it is refused, and so is a plain owner
# standing against a transfer claim.
[[claims.reg]]
name = "hz_seed"
registers = ["BG1HOFS", "BG2HOFS"]
seed = true

# BG2's layout, written by the scene at enter. NOT TM and NOT TS — those are
# the vocabulary's, composed from the screen claims above; a raw claim on
# either beside them is refused (R6). NOT BG12NBA either: that byte carries
# BG1's chr base nibble AND BG2's in one write-only port, so it has one owner
# per scene whatever the vocabulary does. It sits with `hz_bg`, the feature
# that decides the scene's display shape, which folds this layer's emitted
# ES_V_HZ_SHIM_CHR_NBA into its own write — `breaker_bg` is the precedent and
# `lake_bg` the sibling. The composition NAMES that split as a warning; it is
# accurate and it is deliberate.
[[claims.reg]]
name = "hz_shim_layer"
registers = ["BG2SC", "BG2VOFS"]
scene_writes = ["BG2SC", "BG2VOFS"]

# ---- the shimmer layer's art ---------------------------------------------
[[claims.dma_init]]
name = "hz_shim_up"
channel = 1
registers = ["VMDATAL", "VMDATAH"]
mode = 1

[[claims.vram]]
name = "hz_shim_chr"
kind = "chr"
tiles = 9
tile_bytes = 32          # 4bpp

[[claims.vram]]
name = "hz_shim_map"
kind = "tilemap"
words = 0x400            # 32x32; BG2SC bases are 0x400-word granular

# BG2 reads palette GROUP 2 — CGRAM words 32..47. Group 0 is the world's
# (hz_bg claims it, word 0 included, because word 0 is the transparent slot
# and the hardware backdrop at once); group 1 would overlap bg_text's 2bpp
# palette 7 at words 28..31. Group 2 is the first that collides with neither,
# and the map authors the attribute bits to match.
[[claims.cgram]]
name = "hz_shim_pal"
words = 16
at = 32

# The accumulated phase index, 0..31. u16 so the advance is a plain add and
# the wrap is one mask; the loop closes at 32 because both wave components
# complete a whole number of cycles there.
#
# NO [init] zero: `hz_arm` writes it at scene enter, and scene_mgr holds NMI
# masked across the whole switch, so the first VBlank that can commit it is
# the first one after the arm (water and scroller_bg reach the same
# conclusion).
[[claims.dp]]
name = "hz_phase"
bytes = 2

# WHICH BLOB IS ON SCREEN: 0 = the animation's current phase, 1 = the flat
# control. Held apart from `hz_phase` on purpose — flattening the picture must
# not lose the animation's position, so that a scene toggling the effect off
# and on again resumes rather than restarts. u16 to match the direct-page
# claim class; only bit 0 is read.
[[claims.dp]]
name = "hz_flat"
bytes = 2
