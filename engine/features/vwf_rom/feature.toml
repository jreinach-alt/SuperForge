# vwf_rom — the VWF face, as the two artifacts the compositor reads and nothing
# else. Generated by tools/gen_vwf_font.py from vendor/fonts/unscii-8.hex.
#
# A separate feature for the same reason font_rom is: ROM data is physically
# game-lifetime (one .incbin serves every scene), so the claim lives here rather
# than in the scene-scoped vwf. The claim sites .assert the blobs' linker
# bank/addr against ES_R_VWF_GLYPHS_*/ES_R_VWF_WIDTHS_*.
#
# This is also the whole of the face's coupling to the renderer. vwf.asm names
# these two symbols and contains no glyph data, no width constant and no
# per-character special case, so swapping the face is: point the generator at a
# different .hex and rebuild. docs/11_font_assets.md §3 keeps that question
# open deliberately — unscii-8 is monospace, so prose renders close to
# monospace, and that is the source font rather than the renderer.
name = "vwf_rom"
role = "blob"

[[claims.rom]]
name = "vwf_glyphs"
bytes = 768              # 96 glyphs x 8 B: 1bpp row masks, LEFT-ALIGNED.
                         # 1bpp because compositing shifts ONE plane instead of
                         # two; the commit expands BP0 == BP1 so VWF text lands
                         # on colour 3 of bg_text's text_pal and needs no CGRAM
                         # claim of its own. Left-aligned because unscii-8's
                         # bearings measure 0/1/2/3 px, so a pen position would
                         # otherwise inherit a variable per-glyph gap.

[[claims.rom]]
name = "vwf_widths"
bytes = 96               # one advance byte per glyph = ink + letterspacing
