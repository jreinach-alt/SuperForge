# water_rom — every immutable byte the `water` feature reads.
#
# A `blob`: ROM claims, no behaviour, no asm — the role that exists precisely
# because a claim set cannot distinguish it from a feature (AGENTS.md).
#
# Split from `lake_rom` rather than merged into it because `water` is meant to
# be composable into another rail: the surface's art travels with the feature
# that draws it, and the world's art travels with the world.
#
# All three blobs come from tools/gen_lakeside_assets.py, which holds the tile
# patterns and the colour constants. See that generator's header for what each
# one is and why the palette values are what they are.
name = "water_rom"
role = "blob"
depends = []

[[claims.rom]]
name = "wat_chr"
bytes = 1088             # 34 x 4bpp tiles: 0 empty (the edge), the two
                         # zones' ripple and zone-seam tiles, the highlight's
                         # display slot and its four phases, and the swash
                         # band's 16 display slots

[[claims.rom]]
name = "surf_chr"
bytes = 16384            # 32 surf phases x 16 slots x 32 B.
                         #
                         # THE BIGGEST BLOB IN THE RAIL, and it is what buys
                         # the wave. The alternative to holding every phase
                         # resident is composing the band's tiles at run time,
                         # which is CPU inside VBlank on a machine that has
                         # ~28-37k cycles for a whole frame; the alternative to
                         # a 4 px phase step is a coarser wave. ROM is the one
                         # budget here with room to spare (the allocation
                         # report prints what is left), so the wave is paid for
                         # in the cheap currency.
                         #
                         # ONE PHASE'S BLOCK IS 512 CONTIGUOUS BYTES and the
                         # whole blob sits inside one 32 KB LoROM window, so a
                         # transfer of one block can never straddle a bank —
                         # the constraint substrate.toml records as
                         # dma_source_bank_span = false.

[[claims.rom]]
name = "wat_map"
bytes = 2048             # 32x32 tilemap words — the surface, in two zones

[[claims.rom]]
name = "wat_pal"
bytes = 32               # 16 CGRAM words — BG palette group 2 (words 32..47)
