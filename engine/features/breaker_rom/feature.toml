# breaker_rom — the breaker rail's art blobs: BG tiles + palettes, the BG2
# wash bed, the paddle/ball OBJ tiles, and the OBJ palette.
#
# GLOBAL blob feature rather than claims hung on breaker_bg / breaker_obj, for
# the reason room_rom and font_rom both state: ROM data is physically
# game-lifetime (one .incbin serves every scene), so the claim belongs where
# the data is, not where it is consumed. The mechanical reason is the binding
# one -- ca65 resolves scopes BACKWARD, so a `.incbin` site in main.asm cannot
# name a symbol from a `.scope play` included after it. Scene-scoped ROM
# claims would force the blob block below the scenes, which is the wrong
# shape.
#
# NOT here: the backdrop gradient tables. rgb_gradient claims those itself
# (`grad_tabs`, 672 B) because they are the feature's own data -- breaker only
# supplies the bytes (tools/gen_breaker_assets.py) and .incbins them against
# rgb_gradient's emitted ES_R_GRAD_TABS_* symbols.
#
# Generated by tools/gen_breaker_assets.py; each claim site .asserts the
# blob's linker bank/addr against the emitted symbols, so allocator<->linker
# drift refuses the build.
#
# NO BG TILEMAP BLOB, and that is the rail's defining shape. `breaker`'s BG1
# map is not art -- it is the level, it is BUILT by CPU under the enter-time
# forced blank (brk_build_level), and it MUTATES during play as bricks break.
# A 2 KB ROM tilemap would be a second source of truth for something the game
# rewrites 180 times per round.
name = "breaker_rom"
role = "blob"

[[claims.rom]]
name = "brk_bg_chr_rom"
bytes = 192              # 6 tiles x 32 B 4bpp: empty, wall, 4 brick colours

[[claims.rom]]
name = "brk_bg_pal_rom"
bytes = 32               # 16 BGR555 words -- BG palette 2

[[claims.rom]]
name = "brk_sky_chr_rom"
bytes = 32               # 1 tile, solid colour 1: the BG2 bed the wash lands on

[[claims.rom]]
name = "brk_sky_pal_rom"
bytes = 32               # 16 BGR555 words -- BG palette 3

[[claims.rom]]
name = "brk_obj_chr_rom"
bytes = 64               # 2 tiles x 32 B: paddle segment, ball

[[claims.rom]]
name = "brk_obj_pal_rom"
bytes = 32               # 16 BGR555 words -- OBJ palette 0
