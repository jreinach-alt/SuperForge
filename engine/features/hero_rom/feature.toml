# hero_rom — the room hero's CHR + palette blobs (global feature).
# ROM data is game-lifetime; the claim sites .assert against the emitted
# bank/addr (font_rom convention). Generated by tools/gen_hero_sprite.py.
name = "hero_rom"
role = "blob"

[[claims.rom]]
name = "hero_chr_rom"
bytes = 1024             # 32 tiles x 32 B 4bpp (hero in tiles 0,1,16,17 —
                         # the PPU reads 16x16 sprites at N,N+1,N+16,N+17)

[[claims.rom]]
name = "hero_pal_rom"
bytes = 32               # 16 BGR555 words (OBJ palette 0)
