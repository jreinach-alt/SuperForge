# car_rom — the player car's CHR + palette blobs (global feature).
# ROM data is game-lifetime; the claim sites .assert against the emitted
# bank/addr (font_rom convention). Generated by tools/gen_car_sprite.py.
name = "car_rom"
role = "blob"

[[claims.rom]]
name = "car_chr_rom"
bytes = 1024             # 32 tiles x 32 B 4bpp (car in tiles 0,1,16,17)

[[claims.rom]]
name = "car_pal_rom"
bytes = 32               # 16 BGR555 words (OBJ palette 0)
