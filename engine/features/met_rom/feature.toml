# met_rom — the meteor_event rail's art and its matrix track, in ROM. Global.
#
# ROM claims cannot be scene-scoped (mo_rom's ruling, bs_rom's after it): the
# allocator packs one ROM window set for the whole composition. Every claim
# here is BACKED by an `.incbin` claim site in game/meteor_event/main.asm
# (`make rom-unbacked`, docs/37).
#
# THE BLOBS ARE AUTHORED, NOT IMPORTED (mo_rom's route).
# Tools/gen_meteor_assets.py draws the meteor plane, the OBJ sheet and the two
# palettes from shape predicates: there is no source asset, so there is no
# converter between an asset and this output and nothing to ground-truth a
# converter against. Tools/gen_meteor_tracks.py bakes the scale/tumble track
# from the schedule constants the cutscene uses, listed line by line in its
# header.
name = "met_rom"
role = "blob"

# The interleaved Mode 7 VRAM image: even bytes = 128x128 tilemap, odd bytes =
# 8bpp CHR, exactly as the PPU reads the region. 32 KB = one whole LoROM
# window, so the single enter DMA cannot cross a bank boundary.
[[claims.rom]]
name = "met_map"
bytes = 32768
dma_source = true

# --- the matrix track (format = m7_track's header) -------------------------
# THE GROW RAMP. One entry per frame of the Mode-7 phase, each baking the
# COMPOSED matrix (tumble angle x affine scale) that would otherwise have to
# be solved at runtime. Entry 0 is the CROSSOVER pose (angle 0, scale
# $0E00) — which is also the pose the SPRITE phase holds, so one blob serves
# both phases.
#
# The entry angle is baked ABSOLUTELY rather than through the ring-capture
# idiom (m7_track/feature.toml's third consumer bullet): every ramp
# entry on this rail is reached from the KNOWN heading 0, because enter_scene
# does `stz g_angle` and the Mode-7 phase is the only thing that ever advances
# it. Same deterministic-entry shape as the boss's own reveal and as every one
# of boss_saucer's ramps — the capture idiom is available and this rail does
# not need it. 2 + 109*4 bytes.
[[claims.rom]]
name = "met_grow"
bytes = 438

# The Mode 7 floor palette: 16 BGR555 words. Mode 7 is 8bpp with ABSOLUTE CGRAM
# indices and index 0 is the backdrop slot — the generator's reserve-backdrop
# pass puts the night sky there (mo_rom's discipline), which is also what makes
# the plane read BLACK when the sprite phase parks it off-field.
[[claims.rom]]
name = "met_pal"
bytes = 32

# The OBJ sheet: 96 tiles x 32 B, laid out on the PPU's 16-tile VRAM row grid
# (a 16x16 sprite is {N, N+1, N+16, N+17}; a 32x32 is the 4x4 block from N).
#  rows 0-3, tiles 0/4/8 three 32x32 ROCKY meteor frames
#  row 4-5, tile 64 16x16 captured ground/platform block
#  tile 66 16x16 player
#  tiles 68/70/72 three 16x16 FIERY meteor specks
# One ladder of frames, drawn by the generator.
[[claims.rom]]
name = "met_obj_chr"
bytes = 3072
dma_source = true

# One OBJ palette, 16 BGR555 words — one ramp for the whole cast.
[[claims.rom]]
name = "met_obj_pal"
bytes = 32

# The Mode-1 level's BG CHR: 4 tiles x 32 B (4bpp). Tile 0 blank (the sky),
# tile 1 the green platform/ground block, tiles 2-3 spare so the claim is a
# whole 128 B; two are actually drawn.
[[claims.rom]]
name = "met_bg_chr"
bytes = 128
dma_source = true

# The Mode-1 level's BG palette: 16 BGR555 words at CGRAM 0. Word 0 is the
# backdrop AND BG palette-0 colour 0 — one owner by hardware contract.
[[claims.rom]]
name = "met_bg_pal"
bytes = 32
