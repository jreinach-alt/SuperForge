# mil_opt — mode 4's ONE offset word a column, and the bit that picks its axis.
#
# =============================================================================
# WHAT THIS RAIL IS FOR
# =============================================================================
# Smelter proves offset-per-tile in mode 2, where a column gets a word for EACH
# axis and the axis is therefore not a choice. This proves the half mode 2
# cannot reach: mode 4 fetches ONE word per column and BIT 15 SELECTS ITS AXIS
# (Mesen2 SnesPpu.cpp FetchTileData case 2 under BgMode 4, and the bit-15 test
# at :156-161), so a single 32-word row pumps one bay vertically and runs the
# next sideways.
#
# `axis = "both"` UNDER MODE 4 MEANS THAT, and it is a declaration this
# vocabulary refused until this rail asked for it. The refusal reasoned about a
# COLUMN — a mode-4 column carries one axis, which is true — and rejected a
# claim about the TABLE. It is a warning now, because the same word means
# "both axes per column" one mode over (docs/100 §5, O7).
name = "mil_opt"
role = "feature"
depends = ["mil_rom"]

[[claims.offset]]
name = "mil_table"
axis = "both"
layers = ["bg1", "bg2"]

# Mode 4: bg1 8bpp + bg2 2bpp. The depths are the reason the art is split into
# two CHR claims at 64 and 16 bytes a tile (mil_bg), and O9 checks each of them
# against this number.
[[claims.video]]
name = "mil_mode"
mode = 4

# BG3's map IS the table. Mode 4 reads ONE row of it — the row BG3VOFS selects,
# through GetHorizontalOffsetByte — so 31 of the 32 rows this 1K-word claim
# reserves are addressable and never read. That is what BG3SC's 1K granularity
# costs and it is cheaper than any way of avoiding it.
[[claims.vram]]
name = "mil_tab"
kind = "tilemap"
words = 0x400

# ---- getting the row in, every frame --------------------------------------
# 32 words through the word port in VBlank, from the resident blob: 64 B, and
# it is the whole per-frame cost of every column on screen moving on its own
# axis.
[[claims.hdma]]
name = "mil_vrow"
registers = ["VMDATAL", "VMDATAH"]
mode = 1
band = "scene"
phase = "vblank"
channels = 1

[claims.dma]
vblank_bytes_per_frame = 64
vblank_transfers_per_frame = 1

# THE ROW IS NOW STAGED IN WRAM, not transferred straight out of ROM. The
# camera has to be folded into every vertical word, so the VBlank walker reads
# the ROM row, adds the camera to the words whose axis bit is set, and DMAs the
# result. 32 words of CPU work a frame buys a scrolling world; the alternative
# is a table indexed by BOTH phase and camera, which is the same picture at
# CAM_MAX times the ROM.
[[claims.wram]]
name = "mil_stage"
bytes = 64

# ---- the fallback ports ---------------------------------------------------
# NOT THE CAMERA — the FALLBACK. A column whose word does not carry a layer's
# enable bit shows that layer at its own BGnVOFS/BGnHOFS, so on this rail BG1's
# ports are what every BELT column shows for BG1 and BG2's are what every
# PISTON column shows for BG2. Screen column 0 is on top of that: the PPU
# clears the offset latches at the start of each scanline's fetch
# (SnesPpu.cpp:284-287), so the leftmost column cannot be displaced at all and
# reads these too.
#
# THE OWNER WRITES THEM AND NOBODY ELSE DOES, which is why there is no
# `scene_writes` here and smelter's equivalent needs two: smelter's title scene
# is mode 1 and the ports there are the PICTURE'S POSITION, so a second feature
# owns them in that scene. This rail has one scene and one meaning for them.
#
# BG3's own three ports are NOT here. The offset composition synthesizes
# ownership of BG3SC/BG3HOFS/BG3VOFS and grants the SCENE'S enter code the
# consent to write them; a raw claim on them beside the composition is O5's
# register arm and would stop the build by name.
# ...and the SCENE may write them too, because the lobby is a second mode-4
# scene that uses no offsets at all: it establishes the four ports at rest
# itself rather than calling into a walker whose constants belong to the hall.
# `scene_writes` says who ELSE may write; it does not say the owner stays out.
[[claims.reg]]
name = "mil_fallback"
registers = ["BG1VOFS", "BG2VOFS", "BG1HOFS", "BG2HOFS"]
scene_writes = ["BG1VOFS", "BG2VOFS", "BG1HOFS", "BG2HOFS"]

# ...AND THE OWNER CO-WRITES ALL FOUR, WHICH IS A SEPARATE PERMISSION. In the
# hall `mil_commit_vofs` rewrites the two V ports every VBlank because they
# carry the camera for every undriven column; in the lobby the scene
# establishes all four at rest and nothing touches them again. Declared rather
# than left to be inferred: the gate refused the build by name until it was,
# which is the check working — a permission nobody checked against the code is
# worth as much as an undeclared write.
scene_writes_shared = ["BG1VOFS", "BG2VOFS", "BG1HOFS", "BG2HOFS"]

# ---- state ----------------------------------------------------------------
[[claims.dp]]
name = "mil_phase"
bytes = 2                # the accumulated animation phase. The scene ADVANCES
                         # it through TS_STEP; this feature READS it in its
                         # VBlank commit

[[claims.dp]]
name = "mil_shown"
bytes = 2                # the phase the picture was actually drawn from,
                         # published by the NMI at the moment it uses it —
                         # smelter's `smt_cam_shown` lesson, which is that a
                         # test must join on what drew the frame and not on the
                         # counter it came from. Read only by tests

# THE CAMERA'S WORLD Y, in pixels, 0..SMIL_CAM_MAX. It is mil_opt's because
# the TABLE is what it enters: an offset word REPLACES a layer's scroll for its
# column rather than adding to it (vScroll = word & $3FF), so in a scrolling
# world every VERTICAL word must already carry the camera. Nothing else in the
# rail has an opinion about it.
[[claims.dp]]
name = "mil_cam"
bytes = 2

# ...and the camera the PICTURE was drawn from, published by the NMI at the
# moment it uses it. smt_cam_shown's lesson: join on what drew the frame, not
# on the counter the main thread will advance after the transfer fired.
[[claims.dp]]
name = "mil_cam_shown"
bytes = 2

[[claims.dp]]
name = "mil_flatsel"
bytes = 2                # 0 = the running row, 1 = the flat control row

[[claims.dp]]
name = "mil_nmi_scratch"
bytes = 8                # the VBlank walker's own, because the NMI can preempt
                         # the main thread mid-use of anything it shares
