# sau_obj — the saucer fight's cast: the gunship, the BEAM column, the HP HUD,
# the player shots, the thruster flame, and the glyph cards. Scene-scoped.
# Model: bs_obj (the same OAM disciplines, the same pool split).
#
# STABLE OAM SLOTS ARE THE CONTRACT: the draw assigns fixed slots and dead
# slots are PARKED at y=240 rather than skipped, so a test reads an actor by
# slot identity.
#
# THE MAP: 0 the gunship (16x16) 1-16 the beam column (16 x 8x8) 17-24 the
# saucer HP HUD (8 pips) 25-28 the player shots (4) 29 the thruster flame
# (FIGHT only) 30-53 the card cells (24) 54-55 hi-table pad, parked for the
# ROM's life 56-79 the STAR FIELD (24) Text cards are the one band that WANTS
# to be unbounded, and a claim has to name a bound, so the card band is sized
# to the widest thing it ever draws: the VICTORY word (7 glyphs) plus its
# 16-cell banner = 23, and the two-row boot title = 21 drawn cells. 24 covers
# both.
#
# EIGHTY SLOTS, TWENTY WHOLE HI BYTES. A hi-table byte covers four sprites; 80
# is 20 bytes with nothing left mid-byte, so all twenty can be REBUILT WHOLE
# every frame — mo_obj's ruling (its header carries the stale-X9 failure
# mode), paid here with two parked pad slots that close byte 13 between the
# card band and the stars.
#
# THE STARS ARE LAST ON PURPOSE, TWICE OVER. (1) Sprite-vs-sprite arbitration
# is by OAM INDEX (Mesen2 `SnesPpu::FetchSpriteData` walks `_spriteIndexes`
# from the top down, so the LOWEST index is written last and wins), so a star
# can never punch a hole in the gunship, the lance or a glyph. (2) The
# range-over rule drops the sprites evaluated LAST when a line holds more than
# 32, so if this rail ever crowds a scanline it loses a star and keeps the
# fight. Their LAYER position is not index-driven at all: they are drawn at
# OAM priority 0, which is the one OBJ priority Mode 7 places BELOW BG1
# (Mesen2 `SnesPpu::RenderMode7` maps OAM priorities 0..3 to 2/4/6/7 against
# BG1's 3), so the saucer's hull covers them and the transparent sky does not.
#
# OBSEL IS CLAIMED HERE (breaker_obj/m7dg_obj/mo_obj/bs_obj precedent):
# oam_sprites is the OAM transport, not the sprite size/base authority. Size
# pair 0 (8x8 / 16x16): the gunship is the LARGE half, everything else small.
name = "sau_obj"
role = "consumer"
depends = ["oam_sprites", "sau_rom", "pool"]

# The enter-time CHR + palette upload path. Channel is declared; DAS re-armed
# at the one arming site in sau_obj.asm (single-shot, per transfer).
[[claims.dma_init]]
name = "sau_obj_up"
channel = 0
registers = ["VMDATAL", "VMDATAH"]
mode = 1

# Per-frame draw scratch. A call frame, not state — every byte written before
# read inside one draw pass, so no `[init] zero`.
#  +0 screen x scratch +2 screen y scratch
#  +4 the hi-table SIZE bit +6 tile/attr scratch
[[claims.dp]]
name = "sau_draw"
bytes = 8

# THE SHOT POOL'S STORAGE. One region, offsets in game/boss_saucer/ saucer.inc:
# +0x00 alive[4] | +0x08 x[4] | +0x10 y[4] (24 B). ONE pool, not the boss
# rail's two: the saucer attacks with a BEAM, not with orbs, so there is no orb
# rain to pool and one alive array is the whole cast's storage.
#
# The arrays live here and not in state.toml because POOL_BIND takes a 24-bit
# CONSTANT base, so the alive array must be one emitted _LONG symbol plus a
# compile-time offset (bs_obj's reasoning, mo_obj's before it).
#
# NO `[init] zero`: battle_init pool_init's the alive array and spawn writes
# the parallel fields before any read (rule 5 — a pre-zero would hide a "the
# init stopped running" defect behind a plausible answer).
[[claims.wram]]
name = "sau_actors"
bytes = 24

# 48 tiles = three 16-wide OBJ rows = 1536 B = 768 words. The Mode 7 claim pins
# words $0000-$3FFF and the allocator floors OBJ CHR above it; the emitted
# ES_V_OBJ_CHR_OBSEL_BASE is what sau_obj.asm writes into OBSEL.
[[claims.vram]]
name = "obj_chr"
kind = "chr"
obj = true
words = 768

# One OBJ palette for the whole CAST — one ramp, so a second cast palette
# would buy nothing. OBJ palette 0 = CGRAM 128..143, a hardware contract.
[[claims.cgram]]
name = "sprite_pal"
words = 16
at = 128

# THE STAR PALETTE, and it is not a cast palette. OBJ palette 1 = CGRAM
# 144..159 (paletteRamOffset = 128 + (palette << 4) + colour, the hardware's
# own arithmetic). Three tones are authored and thirteen are padding, and the
# reason is a TEST property rather than an art one: every entry of palette 0
# already has an owner, and this rail's pixel counts are attributable only
# because no rendered tone belongs to two populations. Borrowing a cast tone
# for the stars would fuse two populations and silently disarm both counts.
# Sixteen CGRAM words on a rail using 32 of 256 is the cheap side of that
# trade. Pinned at 144 so it is CONTIGUOUS with sprite_pal — sau_obj.asm
# asserts the adjacency and uploads both palettes in one loop.
[[claims.cgram]]
name = "star_pal"
words = 16
at = 144

# THE SLOT MAP IS PINNED, NOT PACKED (OamClaim.at: index order IS priority and
# a packed layout's priority is an accident of claim names). Priority here is
# assigned by what must stay readable: the gunship in front, the beam over it
# in the column, the HUD over the plane, and the card glyphs ahead of their own
# banner — which on this rail is carried by SLOT ORDER alone. Every sprite is
# OAM priority 3, so the glyph-vs-banner ordering IS the OAM index and nothing
# else.
[[claims.oam]]
name = "player"
sprites = 1
at = 0

[[claims.oam]]
name = "beam"
sprites = 16
at = 1

[[claims.oam]]
name = "hud"
sprites = 8
at = 17

[[claims.oam]]
name = "shots"
sprites = 4
at = 25

[[claims.oam]]
name = "exhaust"
sprites = 1
at = 29

[[claims.oam]]
name = "cards"
sprites = 24
at = 30

# The two pad slots that complete hi byte 13 (slots 54..55), parked for the
# ROM's life so the byte has one owner and is rebuilt whole.
[[claims.oam]]
name = "hi_pad"
sprites = 2
at = 54

# THE STAR FIELD: twenty-four 8x8 sprites, twelve far and twelve near, drawn
# every frame at OAM priority 0 (under the plane). TWENTY-FOUR is a SPARSITY
# figure, not a slot-budget one: the plane-painted field it replaces put 366
# star tiles on screen at rest scale (measured: the old predicate over exactly
# the texel window the matrix samples there — 50 bright + 316 dim, ~1,895
# screen px, 3.3% of the picture), and the ask was for a much sparser sky.
# This field lights 86..135 px, measured across a fight.
# It is also six whole hi bytes, and it keeps this rail's worst case a long
# way under the hardware's 32-sprites/34-slivers per scanline: the twelve home
# rows of each band are spaced >= 16 apart and the whole band shares one
# scroll offset, so within a band the spacing is invariant and no two stars
# can ever share a scanline — at most one far + one near, i.e. 2 sprites and
# 2 slivers of the line's budget, whatever the fight is doing.
[[claims.oam]]
name = "stars"
sprites = 24
at = 56

[[claims.reg]]
name = "obj_obsel"
registers = ["OBSEL"]
