# sau_obj — the saucer fight's cast: the gunship, the BEAM column, the HP HUD,
# the player shots, the thruster flame, and the glyph cards. Scene-scoped.
# Model: bs_obj (the same OAM disciplines, the same pool split).
#
# STABLE OAM SLOTS ARE THE CONTRACT: the draw assigns fixed slots and dead
# slots are PARKED at y=240 rather than skipped, so a test reads an actor by
# slot identity.
#
# THE MAP: 0 the gunship (16x16) 1-16 the beam column (16 x 8x8) 17-24 the
# saucer HP HUD (8 pips) 25-28 the player shots (4) 29 the thruster flame
# (FIGHT only) 30-53 the card cells (24) 54-55 hi-table pad, parked for the
# ROM's life Text cards are the one band that WANTS to be unbounded, and a
# claim has to name a bound, so the card band is sized to the widest thing it
# ever draws: the VICTORY word (7 glyphs) plus its 16-cell banner = 23, and
# the two-row boot title = 21 drawn cells. 24 covers both.
#
# FIFTY-SIX SLOTS, FOURTEEN WHOLE HI BYTES. A hi-table byte covers four
# sprites; 56 is 14 bytes with nothing left mid-byte, so all fourteen can be
# REBUILT WHOLE every frame — mo_obj's ruling (its header carries the stale-X9
# failure mode), paid here with two parked pad slots.
#
# OBSEL IS CLAIMED HERE (breaker_obj/m7dg_obj/mo_obj/bs_obj precedent):
# oam_sprites is the OAM transport, not the sprite size/base authority. Size
# pair 0 (8x8 / 16x16): the gunship is the LARGE half, everything else small.
name = "sau_obj"
role = "consumer"
depends = ["oam_sprites", "sau_rom", "pool"]

# The enter-time CHR + palette upload path. Channel is declared; DAS re-armed
# at the one arming site in sau_obj.asm (single-shot, per transfer).
[[claims.dma_init]]
name = "sau_obj_up"
channel = 0
registers = ["VMDATAL", "VMDATAH"]
mode = 1

# Per-frame draw scratch. A call frame, not state — every byte written before
# read inside one draw pass, so no `[init] zero`.
#  +0 screen x scratch +2 screen y scratch
#  +4 the hi-table SIZE bit +6 tile/attr scratch
[[claims.dp]]
name = "sau_draw"
bytes = 8

# THE SHOT POOL'S STORAGE. One region, offsets in game/boss_saucer/ saucer.inc:
# +0x00 alive[4] | +0x08 x[4] | +0x10 y[4] (24 B). ONE pool, not the boss
# rail's two: the saucer attacks with a BEAM, not with orbs, so there is no orb
# rain to pool and one alive array is the whole cast's storage.
#
# The arrays live here and not in state.toml because POOL_BIND takes a 24-bit
# CONSTANT base, so the alive array must be one emitted _LONG symbol plus a
# compile-time offset (bs_obj's reasoning, mo_obj's before it).
#
# NO `[init] zero`: battle_init pool_init's the alive array and spawn writes
# the parallel fields before any read (rule 5 — a pre-zero would hide a "the
# init stopped running" defect behind a plausible answer).
[[claims.wram]]
name = "sau_actors"
bytes = 24

# 48 tiles = three 16-wide OBJ rows = 1536 B = 768 words. The Mode 7 claim pins
# words $0000-$3FFF and the allocator floors OBJ CHR above it; the emitted
# ES_V_OBJ_CHR_OBSEL_BASE is what sau_obj.asm writes into OBSEL.
[[claims.vram]]
name = "obj_chr"
kind = "chr"
obj = true
words = 768

# One OBJ palette for the whole cast — one ramp, so a second buys nothing.
# OBJ palette 0 = CGRAM 128..143, a hardware contract.
[[claims.cgram]]
name = "sprite_pal"
words = 16
at = 128

# THE SLOT MAP IS PINNED, NOT PACKED (OamClaim.at: index order IS priority and
# a packed layout's priority is an accident of claim names). Priority here is
# assigned by what must stay readable: the gunship in front, the beam over it
# in the column, the HUD over the plane, and the card glyphs ahead of their own
# banner — which on this rail is carried by SLOT ORDER alone. Every sprite is
# OAM priority 3, so the glyph-vs-banner ordering IS the OAM index and nothing
# else.
[[claims.oam]]
name = "player"
sprites = 1
at = 0

[[claims.oam]]
name = "beam"
sprites = 16
at = 1

[[claims.oam]]
name = "hud"
sprites = 8
at = 17

[[claims.oam]]
name = "shots"
sprites = 4
at = 25

[[claims.oam]]
name = "exhaust"
sprites = 1
at = 29

[[claims.oam]]
name = "cards"
sprites = 24
at = 30

# The two pad slots that complete hi byte 13 (slots 54..55), parked for the
# ROM's life so the byte has one owner and is rebuilt whole.
[[claims.oam]]
name = "hi_pad"
sprites = 2
at = 54

[[claims.reg]]
name = "obj_obsel"
registers = ["OBSEL"]
