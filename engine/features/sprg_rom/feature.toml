# sprg_rom — the sprite_game rail's art: ONE OBJ tile and TWO OBJ palettes.
#
# One tile for two sprites is the point, not an economy: the red player and the
# yellow dot draw from the SAME 8x8 tile. Two independently-coloured sprites
# over one tile — the difference is carried by the palette-select bits in each
# OAM attribute, not by CHR.
#
# GLOBAL blob feature rather than claims hung on sprg_obj, for the reason
# room_rom / font_rom / hud_rom all state: ROM data is physically
# game-lifetime, and ca65 resolves scopes backward, so a `.incbin` site in
# main.asm cannot name a symbol from a `.scope play` included after it.
#
# Generated by tools/gen_sprite_game_assets.py; each claim site .asserts the
# blob's linker bank/addr against the emitted symbols, so allocator<->linker
# drift refuses the build.
name = "sprg_rom"
role = "blob"

[[claims.rom]]
name = "sprg_obj_chr_rom"
bytes = 32               # 1 tile x 32 B 4bpp: the shared 8x8 block

[[claims.rom]]
name = "sprg_obj_pal_rom"
bytes = 64               # 32 BGR555 words — OBJ palette 0 (player red at
                         # index 1) then OBJ palette 1 (dot yellow at index 1)
