# smt_rom — the `smelter` rail's resident data.
#
# Six blobs and one of them is the rail: `smt_col` holds every complete BG3
# offset row this rail will ever show. The others are ordinary art.
#
# WHY THE TABLE IS RESIDENT AND NOT COMPUTED. A row is 32 words — one per
# 8-pixel column — and composing one per frame would mean a sine, a shape
# term and a rectifier per column on a CPU with no multiply instruction, every
# frame, forever, to produce a value that is the same every 64 frames. Holding
# all 65 rows costs 4,160 B of a ROM budget with room to spare and reduces the
# per-frame work to choosing WHICH row and moving 64 B in VBlank. That is the
# heathaze trade made on a table a quarter the size.
name = "smt_rom"
role = "blob"

[[claims.rom]]
name = "smt_chr"
bytes = 384              # 12 x 4bpp tiles: a transparent cell, the plate's
                         # three top and three underside profiles, two wall
                         # tiles, two crust tiles and two melt tiles;
                         # tools/gen_smelter_assets.py

[[claims.rom]]
name = "smt_pmap"
bytes = 4096             # BG1: 32x64 tilemap words. A 512 px tall map so no
                         # scroll value in range wraps — the plates live at
                         # map row 40 and everything else is the transparent
                         # cell, which is what makes BG1 four movable objects
                         # rather than a picture

[[claims.rom]]
name = "smt_mmap"
bytes = 4096             # BG2: 32x64 tilemap words. Wall above map row 32,
                         # the crust line at 32, the melt below

# ONE BLOB, TWO CGRAM GROUPS: 16 words for the plates at CGRAM 0 and 16 for
# the cavern and the melt at CGRAM 32. They are one claim because the uploader
# needs one base symbol and a small POSITIVE offset — two claims would leave
# it adding the difference between two linker-placed symbols, and the packer
# is free to order them either way (it ordered an earlier pair the other way
# round), which makes that difference negative and walks absolute-long
# indexed addressing into the next bank.
[[claims.rom]]
name = "smt_pal"
bytes = 64

[[claims.rom]]
name = "smt_hrow"
bytes = 64               # BG3 row 0, the HORIZONTAL offset word per column.
                         # All zero: with neither enable bit set no column is
                         # displaced horizontally, which is how a V-only table
                         # is expressed. Uploaded once, at scene enter — only
                         # the V row is rewritten per frame

# --- the knight, traced from the vendored camelot pack (CC0) ---------------
# `vendor/art/camelot/arthurPendragon_.png`, read at build time by
# tools/gen_smelter_assets.py. The PNG is the pack's own unmodified file,
# sha256-matched against its zip member (docs/92 §5.1) and already vendored
# because `brawler` reads it; tracing it directly is strictly better
# provenance than reading a derived blob, and it is the same route `brawler`
# and `split_v_fight` take from the same sheet.
[[claims.rom]]
name = "smt_obj"
bytes = 8192             # 13 frames of 32x32 in 16 slots = 256 tiles, one
                         # whole OBJ name table. Right-facing only: the pack
                         # draws both directions by hand and walking left here
                         # is an OAM H-flip, which halves the CHR

[[claims.rom]]
name = "smt_obj_pal"
bytes = 32               # 16 CGRAM words — OBJ palette 0. Arthur uses 8
                         # opaque colours, so this is a lossless conversion
                         # and not a quantisation (the pack's README measures
                         # the same 8, and the generator asserts it)

[[claims.rom]]
name = "smt_anim"
bytes = 30               # 3 states x 8 frame slots, then 3 (length, rate)
                         # pairs. Emitted rather than written into the ASM for
                         # the reason every table in this rail is: the walker
                         # and the table cannot disagree about a number
                         # neither of them holds twice

# --- the wall's colour rotation --------------------------------------------
[[claims.rom]]
name = "smt_wall_pal"
bytes = 128              # 8 steps x 8 BGR555 words. The wall carries no
                         # pattern in its pixels — one tile, every row
                         # identical, every column its own palette index — so
                         # the pattern IS these eight colours and rotating
                         # them walks a band of lightness across the screen.
                         #
                         # A PALETTE CYCLE AND NOT A CHR SWAP, deliberately.
                         # The wall is the one surface that must be invariant
                         # under vertical displacement, so every frame of a CHR
                         # animation would have to be vertically uniform AND
                         # the case that checks the invariance could no longer
                         # tell "moved" from "animated". A colour rotation does
                         # not touch a pixel, so the invariance survives by
                         # construction. Step 0 is what `smt_pal` already
                         # holds, so the enter upload and the cycle are the
                         # same colours rather than two that agree.

# --- the melt's CHR animation ----------------------------------------------
[[claims.rom]]
name = "smt_melt_anim"
bytes = 1024             # 8 frames x 4 tiles x 32 B. The four are CONTIGUOUS
                         # in `smt_chr`'s slot order (the crust pair and the
                         # body pair), which is what makes the per-frame swap
                         # ONE transfer rather than two, and frame 0 is
                         # byte-identical to those same four slots in
                         # `smt_chr` — so the boot upload, the animation and
                         # the title's restore are all the same pixels rather
                         # than three pictures that happen to agree.
                         #
                         # The WALL is deliberately not in here. It is the one
                         # surface under a hard constraint — invariant under
                         # vertical displacement — and animating it would put
                         # that constraint on every frame while making the
                         # test that checks it unable to tell "moved" from
                         # "animated". Motion belongs where the constraint is
                         # not.

[[claims.rom]]
name = "smt_col"
bytes = 4160             # 65 x 64 B. Each blob is a complete BG3 V-offset row
                         # for one frame: 32 words, each one column's absolute
                         # vertical scroll plus the enable bit naming the layer
                         # it drives (bit 13 = BG1, bit 14 = BG2).
                         #
                         # SIXTY-FOUR PHASES AND ONE CONTROL. The 65th row is
                         # the same shape with every value at its base and
                         # EVERY ENABLE BIT STILL SET, so the flat picture and
                         # the moving one differ in the table and in nothing
                         # else. A control that cleared the enable bits would
                         # differ in two things at once — the values and
                         # whether the mechanism runs at all — and could not
                         # tell a wrong table from a dead transfer
