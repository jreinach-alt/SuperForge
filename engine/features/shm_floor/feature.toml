# shm_floor — the matrix-band pair's Mode 7 plane. Scene-scoped.
#
# The world under EVERY band: one 128x128 wrapping checker plane, uploaded once
# at scene enter and never touched again. Everything that makes the bands look
# different is the MATRIX's doing (shm_cam), not this feature's — which is the
# whole point of the pair and the reason the plane is declared separately from
# the split.
#
# WHY NOT `sh2_floor`, which this is otherwise shaped exactly like: that
# feature's `depends = ["sh2_rom"]` binds it to the split_h_2p rail's blobs,
# its CGRAM claim is five words rather than three, and its floor_arm names that
# rail's labels. Three of three differ, so this is a sibling feature rather
# than a parameterisation — the ruling `col_map` took four times and
# `sh2_floor` itself took against `m7dg_floor`. What transfers is the SHAPE.
#
# WHY NOT `mode7_floor`: it depends on `world_rom` (a 256 KB map neither rail
# reads) and pins CGRAM 0..16 for microzero's palette.
#
# WHY NO `hdma` CLAIM. The plane is static: the world does not scroll, rotate
# or stream. Every per-scanline channel on these rails belongs to shm_cam.
name = "shm_floor"
role = "feature"
depends = ["shm_rom"]

# The enter-time upload: ONE DMA for the whole interleaved blob. Mode 1 drives
# VMDATAL then VMDATAH alternately, which IS the interleave — even source byte
# to $2118 (tilemap), odd to $2119 (CHR) — so the blob streams straight in with
# no unpacking and no second pass. Phase forced_blank: scene_mgr's enter clears
# HDMAEN and zeroes NMITIMEN, so this cannot race an active or vblank claim
# even on a shared channel number.
[[claims.dma_init]]
name = "shm_up"
channel = 0
registers = ["VMDATAL", "VMDATAH"]
mode = 1

# The Mode 7 region is the fixed pinned 32 KB at words $0000-$3FFF — a hardware
# address, not a packing decision, which is why `kind = "mode7"` takes neither
# `words` nor `tiles` (giving them is a schema error).
[[claims.vram]]
name = "m7"
kind = "mode7"

# HARDWARE CONTRACT: a Mode 7 8bpp pixel value IS an absolute CGRAM index, so
# this palette can only live at 0. Three colours is the whole world.
#
# Word 0 is included DELIBERATELY and is not spare: it is both palette index 0
# and the Mode 7 BACKDROP slot, and it holds the muted blue-violet. A scene
# composing `backdrop` alongside this must refuse the build — colour 0 has one
# owner (and sh2_floor / m7dg_floor / mode7_floor all say the same).
[[claims.cgram]]
name = "shm_pal"
words = 3
at = 0

# C4 (docs/09 §2.1): the scene's base display shape, written ONCE under forced
# blank for the whole frame.
#
# THESE RAILS DO NOT SPLIT THE VIDEO MODE. Every band is Mode 7 for all 224
# lines; the split is a split of the camera MATRIX, not of BGMODE/TM. That is
# why `split_band` is not composed and is not generalised here — there is no
# second splitter.
#
# ATTRIBUTION. M7SEL is written by this feature's own floor_arm — it is a Mode
# 7 register and Mode 7 is this feature's mechanism. BGMODE and TM are written
# by the scene's enter code, which has no feature.toml of its own, so they are
# attributed to the feature they SERVE and opened through `scene_writes` — the
# shape sh2_floor, m7dg_floor, room_bg and split_v_bg all use. The lies-check
# compares per REGISTER, which is exactly why this works: the opened set
# (BGMODE, TM) and the owner-written set (M7SEL) are disjoint.
[[claims.reg]]
name = "shm_display"
registers = ["BGMODE", "TM", "M7SEL"]
scene_writes = ["BGMODE", "TM"]
