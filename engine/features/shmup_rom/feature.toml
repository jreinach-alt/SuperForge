# shmup_rom — the shmup rail's art blobs: the BG planet page + its palette,
# the OBJ page, and the three OBJ palettes.
#
# GLOBAL blob feature rather than claims hung on shmup_bg / shmup_obj, for the
# reason room_rom, font_rom and breaker_rom all state: ROM data is physically
# game-lifetime (one .incbin serves every scene), so the claim belongs where
# the data is, not where it is consumed. The mechanical reason is the binding
# one -- ca65 resolves scopes BACKWARD, so a `.incbin` site in main.asm cannot
# name a symbol from a `.scope play` included after it.
#
# Generated by tools/gen_shmup_assets.py from the pack PNGs vendored under
# vendor/art/spaceship_pack; each claim site .asserts the blob's linker
# bank/addr against the emitted symbols, so allocator<->linker drift refuses
# the build.
#
# NO BG TILEMAP BLOB, the same shape breaker set. The planet field is not art
# on a map -- it is TEN STAMPS of four 4x4-tile blocks at declared origins,
# built cell by cell under the enter-time forced blank (sbg_build_field). A
# 2 KB ROM tilemap would be a second source of truth for a 2 KB expression.
#
# ONE OBJ CHR BLOB, NOT FOUR. The PPU reads a 16x16 sprite's four 8x8 tiles at
# {N, N+1, N+16, N+17} -- the second row is always +16 tile numbers -- so every
# 16x16 actor must live on ONE 16-tile-wide VRAM grid. Splitting the ship, the
# enemy and the burst into separate blobs would mean three separately-based
# grids, each rounded up to a whole grid row. The palettes stay separate
# because a palette is not on that grid: it is an OAM attr bit.
name = "shmup_rom"
role = "blob"

[[claims.rom]]
name = "shm_bg_chr_rom"
bytes = 2112            # 66 tiles x 32 B 4bpp: blank + 4 planets x 16 + HUD bar

[[claims.rom]]
name = "shm_bg_pal_rom"
bytes = 32              # 16 BGR555 words -- BG palette 2, shared by BG1 and BG2

[[claims.rom]]
name = "shm_obj_chr_rom"
bytes = 1536            # 48 tiles x 32 B: the 16-wide grid described above

[[claims.rom]]
name = "shm_ship_pal_rom"
bytes = 32              # 16 BGR555 words -- OBJ palette 0

[[claims.rom]]
name = "shm_foe_pal_rom"
bytes = 32              # 16 BGR555 words -- OBJ palette 1 (the bullet rides it)

[[claims.rom]]
name = "shm_burst_pal_rom"
bytes = 32              # 16 BGR555 words -- OBJ palette 2
