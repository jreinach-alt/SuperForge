# brawler_bg — BG1: the terrain floor, built from the vendored patch. This
# rail's whole Mode-1 display shape (BGMODE/TM owner; bg_text rides BG3).
#
# The keystone BG pattern's next instance after stomper_bg. What THIS instance
# adds over stomper_bg: the tilemap is built by TILING an 8x6 art PATCH rather
# than rendering a per-cell world blob -- a `col mod 8` floor loop, which is
# the shape a "terrain strip across the bottom" wants and the reason the map
# blob is 48 words instead of 1024. The scroll axes are STATIC (both pinned
# once under the enter forced blank): the arena is one screen and neither
# knight scrolls it.
name = "brawler_bg"
role = "feature"
depends = ["brawler_rom"]

# The enter-time CHR upload, word-port. Phase forced_blank by class:
# scene_mgr's enter clears HDMAEN and zeroes NMITIMEN, so it cannot race an
# active- or vblank-phase claim on a shared channel number.
[[claims.dma_init]]
name = "br_bg_up"
channel = 0
registers = ["VMDATAL", "VMDATAH"]
mode = 1

[[claims.vram]]
name = "br_chr"
kind = "chr"
tiles = 49               # the deduped patch tileset; tile 0 is the reserved
                         # blank the converter always emits first
tile_bytes = 32          # 4bpp

[[claims.vram]]
name = "br_map"
kind = "tilemap"
words = 0x400            # 32x32; BG1SC bases are 0x400-word granular

# THE PALETTE AND THE BACKDROP ARE ONE CLAIM, by hardware contract: the patch
# authors palette group 0, so a tilemap word IS its tile id and word 0 of the
# group is the backdrop slot -- one word, two meanings, one owner. That is also
# And this scene cannot ALSO compose `backdrop`.
[[claims.cgram]]
name = "br_bg_pal"
words = 16
at = 0

# C4 (docs/09 §2.1): the BG1 layer configuration and the scene's base display.
#
# ATTRIBUTION. BGMODE/TM/BG1SC/BG12NBA are written by the scene's enter code in
# game/brawler/scenes/fight.asm (scene files have no claim vocabulary of their
# own), so they are `scene_writes` here. BG1HOFS/BG1VOFS are written by
# brawler_bg.asm ITSELF (br_arm, once, under the enter forced blank -- the
# static pin), so they are declared but NOT in scene_writes; no_literals'
# declaration-that-lies check refuses the mistake in either direction.
[[claims.reg]]
name = "br_layers"
registers = ["BGMODE", "TM", "BG1SC", "BG12NBA", "BG1HOFS", "BG1VOFS"]
scene_writes = ["BGMODE", "TM", "BG1SC", "BG12NBA"]
