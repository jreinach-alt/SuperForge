# hz_flat — the composed UNDISTORTED state for BG1HOFS, as a claim.
#
# =============================================================================
# THE PROBLEM IT SOLVES, AND IT IS `blend_off`'S PROBLEM ON ANOTHER REGISTER
# =============================================================================
# `haze` drives BG1HOFS per scanline through an HDMA channel. Whatever value
# the LAST scanline of the last armed frame left in that port is the value the
# port still holds when the scene ends — a displacement of up to six pixels,
# chosen by wherever the animation happened to be. Nothing carries a scroll
# register across a scene edge, and a successor that composes no BG1HOFS
# claimant writes nothing, so it inherits the warp: the title screen comes
# back with its world shifted by an arbitrary amount.
#
# That is exactly the shape `blend_off` exists for on CGWSEL/CGADSUB, and the
# remedy is the same one in claim form: compose this into a scene that has no
# haze and the scene OWNS BG1HOFS, gets the symbol emitted for it, and
# establishes the flat base on enter.
#
# WHY NOT PUT BG1HOFS IN `hz_bg` INSTEAD. Because `hz_bg` is global — both
# scenes draw the same world — and a feature cannot conditionally claim. In
# the desert scene the port has a transfer claim on it and the CPU write must
# be declared a `seed`; on the title screen there is no transfer, and a seed
# with nothing overriding it is refused (check_reg_ownership, check 3). One
# feature cannot be both. So the port belongs to whichever feature answers for
# it in that scene, and this is the answer for the scene that does not
# shimmer.
#
# THE GENERAL LESSON, which this rail is the first in the tree to pay for: an
# HDMA-DRIVEN REGISTER NEEDS THE SAME PER-SCENE DISARM DISCIPLINE THE BLENDER
# DOES. `blend_off` was written as if colour math were special; it is not —
# any port a transfer claim owns for the duration of a scene leaves its last
# value behind at the edge, and the successor has to answer for it.
name = "hz_flat"
role = "feature"

[[claims.reg]]
name = "hz_flat_scroll"
registers = ["BG1HOFS"]
scene_writes = ["BG1HOFS"]
