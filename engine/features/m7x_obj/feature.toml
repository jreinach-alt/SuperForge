# m7x_obj — the mode7_explore rail's avatar. Scene-scoped.
# Model: m7dg_obj / sh2_obj, minus the projection.
#
# ONE SPRITE, AND IT NEVER PROJECTS. m7a_set_center pins the affine pivot — the
# camera's world position — at screen centre for every heading, and on this rail
# the avatar IS the camera. So her screen position is a CONSTANT by construction
# and computing it would be computing 120 the long way. What moves is the floor.
# That is why `m7_project` is NOT a dependency here even though m7dg_obj needs
# it: this rail has no second actor to place.
#
# FOUR OAM SLOTS FOR ONE SPRITE. A hi-table BYTE covers four sprites (2 bits
# each: bit 0 = X9, bit 1 = size), so owning only slot 0 would mean
# read-modify-WRITING a byte three sprites this feature does not own also live
# in — and a stale X9 renders a sprite 256 px away. Owning the whole quad lets
# the byte be REBUILT WHOLE every frame. m7dg_obj pays one parked slot for the
# same property; platformer_obj pays one; this pays three, which is the price of
# a one-sprite cast rather than a wasteful choice.
#
# OBSEL IS CLAIMED HERE, following breaker_obj / platformer_obj / split_v_obj /
# m7dg_obj. `oam_sprites` claims only OAMDATA — it is the OAM *transport*, not
# the sprite size/base authority — so every rail's OBJ feature declares OBSEL.
name = "m7x_obj"
role = "consumer"
depends = ["oam_sprites", "m7x_rom"]

# The enter-time upload: the avatar sheet into OBJ VRAM, one DMA. The channel is
# a declared resource; DAS is armed at the single arming site because it is
# consumed by the transfer.
[[claims.dma_init]]
name = "mxo_up"
channel = 0
registers = ["VMDATAL", "VMDATAH"]
mode = 1

# The per-frame placement scratch: the screen y the walk bob resolved for this
# frame, held across the facing lookup because that lookup needs X and Y both.
# A call frame, not state — written before it is read inside one mxo_draw, so
# there is no `[init] zero`. The x needs no slot: it is a constant (the pin).
[[claims.dp]]
name = "mxo"
bytes = 2

# 38 tiles x 16 words. The sheet is laid out on the PPU's 16-wide OBJ name grid
# because a 16x16 sprite reads {N, N+1, N+16, N+17} — the second row is +16 tile
# numbers away, not +2 — so the three facings sit at tiles 16, 18 and 20 with
# their lower halves at 32, 34 and 36, and the tiles between the two rows are
# zero. That padding is the hardware's alignment, not slack: a tighter blob
# would need two transfers to land in the same places.
#
# The base is not written here and cannot be: the scene's `mode7` claim pins
# words $0000-$3FFF and the allocator floors every OBJ CHR claim above it
# (substrate [vram.mode7] displaces_obj_chr_to_word). The emitted
# ES_V_OBJ_CHR_OBSEL_BASE is what the ASM writes into OBSEL.
[[claims.vram]]
name = "obj_chr"
kind = "chr"
obj = true
words = 608              # 1,216 B = 38 tiles x 32 B

[[claims.cgram]]
name = "mxo_pal"
words = 16
at = 128                 # hardware contract: OBJ palette 0 = CGRAM 128..143

# THE SLOT MAP IS PINNED, NOT PACKED. OAM index order IS sprite-vs-sprite
# priority (lowest index in front), and the packer sorts by (-sprites, name), so
# a packed layout's priority would be an accident of claim names. The avatar is
# slot 0 for the same reason the dungeon's hero is: the one sprite the player
# steers must never be occluded.
[[claims.oam]]
name = "avatar"
sprites = 1
at = 0

# The rest of the avatar's hi-table quad, claimed so that byte has ONE owner and
# can be rebuilt whole (see the header). Parked at y = $F0 for the ROM's life.
[[claims.oam]]
name = "hi_pad"
sprites = 3
at = 1

[[claims.reg]]
name = "mxo_obsel"
registers = ["OBSEL"]
