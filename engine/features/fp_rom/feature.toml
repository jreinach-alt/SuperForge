# fp_rom — the four_pads rail's art: THREE OBJ tiles and FOUR OBJ palettes.
#
# One token tile and two lamp tiles for all four players; the player is the
# palette (OBJ palette n = player n+1). Generated by
# tools/gen_four_pads_assets.py; each `.incbin` site in game/four_pads/main.asm
# .asserts the blob's linker bank/addr against the emitted symbols.
#
# GLOBAL blob feature, for the reason sprg_rom / room_rom state: ROM data is
# game-lifetime, and ca65 resolves scopes backward, so a `.incbin` site in
# main.asm cannot name a symbol from a `.scope play` included after it.
name = "fp_rom"
role = "blob"

[[claims.rom]]
name = "fp_obj_chr_rom"
bytes = 96               # 3 tiles x 32 B 4bpp: token, lamp ring, lamp lit

[[claims.rom]]
name = "fp_obj_pal_rom"
bytes = 128              # 4 OBJ palettes x 16 BGR555 words, player order
