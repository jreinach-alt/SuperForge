# rc_rom — the racer rail's own ROM blobs (global blob).
#
# Game-lifetime data, so global scope; role = blob because it holds no
# behaviour (the census cannot tell a blob from a feature by its claims —
# AGENTS.md's role paragraph). Generated byte-identically by
# tools/gen_racer_assets.py; every claim site .asserts against the emitted
# bank/addr (car_rom / shp_rom convention), so a drift refuses the build and
# `make rom-unbacked` refuses a claim with no .incbin behind it.
name = "rc_rom"
role = "blob"

[[claims.rom]]
name = "kart_chr_rom"
bytes = 1024             # 32 tiles x 32 B 4bpp: a 16-wide OBJ grid row pair.
                         # The PPU reads a 16x16 sprite at N,N+1,N+16,N+17, so
                         # the two kart frames sit at 0,1,16,17 and 2,3,18,19
                         # and the two 8x8 speed-bar ticks at 4 and 5.

[[claims.rom]]
name = "kart_pal_rom"
bytes = 32               # 16 BGR555 words (OBJ palette 0)

[[claims.rom]]
name = "sky_keys"
bytes = 5376             # 8 day-night keyframes x 3 COLDATA planes x 224
                         # per-scanline bytes. rc_grad points its three WRAM
                         # header tables at keyframe k; the game walks k.
                         # ONE claim, not eight: the keyframes are slices of
                         # one generator artifact and the pointer arithmetic
                         # is base + k*672, which needs them contiguous.
