# rpg_rom — the rpg rail's art and world data (blob).
#
# Generated by tools/gen_rpg_assets.py; no hand-authored bytes. The Mode 7
# overworld's interleaved 32 KB region is the big one; everything else is small.
name = "rpg_rom"
role = "blob"

# The interleaved Mode 7 region: 128x128 tile map bytes at EVEN addresses and
# 256 8bpp tiles at ODD addresses, exactly the layout $2118/$2119 want. One
# 32 KB LoROM window exactly, so it is a single un-tiled claim and a legal DMA
# source (a DMA source may not cross a bank; this fills one window and stops).
[[claims.rom]]
name = "m7_world"
bytes = 32768
dma_source = true

# The FLAT tile-id map col_map probes: one byte per tile, 128x128. The Mode 7
# blob above cannot serve this — col_map's addressing is `(ty & (rpc-1)) * W +
# tx`, one byte per tile, and the Mode 7 region is interleaved two bytes per
# tile. Two representations of one world, which is the price of the hardware's
# interleave; the generator emits both from one source so they cannot drift.
[[claims.rom]]
name = "col_world"
bytes = 16384            # 128 x 128 tile ids

# col_map's CM_FLAGS table: tile id -> terrain flag byte.
[[claims.rom]]
name = "col_flags"
bytes = 256

# CGRAM word 0 is the SKY (the split's top band shows backdrop), so no floor
# tile may use palette index 0 — the generator asserts it.
[[claims.rom]]
name = "m7_pal"
bytes = 64               # 32 BGR555 words

# The Mode 1 town: a 64-tile 4bpp tileset and its palette.
[[claims.rom]]
name = "town_chr"
bytes = 2048             # 64 tiles x 32 B, 4bpp
dma_source = true

[[claims.rom]]
name = "town_map"
bytes = 2048             # 32x32 tilemap words
dma_source = true

[[claims.rom]]
name = "town_pal"
bytes = 32               # 16 BGR555 words

# The avatar + the villager, 16x16 OBJ (4 tiles each in the 16-wide OBJ grid).
[[claims.rom]]
name = "obj_chr"
bytes = 2048             # 64 tiles x 32 B, 4bpp
dma_source = true

[[claims.rom]]
name = "obj_pal"
bytes = 32               # 16 BGR555 words
