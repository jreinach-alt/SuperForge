# m7dg_floor — the dungeon's Mode 7 plane. Scene-scoped.
#
# WHY NOT `mode7_floor`. That feature is welded to microzero:
# `depends = ["world_rom"]` drags in a 256 KB map this rail never reads, it
# pins CGRAM 0..16 for MICROZERO's floor palette, and its `m7_upload_seed`
# streams a position-wrapped 128x128 window out of a 512x512 world. This rail's
# map is a single flat 32,768 B interleaved blob uploaded ONCE, and its palette
# is nine words. Three of those four properties differ, so this is a sibling
# feature rather than a parameterisation — the same ruling `col_map` got four
# times over. What transfers is the SHAPE, not the code. "M7 plane — built" in
# docs/09 is true of the pattern, not of a reusable feature.
#
# WHY NO `hdma` CLAIM AT ALL. The whole rail is one uniform matrix per frame
# (m7_affine). Nothing streams per scanline, so nothing reserves a channel.
# It is the cheapest Mode 7 shape there is, and it is what leaves the frame
# budget free for the collision and projection work this rail layers on top.
name = "m7dg_floor"
role = "feature"
depends = ["m7dg_rom"]

# The enter-time upload: ONE DMA for the whole interleaved blob. Mode 1 drives
# VMDATAL then VMDATAH alternately, which IS the interleave — even source byte
# to $2118 (tilemap), odd to $2119 (CHR) — so the blob streams straight in with
# no unpacking and no second pass. Phase forced_blank: scene_mgr's enter clears
# HDMAEN and zeroes NMITIMEN, so this cannot race an active or vblank claim
# even on a shared channel number.
[[claims.dma_init]]
name = "m7dg_up"
channel = 0
registers = ["VMDATAL", "VMDATAH"]
mode = 1

# The Mode 7 region is the fixed pinned 32 KB at words $0000-$3FFF — a hardware
# address, not a packing decision, which is why `kind = "mode7"` takes neither
# `words` nor `tiles` (giving them is a schema error).
[[claims.vram]]
name = "m7"
kind = "mode7"

# HARDWARE CONTRACT: a Mode 7 8bpp pixel value IS an absolute CGRAM index, so
# this palette can only live at 0. Nine colours is the whole dungeon.
#
# Word 0 is included DELIBERATELY and is not spare: it is both palette index 0
# and the Mode 7 BACKDROP slot, and the generator's reserve_backdrop puts
# FLOOR_A there so the two agree. A scene composing `backdrop` alongside this
# must refuse the build — colour 0 has one owner (and mode7_floor's
# header makes the same statement).
[[claims.cgram]]
name = "m7dg_pal"
words = 9
at = 0

# C4 (docs/09 section 2.1): the scene's base display shape.
#
# ATTRIBUTION. M7SEL is written by this feature's own floor_arm — it is a Mode
# 7 register and Mode 7 is this feature's mechanism. BGMODE and TM are written
# by the scene's enter code (game/m7_dungeon/scenes/dungeon.asm), which has no
# feature.toml of its own, so they are attributed to the feature they SERVE and
# opened through `scene_writes` — the same shape room_bg and split_v_bg use,
# and the same statement every BG feature makes: the feature that
# owns the scene's display owns all of it.
#
# The lies-check compares per REGISTER rather than per claim, which is exactly
# why this works: the opened set (BGMODE, TM) and the owner-written set (M7SEL)
# are disjoint.
[[claims.reg]]
name = "m7dg_display"
registers = ["BGMODE", "TM", "M7SEL"]
scene_writes = ["BGMODE", "TM"]
