# m7x_floor — the mode7_explore rail's Mode 7 plane. Scene-scoped.
#
# WHY THIS IS m7dg_floor's SHAPE AND NOT mode7_floor's. `mode7_floor` is welded
# to microzero: `depends = ["world_rom"]` drags in a 256 KB map keyed to THAT
# rail's generator, and it pins CGRAM 0..16 for microzero's floor palette. This
# rail streams its own 256 KB world (m7x_map) and its palette is twelve words.
# M7dg_floor's header states the general form of the ruling — "'M7 plane —
# built' in docs/09 is true of the pattern, not of a reusable feature" — and it
# applies unchanged here: what transfers is the SHAPE (one interleaved 32 KB
# blob, one mode-1 DMA, an absolute palette pinned at 0, the scene's three
# display registers), not the code.
#
# THE DIFFERENCE FROM m7dg_floor, and it is the only one: this plane STREAMS.
# The seed uploaded here is the initial 128x128 window; `mode7_stream` replaces
# its rows and columns as the camera walks. That does not change anything this
# feature claims — the streamer holds its own vblank-phase channel and its own
# staging WRAM, and the CHR half of the Mode 7 region is never touched again
# after this upload (only tilemap LOW bytes stream). So the plane is still one
# enter-time DMA and no per-frame cost here.
#
# WHY NO `hdma` CLAIM. Nothing on this rail is per-scanline: the matrix is one
# uniform identity (m7_affine at heading 0) and the scroll is two registers the
# NMI commits from a DP shadow. The one channel this rail spends is
# mode7_stream's, and that is declared there.
name = "m7x_floor"
role = "feature"
depends = ["m7x_rom"]

# The enter-time upload: ONE DMA for the whole interleaved seed. Mode 1 drives
# VMDATAL then VMDATAH alternately, which IS the interleave — even source byte
# to $2118 (tilemap low), odd to $2119 (8bpp CHR) — so the blob streams
# straight in with no unpacking and no second pass. Phase forced_blank:
# scene_mgr's enter clears HDMAEN and zeroes NMITIMEN, so this cannot race an
# active or vblank claim even on a shared channel number.
[[claims.dma_init]]
name = "m7x_up"
channel = 0
registers = ["VMDATAL", "VMDATAH"]
mode = 1

# The Mode 7 region is the fixed pinned 32 KB at words $0000-$3FFF — a hardware
# address, not a packing decision, which is why `kind = "mode7"` takes neither
# `words` nor `tiles` (giving them is a schema error).
[[claims.vram]]
name = "m7"
kind = "mode7"

# HARDWARE CONTRACT: a Mode 7 8bpp pixel value IS an absolute CGRAM index, so
# this palette can only live at 0. Twelve colours is the whole overworld.
#
# Word 0 is included DELIBERATELY and is not spare: it is both palette index 0
# and the Mode 7 BACKDROP slot, and the generator puts opaque GRASS there so
# the two agree (m7x_rom's header says the same from the blob side). A scene
# composing `backdrop` alongside this must be refused — colour 0 has exactly
# one owner.
[[claims.cgram]]
name = "m7x_pal"
words = 12
at = 0

# C4 (docs/09 §2.1): the scene's base display shape.
#
# ATTRIBUTION. M7SEL is written by this feature's own floor_arm — it is a Mode
# 7 register and Mode 7 is this feature's mechanism. BGMODE and TM are written
# by the scene's enter code (game/mode7_explore/scenes/overworld.asm), which
# has no feature.toml of its own, so they are attributed to the feature they
# SERVE and opened through `scene_writes` — m7dg_floor, room_bg and split_v_bg
# all make the identical declaration for the identical reason (the
# feature that owns the scene's display owns all of it).
#
# The lies-check compares per REGISTER rather than per claim, which is what
# makes this work: the opened set (BGMODE, TM) and the owner-written set
# (M7SEL) are disjoint.
[[claims.reg]]
name = "m7x_display"
registers = ["BGMODE", "TM", "M7SEL"]
scene_writes = ["BGMODE", "TM"]
