# tad_rom — the tad-compiler ca65-export blob.
#
# ONE blob dir, because the export is ONE artifact: loader (offset 0, 116 B),
# SPC700 driver (offset 116), data table and audio data are offsets into a
# single .incbin (assets/audio/export/tad_audio_data.bin), exported as
# Tad_Loader_Bin / Tad_AudioDriver_Bin / Tad_DataTable by the generated
# .asm beside it. Three dirs would invent a decomposition the artifact does
# not have.
#
# HALF-WINDOW claim, PINNED to window 1.
#
# It was a WHOLE window (32,768 B) until 2026-09-08, and the reason it no
# longer is: the export is 8,752 B of segment content (51 B of LoadAudioData
# plus an 8,701 B .incbin), so a whole-window claim reserved 24,016 B that
# nothing could ever use — and every rail that composes audio carries its OWN
# copy of that reservation. Measured across the eight audio rails, halving the
# claim takes `room` and `shmup` from a 64 KB cart to a 32 KB one, and it is
# what lets a small rail (`jumper`, `maze`, `sprite_game`, `patrol`, ...) gain
# audio WITHOUT crossing a size class at all.
#
# WHY THE CLAIM CAN BE SMALLER THAN THE WINDOW, AND WHAT MAKES IT SAFE.
# lorom_512k.cfg maps BOTH `AUDIO_DATA0` and `BANK1` into memory area ROM1,
# AUDIO_DATA0 first. With a whole-window claim nothing else could share the
# window, so the two never met. With a half-window claim the allocator packs
# ordinary blobs into [0C000..10000) — and ld65, left alone, would pack BANK1
# immediately behind AUDIO_DATA0's REAL 8,752 bytes, at ~$01A230, not at the
# $01C000 the allocator emitted. `BANK1` therefore carries `align = $4000` in
# the cfg, which pushes it to the next 16 KB boundary: $01C000 when the export
# is present, and $018000 (unchanged) when it is not, so NON-audio rails pay
# nothing. The comment at that line says the same thing from the cfg's side.
#
# THAT AGREEMENT IS PROVEN, NOT ASSUMED. Every blob's `.incbin` site already
# asserts BOTH halves of its placement — `^label = ES_R_*_BANK` and
# `.loword(label) = ES_R_*_ADDR` — so if the aligned start and the allocator's
# arithmetic ever disagreed, the rails sharing window 1 would fail the LINK by
# name. The build passing IS the proof.
#
# The bank-start requirement is unchanged and still guaranteed by arithmetic:
# the export asserts `.loword(*) = $8000` (lderror) and window 1 begins at a
# LoROM bank start, so a 16,384-byte claim at window offset 0 lands there.
#
# WHICH bank was never guaranteed by size: the allocator agreed with the cfg
# only because `tad_export` happened to be the largest claim in every
# composition — nothing said so. `sh2_map` is the rail that exposed it: it
# tied at 32,768 B, sorted ahead by name, took window 1, and the link then
# overflowed BANK1 by this blob's bytes. A tie-break was deciding a hardware
# placement. `window = 1` states the constraint the cfg already imposes, and
# the tie cannot recur now that this claim is half the size.
#
# HEADROOM, and it is smaller than it was: 16,384 - 8,752 = 7,632 B of tail
# slack for content growth, where a whole window gave 24,016. That is roughly
# seven more 0.12 s one-shot samples, or several hundred more sound effects
# (SFX bytecode runs ~15 B each) — the set that lives here today spends 251 B.
# If the export ever outgrows the claim, `BANK1`'s aligned start moves to
# $020000, which is outside ROM1, and ld65 refuses the link. NOTE for that
# day: LoadAudioData's bank arithmetic assumes a spill bank is the ADJACENT
# next one, so growing back to 32768 (not 16384 + a distant window) is the
# move.
#
# dma_source = false: the blob is read by CPU long addressing and the
# byte-at-a-time loader handshake only — no GP-DMA ever sources it.
name = "tad_rom"
role = "blob"

# backed_by: the rom-backing gate's declared exemption (docs/37 §3, case 1).
# This is the ONE claim in the tree whose bytes do not come from a
# hand-authored
# .incbin the no_literals scope reads. The generated export is a SEPARATE ca65
# compilation unit ($(BUILD)/*_tad_data.o) that is deliberately outside that
# scope, and its claim site is a LINKER segment rather than an ES_R_* assert —
# so the gate's default rule (find an .incbin tied to my symbol) cannot see it
# and would refuse a claim that is in fact backed.
[[claims.rom]]
name = "tad_export"
bytes = 16384
dma_source = false
window = 1               # the cfg's AUDIO_DATA0 -> ROM1, stated as a claim
backed_by = """\
assets/audio/export/tad_audio_data.asm:119 `.incbin "tad_audio_data.bin"` into \
segment AUDIO_DATA0, mapped to ROM1 by vendor/rom/lorom_512k.cfg:53 and linked \
as its own ca65 unit (Makefile: $(BUILD)/rm_tad_data.o, $(BUILD)/bk_tad_data.o). \
Generated + vendored, so it is outside the no_literals scope by design \
(Makefile:157). Its own `.assert .loword(*) = $8000, lderror` is the \
placement check the ES_R_TAD_EXPORT_* asserts would otherwise be.\
"""
