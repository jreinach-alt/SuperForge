# cf_rom — every immutable byte the `camera_follow` rail reads.
#
# A `blob`: ROM claims, no behaviour, no asm — the role that exists precisely
# because a claim set cannot distinguish it from a feature (AGENTS.md).
#
# FOUR CLAIMS AND NO TILEMAP, same as scroller_rom and for the same reason: the
# 32x32 checkerboard is BUILT at scene enter by cf_bg's `(col ^ row) & 1` loop.
# In THIS rail the built map carries an extra lesson the scroller's does not:
# the map is 256 px on each axis while the WORLD is 512x448 — the repeating
# tilemap covering a larger world is the lesson: a small tilemap covers a large
# world.
#
# All four blobs come from tools/gen_cf_assets.py, which holds the two 32-byte
# tile tables and the two colour constants. See that generator's header for
# the byte-level fidelity argument.
name = "cf_rom"
role = "blob"
depends = []

[[claims.rom]]
name = "cf_bg_chr"
bytes = 64               # 2 x 4bpp tiles: 0 empty (backdrop), 1 solid green

[[claims.rom]]
name = "cf_bg_pal"
bytes = 32               # 16 CGRAM words — group 0, word 0 IS the backdrop

[[claims.rom]]
name = "cf_obj_chr"
bytes = 32               # 1 x 4bpp tile: the solid red player

[[claims.rom]]
name = "cf_obj_pal"
bytes = 32               # 16 CGRAM words — OBJ palette 0
