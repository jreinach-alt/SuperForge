# split_v_rom — the split_v_fight rail's art, in ROM. Global (not
# scene-scoped).
#
# ROM claims cannot be scene-scoped: the allocator packs a ROM window once for
# the composition, and a scene-scoped rom claim would reserve bytes that only
# one scene's map names. Same reasoning as room_rom's header, one rail over.
#
# Every claim here is BACKED by an .incbin claim site in
# game/split_v_fight/main.asm, which is what `make rom-unbacked` proves
# (docs/37). A claim with no .incbin is the grad_tabs bug -- an armed reader
# streaming whatever the linker left there -- and it is now a build refusal.
#
# The blobs come from tools/gen_split_v_assets.py. Two of them (sv_stage_pal,
# sv_knight_chr) are derived from third-party art packs -- under two DIFFERENT
# grants, only one of which is CC0; see NOTICE -- and vendored under
# vendor/art/split_v for bare runners; the rest are authored. See that
# generator's header for provenance.
name = "split_v_rom"
role = "blob"

# --- the stage, shared by BOTH cameras -------------------------------------
# ONE copy, not two. The obvious reading of a two-camera split is that the
# stage must be "duplicated into BG1's and BG2's VRAM regions"; it does not
# have to be -- BG2SC points at BG1's tilemap and BG12NBA at BG1's CHR, so the
# split is purely camera scroll over one copy. Read the code, not the comment
# (CLAUDE.md). Believing the comment would have doubled both the VRAM claim and
# this blob.
[[claims.rom]]
name = "sv_stage_chr"
bytes = 288              # 9 tiles x 32 B 4bpp

[[claims.rom]]
name = "sv_stage_map"
bytes = 2048             # 32x32 words

[[claims.rom]]
name = "sv_stage_pal"
bytes = 32               # 16 BGR555 words

# --- the divider bar on BG3 ------------------------------------------------
[[claims.rom]]
name = "sv_bevel_chr"
bytes = 64               # 2 tiles x 32 B 4bpp

[[claims.rom]]
name = "sv_bevel_pal"
bytes = 32

# --- the fighters ----------------------------------------------------------
# TWELVE 32x32 frames: idle x2, walk x4, jump, the lunge's wind-up and strike,
# the pack's own hit flash and recoil, and the KO. OBJ VRAM is a 16-tile-wide
# grid and a 32x32 sprite reads its lower tile rows +16 tile numbers away
# (hardware-fixed), so four frames fill one 64-tile group EXACTLY -- the
# alignment that cost 2048 B to hold one frame now costs nothing, because the
# gaps around frame 0 are where frames 1..3 live. 12 frames = 3 groups.
#
# ONE COPY FOR BOTH FIGHTERS. The rail's two fighters are the same character
# under an OBJ-palette swap, so a frame set is bought once and worn twice --
# which is the only reason a set this size fits beside the stage at all.
[[claims.rom]]
name = "sv_knight_chr"
bytes = 8192             # 256 tiles x 32 B 4bpp = 16 frames = ONE whole OBJ
                         # name table: the body's twelve and the blade's four

# --- the HUD, which cannot be text -----------------------------------------
# BG3 IS the divider here, so bg_text (BG3SC/BG34NBA) does not compose and the
# rail has no text layer. The life bars and the round-start count are sprites,
# 16x16, on their own OBJ name table: 2 life segments + the 8 glyphs "321FIGHT"
# doubled from the tree's own vendored face.
[[claims.rom]]
name = "sv_hud_chr"
bytes = 2048             # 64 tiles = 4 grid rows = up to 16 16x16 frames

# --- the animation tables --------------------------------------------------
# Six tables on a fixed 4-byte stride indexed by the anim-state word, plus the
# (len, rate) pair that bounds each one's wrap. A table named at ASSEMBLE time
# would force a branch chain in the clock AND a second one in the draw; a
# stride index does both (brawler's shape).
[[claims.rom]]
name = "sv_anim"
bytes = 24               # 6 tables x 4 frames

[[claims.rom]]
name = "sv_anim_meta"
bytes = 12               # 6 x (len, rate)

# Two palettes, one sprite: the P1/P2 team identity is an OBJ-palette swap, so
# the side-swap reads at a glance without a second CHR copy.
[[claims.rom]]
name = "sv_knight_pal_r"
bytes = 32

[[claims.rom]]
name = "sv_knight_pal_b"
bytes = 32

# The blade's own. The knight's 8 colours and the blade's 5 would fit one
# 15-entry palette together, and merging them would re-index every knight pixel
# -- the exact drift the vendored oracle exists to catch. 16 words keeps the
# pack's steel and gold as drawn, on both teams.
[[claims.rom]]
name = "sv_blade_pal"
bytes = 32
