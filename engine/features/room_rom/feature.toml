# room_rom — the room's BG1/BG2 blobs and the lantern's circle LUT.
#
# These live in a GLOBAL blob feature rather than on room_bg/window_iris for
# the reason font_rom states: ROM data is physically game-lifetime (one
# .incbin serves every scene), so the claim belongs where the data is, not
# where it is consumed. There is a hard mechanical reason too — ca65 resolves
# scopes BACKWARD, so a `.incbin` site in main.asm cannot name a symbol from
# a `.scope room` that is included after it. Scene-scoped ROM claims would
# force the blob block below the scenes, which is the wrong shape.
#
# Generated by tools/gen_room_assets.py and tools/gen_iris_lut.py; each claim
# site .asserts the blob's linker bank/addr against the emitted symbols, so
# allocator<->linker drift refuses the build.
name = "room_rom"
role = "blob"

[[claims.rom]]
name = "bg1_chr_rom"
bytes = 512              # 16 tiles x 32 B 4bpp

[[claims.rom]]
name = "bg1_map_rom"
bytes = 2048             # 32x32 words

[[claims.rom]]
name = "bg1_pal_rom"
bytes = 32               # 16 BGR555 words

[[claims.rom]]
name = "bg2_chr_rom"
bytes = 512

[[claims.rom]]
name = "bg2_map_rom"
bytes = 2048

[[claims.rom]]
name = "bg2_pal_rom"
bytes = 32

[[claims.rom]]
name = "iris_lut"
bytes = 194              # (2*48 + 1) half-widths as 16-bit words —
                         # see gen_iris_lut.py on why words
