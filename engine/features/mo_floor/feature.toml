# mo_floor — the overhead shooter's Mode 7 arena plane. Scene-scoped.
#
# WHY NOT `mode7_floor` (m7dg_floor reaches the same answer, for the same
# three measured reasons). That feature is welded to microzero: `depends =
# ["world_rom"]` drags in a 256 KB map this rail never reads, it pins CGRAM
# 0..16 for MICROZERO's floor palette, and its `m7_upload_seed` streams a
# position-wrapped 128x128 window out of a 512x512 world. This rail's map is a
# single flat 32,768 B interleaved blob uploaded ONCE, and its palette is nine
# words. Three of those four properties differ, so this is a sibling feature
# rather than a parameterisation — the ruling m7dg_floor, rs_floor, sh2_floor,
# shm_floor and m7x_floor each took before it.
#
# WHY NOT `m7dg_floor` ITSELF, which is the same shape with the same claims. It
# `depends = ["m7dg_rom"]` and its upload names m7dg_rom's emitted symbols, so
# composing it here would upload the DUNGEON's maze under an overhead shooter
# and reserve 49 KB of ROM for art this rail never reads. The SHAPE transfers;
# the blob binding does not.
#
# WHY NO `hdma` CLAIM AT ALL. The whole rail is one uniform matrix per frame
# (m7_affine). Nothing streams per scanline, so nothing reserves a channel.
# That is the measured property, and it is why this rail costs nothing beyond
# the plane: SCALE_VIEW is the constant $0100 the affine LUT already
# tabulates, so there is no scale axis to add and no live solve to restore.
name = "mo_floor"
role = "feature"
depends = ["mo_rom"]

# The enter-time upload: ONE DMA for the whole interleaved blob. Mode 1 drives
# VMDATAL then VMDATAH alternately, which IS the interleave — even source byte
# to $2118 (tilemap), odd to $2119 (CHR) — so the blob streams straight in with
# no unpacking and no second pass. Phase forced_blank: scene_mgr's enter clears
# HDMAEN and zeroes NMITIMEN, so this cannot race an active or vblank claim
# even on a shared channel number.
[[claims.dma_init]]
name = "mo_up"
channel = 0
registers = ["VMDATAL", "VMDATAH"]
mode = 1

# The Mode 7 region is the fixed pinned 32 KB at words $0000-$3FFF — a hardware
# address, not a packing decision, which is why `kind = "mode7"` takes neither
# `words` nor `tiles` (giving them is a schema error).
[[claims.vram]]
name = "m7"
kind = "mode7"

# HARDWARE CONTRACT: a Mode 7 8bpp pixel value IS an absolute CGRAM index, so
# this palette can only live at 0. Ten words is the whole arena — nine authored
# tones plus the one duplicate reserve_backdrop leaves behind (mo_rom's
# `mo_pal` claim carries that arithmetic).
#
# Word 0 is included DELIBERATELY and is not spare: it is both palette index 0
# and the Mode 7 BACKDROP slot, and the generator's reserve_backdrop puts the
# dark floor tone there so the two agree. A scene composing `backdrop`
# alongside this must refuse the build — colour 0 has exactly one owner
#.
[[claims.cgram]]
name = "mo_pal"
words = 10
at = 0

# C4 (docs/09 section 2.1): the scene's base display shape.
#
# ATTRIBUTION. M7SEL is written by this feature's own floor_arm — it is a Mode
# 7 register and Mode 7 is this feature's mechanism. BGMODE and TM are written
# by the scene's enter code (game/m7_oshoot/scenes/arena.asm), which has no
# feature.toml of its own, so they are attributed to the feature they SERVE and
# opened through `scene_writes` — the same shape room_bg, split_v_bg and
# m7dg_floor use, and the same statement every BG feature makes: the
# feature that owns the scene's display owns all of it.
#
# The lies-check compares per REGISTER rather than per claim, which is why this
# works: the opened set (BGMODE, TM) and the owner-written set (M7SEL) are
# disjoint.
[[claims.reg]]
name = "mo_display"
registers = ["BGMODE", "TM", "M7SEL"]
scene_writes = ["BGMODE", "TM"]
