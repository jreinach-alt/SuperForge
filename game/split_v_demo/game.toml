# split_v_demo — the vertical window dual-view.
#
# ONE SCENE, and no scene machine beyond it: this is a primitive demonstration
# rather than a game, and the four things it teaches are all properties of one
# screen. scroller / camera_follow / scroll_run's shape.
#
# NOT COMPOSED, each for a reason the allocator would enforce anyway:
#   backdrop     — a scene with a BG feature cannot also compose it
#                  (both declare BGMODE + TM). svd_bg claims CGRAM word 0,
#                  which here is the SEAM BAR's colour rather than a wash.
#   window_iris  — claims W12SEL/WOBJSEL/TMW, the registers the split IS,
#                  plus an hdma claim on WH0/WH1 against svd_bg's on
#                  WH0..WH3. The mechanism's neighbour, not its shape.
#   split_v_bg   — the sibling rail's feature. It is the SEAMLESS split
#                  (fixed centre seam, mid +/- spread cameras, a BG3 bevel);
#                  this rail's seam MOVES, SLANTS and CLIPS OBJ, and its
#                  cameras are two independent players. Same primitive, a
#                  different subject — and the two cannot compose, because
#                  they would be two owners of every window register.
#   split_band   — the other splitter, and the sole active-phase owner of
#                  BGMODE. A second BGMODE writer is refused.
#
# input2 is here for the same reason as split_v_fight's: player 2 drives the
# right camera, so the second pad is read every frame.
#
# REGION + TICK_SCALE, and this is the one rig in the split family that takes
# them. The judgement is about WHAT MOVES AND WHY. This rail's motion is two
# PLAYERS' cameras and a player's seam sweep — pad-driven, continuous, and
# perceived as speed — so a PAL player pans a fifth slower at every one of
# them. Its siblings' motion is an INSTRUMENT (a frame-indexed sweep, a
# constant-delta pan that is the position oracle a test reads, a pose step
# chosen to fill a capture window), and each of those game.tomls says so where
# it declines this pair.
#   region      reads $213F bit 4 once at boot and publishes ES_RGN_PAL.
#   tick_scale  turns a per-frame delta into a region-correct one, carrying
#               the fraction. It `depends = ["region"]`.
# TWO RATES: SVD_CAM_SPD (both cameras, one shared accumulator — same base)
# and the seam's one px per frame (its own pair). NOT scaled: the MODE cycle,
# which is a press-edge event rather than a rate.
globals = ["scene_mgr", "fade", "input", "input2", "oam_sprites",
           "enter_scr", "svd_rom", "region", "tick_scale"]

[[scene]]
id = "demo"
features = ["svd_bg", "svd_obj"]
