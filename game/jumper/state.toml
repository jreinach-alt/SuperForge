# jumper user state.
#
# Every word is game state the scene owns, so it lives here rather than on a
# feature: the physics is GAME-SIDE, and the routines that read and write these
# words are all in scenes/sky.asm.
#
# `tent` holds the tentative 8.8 position. Carrying it on the STACK across the
# two box probes instead would put a width-sensitive push/pull balance on the
# audit list; a DP word says the same thing with none — the platformer's
# US_NEWY made the same trade. `bx`/`by` are jr_solid_box's box-corner
# operands: a subroutine needs named words where a macro would take operands.
[scene.sky]
px = "u16@dp"            # player x, pixels (the horizontal axis is the game's)
pyf = "u16@dp"           # player y, 8.8 fixed — the physics owns this
vy = "u16@dp"            # vertical velocity, signed 8.8 (negative = up)
tent = "u16@dp"          # tentative 8.8 y, before the probe verdict
pyi = "u16@dp"           # draw-pixel mirror of pyf's high byte
newx = "u16@dp"          # horizontal move-check scratch
bx = "u16@dp"            # jr_solid_box in: box top-left x
by = "u16@dp"            # jr_solid_box in: box top-left y
grounded = "u16@dp"      # 1 = standing (physics owns this; the jump gates on it)
frames = "u16@dp"        # frames since enter — the free-running heartbeat

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# TWO RATES, TWO PAIRS, and the second pair is the one worth reading. A
# ballistic arc has a VELOCITY (px per frame, region scale r) and a GRAVITY
# (px per frame SQUARED, region scale r^2), and tick_scale's TS_STEP applies
# exactly one r. So the run rate is an ordinary consumer pair, while gravity
# feeds TS_STEP a base that already carries one r on the PAL arm -- see
# scenes/sky.asm, which is the only place that arithmetic is spelled.
#
# Each pair is (carried fraction, this frame's published whole-unit step). The
# step is computed ONCE at the top of the tick and read by every add.
tsr_acc = "u16@dp"       # the run: JR_SPEED px per frame
                         # TICK: ok -- the carried FRACTION of a scaled rate.
                         # It exists to remove a frame coupling, not to hold
                         # one, and it has no meaning in frames.
tsr = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok -- the OUTPUT of the scaler; already
                         # expressed against the declared tick.
tsg_acc = "u16@dp"       # gravity: JR_GRAVITY of 8.8 velocity per frame
                         # TICK: ok -- as tsr_acc.
tsg = "u16@dp"           # ...and this frame's answer, in whole 8.8 counts
                         # TICK: ok -- as tsr.

# --- the two velocity constants, region-selected once at enter --------------
# These are ASSIGNMENTS rather than accumulations -- a take-off writes one and
# a terminal clamp writes the other -- so there is no fraction to carry and no
# accumulator to declare. What they need is the region's answer, and the
# console cannot change region, so the pair is chosen once at enter and every
# site reads the word. On NTSC each holds the constant jumper.inc authored, to
# the bit, which is why the bit-exact `_sim` oracle in tests/test_jumper.py
# still matches frame for frame.
vmax = "u16@dp"          # terminal fall speed, 8.8 (JR_MAX_FALL * r)
                         # TICK: ok -- a VELOCITY already expressed against the
                         # declared tick; it is the scaler's output, not a
                         # frame count.
vjump = "u16@dp"         # take-off velocity, 8.8 two's complement
                         # (-JR_JUMP_VEL * r)
                         # TICK: ok -- as vmax.
