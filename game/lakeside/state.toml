# lakeside user state.
#
# The lake scene owns the timebase pair for the one rate this rail has. The
# accumulated SCROLL is not here — it is `water`'s own dp claim
# (ES_WAT_SCROLL), because the routine that READS it is that feature's VBlank
# commit. This scene WRITES it through `wat_advance`, which is the same
# division scroller_bg / scenes/world.asm draw between a feature's camera and
# the scene that drives it.
#
# NO FRAME HEARTBEAT. The sibling rails carry a `frames` word incremented once
# per tick; this one does not, because nothing here would read it. A word in a
# FRAME unit that no consumer consults is a coupling that buys nothing —
# `make tick-check` flags exactly that shape, and deleting the word is the
# answer rather than stamping it with an override. The rail's own clock is the
# timebase below, whose unit is the declared tick.

[scene.title]
# The title scene declares no state: it shows a fixed picture and waits for
# Start. An empty scene table is legal — the allocator emits the scene's map
# with its feature claims and no user words.

[scene.lake]
# The still gate: 0 = drifting, 1 = held. A LATCHED TOGGLE rather than a
# level-triggered hold, and the reason is that stillness is a real STATE of
# this rail rather than a per-frame condition — a picture that does not move
# is the control every "the surface moved by exactly N pixels" claim is
# measured against, and a control that depends on a button being down at the
# instant of measurement is not one.
stilled = "u16@dp"

# --- the sea's own cue clock ------------------------------------------------
# HOW FAR THE SURFACE HAS DRIFTED SINCE THE LAST BREAK, in world pixels, and
# nothing else. It is advanced by the SAME published step `wat_advance` takes
# and inside the SAME branch, so it is a copy of the picture's own position
# modulo the surf cycle rather than a second clock beside it: after enter (both
# start at 0) `wave == ES_WAT_SCROLL mod LK_SURF_PERIOD_PX` holds for ever, and
# the frame this word wraps is the frame the swash on screen restarts. A
# free-running counter here would be a second opinion about when a wave breaks,
# and two opinions is exactly the defect a sound gated on a picture exists to
# rule out.
#
# TICK: ok -- a POSITION in world pixels, not a count of frames. Its increment
# is US_TSW, which is tick_scale's published whole-unit step and therefore
# already region-corrected; the wall-clock interval this produces (about 2.1 s)
# is a CONSEQUENCE of the drift rate and the art's cycle length, not a number
# anybody wrote down in frames. On PAL the same 128 px arrive in fewer, larger
# steps and the sea sounds the same.
wave = "u16@dp"

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# ONE RATE, ONE PAIR. The drift is a velocity in px/frame, so it takes exactly
# one factor of the region ratio and one TS_STEP applies exactly that. There
# is no second pair here: a rail with an ACCELERATION would need one whose
# base already carries the second r on the PAL arm (game/jumper/state.toml is
# that case, and its two pairs are why).
#
# The pair is (carried fraction, this frame's published whole-unit step). The
# step is computed ONCE at the top of the tick and read by the one add that
# consumes it.
tsw_acc = "u16@dp"       # the drift: LK_WATER_SPEED px per frame
                         # TICK: ok -- the carried FRACTION of a scaled rate.
                         # It exists to remove a frame coupling, not to hold
                         # one, and it has no meaning in frames.
tsw = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok -- the OUTPUT of the scaler; already
                         # expressed against the declared tick.
