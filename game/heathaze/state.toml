# heathaze user state.
#
# The desert scene owns the timebase pair for the one rate this rail has. The
# accumulated PHASE is not here — it is `haze`'s own dp claim (ES_HZ_PHASE),
# because the routine that READS it is that feature's VBlank commit. This
# scene WRITES it through `hz_advance`, which is the division lakeside draws
# between `water`'s scroll and the scene that drives it.
#
# NO FRAME HEARTBEAT. Nothing here would read one, and a word in a FRAME unit
# that no consumer consults is a coupling that buys nothing — `make tick-check`
# flags exactly that shape, and deleting the word is the answer rather than
# stamping it with an override.

[scene.title]
# The title declares no state: a fixed picture and a wait for Start.

[scene.desert]
# The flat control: 0 = shimmering, 1 = the zero-displacement table. A LATCHED TOGGLE rather than a
# level-triggered hold, and for the reason lakeside gives: stillness is a real
# STATE here, because a picture that does not move is the control every
# "scanline y is displaced by exactly N pixels" claim is measured against, and
# a control that depends on a button being down at the instant of measurement
# is not one.
flat = "u16@dp"

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
# ONE RATE, ONE PAIR. The phase advance is a velocity in phases/frame, so it
# takes exactly one factor of the region ratio and one TS_STEP applies exactly
# that. A rail with an ACCELERATION would need a pair whose base already
# carries the second r on the PAL arm (game/jumper/state.toml is that case).
tsh_acc = "u16@dp"       # the shimmer: HZ_PHASE_BASE phases per frame
                         # TICK: ok -- the carried FRACTION of a scaled rate.
                         # It exists to remove a frame coupling, not to hold
                         # one, and it has no meaning in frames.
tsh = "u16@dp"           # ...and this frame's answer, in whole phases
                         # TICK: ok -- the OUTPUT of the scaler; already
                         # expressed against the declared tick.

# --- the wind bed's cadence counter (see scenes/desert.asm, hz_weather) -----
# A SOUND EFFECT IS ONE-SHOT and the SFX ring delivers at most one request a
# frame, so an AMBIENCE has to be re-triggered by the rail. This word is what
# decides when.
#
# ITS UNIT IS SHIMMER PHASES, NOT FRAMES, and that is the whole reason it is
# here rather than being a frame counter. `tsh` above is already this frame's
# region-corrected phase advance; accumulating THAT is a clock that ticks at
# the same wall-clock rate on both machines for free, so PAL and NTSC hear the
# same wind without a second TS_STEP, a second accumulator, or a second rate
# to keep in step with the first.
wind = "u16@dp"          # phases accumulated since the last gust was queued
                         # TICK: ok -- a COUNT of phases, not of frames. The
                         # phase is the output of tsh's scaler, so this word
                         # is already expressed against the declared tick and
                         # a x5/6 applied here would scale it twice.
