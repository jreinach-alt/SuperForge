# heathaze — heat shimmer as a per-scanline displacement, not as artwork.
#
# =============================================================================
# WHAT YOU SEE
# =============================================================================
# A desert road running to a mesa ridge under a bleached sky. Below the
# horizon the whole of BG1 BOILS: every scanline is drawn from a slightly
# different SOURCE ROW, so rows are duplicated and skipped and the picture
# compresses and stretches vertically. The displacement peaks at the horizon —
# where a sightline has travelled through the most hot air — and decays toward
# the viewer, and the pattern travels upward. The sky above the band does not
# move at all, which is what makes it read as heat rather than as a broken
# picture.
#
# VERTICAL, NOT HORIZONTAL, and that is the effect's whole character. An
# inferior mirage comes from a VERTICAL refractive-index gradient — hot thin
# air at the ground, cooler denser air above — and rays bend along the
# gradient, which is why a mirage shows an inverted patch of sky below the
# horizon and the eye reads it as water. A per-scanline BGnHOFS only shears
# each row sideways and every source row still appears exactly once; only a
# per-scanline BGnVOFS duplicates and skips them, and that squashing is the
# boiling.
#
# B toggles the shimmer. That is the concept sheet's "before distortion /
# after heat haze" pair, live, on one binary — and it is the control every
# per-scanline measurement in tests/test_heathaze.py is taken against.
# Start returns to the title.
#
# =============================================================================
# WHAT IT DEMONSTRATES
# =============================================================================
# THE WARP IS A TABLE, NOT A TILE. The intuitive way to draw heat haze is to
# author pre-warped copies of the affected art and animate between them. That
# doubles the tile budget, distorts only what was drawn in advance, and cannot
# follow the art it distorts. The PPU bends a whole layer natively — a
# different BG1VOFS per scanline through HDMA, at no CPU cost during active
# display — so this rail draws the DISPLACEMENT instead of the distortion.
#
# ONE WRITE A CHANNEL, A FRAME. hz_rom holds 64 complete phases and a flat
# control at a 256 B stride, so a phase's address is HZ_WARP + (index << 8)
# and advancing the animation is a single 8-bit store to a channel's A1T high
# byte — two stores a frame, one per axis. Rebuilding the table instead is
# priced by platformer_bg at ~16 cycles an entry — ~2,000 CPU cycles a frame
# over this 124-line band, per channel, out of the ~28-37k a whole frame gets.
#
# =============================================================================
# TRANSITION HYGIENE, ON A REGISTER THAT IS NOT THE BLENDER
# =============================================================================
# This is the rail's second finding and it generalises one the tree already
# had. `blend_off` exists because the composed blend state is per scene and
# nothing carries it across an edge. BG1VOFS is in exactly the same position
# here: `haze` drives it per scanline, so at the end of the scene the port
# holds whatever the last scanline of the last armed frame left in it — up to
# four pixels of arbitrary displacement, measured off the shipped table. A successor that composes no BG1VOFS
# claimant writes nothing and inherits it.
#
# So `title` composes `hz_flat`, whose whole content is that port's flat base,
# exactly as it composes `blend_off` for the blender. AN HDMA-DRIVEN REGISTER
# NEEDS THE SAME PER-SCENE DISARM DISCIPLINE THE BLENDER DOES — colour math
# was never special, it was just the first port anyone noticed it on.
#
# =============================================================================
# WHY BG1VOFS IS NOT IN `hz_bg`
# =============================================================================
# `hz_bg` is global: both scenes draw the same world. In `desert` the port has
# a transfer claim on it, so the CPU write must be declared a `seed` the
# transfer overrides; on `title` there is no transfer, and a seed with nothing
# overriding it is refused (allocate.check_reg_ownership, checks 2 and 3). One
# feature cannot be both, and a feature cannot conditionally claim — so the
# port belongs to whichever feature answers for it in that scene.
#
# =============================================================================
# WHY THERE IS NO SUB-SCREEN GLARE LAYER
# =============================================================================
# There was one. A BG2 shimmer layer on the sub screen, half-added onto the
# world by the colour-math unit, with its own HDMA channel on BG2VOFS running
# a fixed phase ahead of BG1's so the glare slid across a surface that was
# itself moving. It worked, it was verified as real colour math, and it was
# cut on the owner's review: the displacement alone reads better.
#
# It is worth recording what the extra layer COST, because the cost is not
# obvious from a screenshot. With two layers displaced by two different
# amounts the frame stops being the control displaced, so BG1's own
# displacement can only be recovered through a mask decoded out of VRAM — and
# near the bottom of the band, where the glare was densest, that recovery is
# not reliable enough to assert a per-row equality on. The test carried two
# FLOORS instead: 62 decidable rows, 81% exact. With one moving layer the
# floors are deleted rather than left as dead tolerance: 130 decidable rows,
# 121 of them showing exactly the byte the ROM holds for that scanline and
# every one of the rest an immediately adjacent entry — a one-line ambiguity
# about WHICH byte, never about the value.
#
# A second layer does not just cost VRAM and a channel. It costs the ability
# to make an exact statement about the first one.
globals = ["scene_mgr", "fade", "input", "text_dp", "font_rom", "bg_text",
           "hz_bg", "hz_rom", "region", "tick_scale"]

# The title: the same world, undistorted, with both the blender and the scroll
# register carrying their own off states.
[[scene]]
id = "title"
features = ["blend_off", "hz_flat"]

# The desert: the same world, shimmering.
[[scene]]
id = "desert"
features = ["blend_off", "haze"]

[[edge]]
from = "title"
to = "desert"
style = "fade"

# The return edge is the one the hygiene rule is about: `desert` leaves BG1VOFS
# wherever the last scanline put it, and `title` composes `hz_flat` so entering
# it writes the port from its own composed symbol rather than inheriting a warp.
[[edge]]
from = "desert"
to = "title"
style = "fade"
