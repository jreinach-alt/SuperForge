# scroll_run user state.
#
# EVERY WORD HERE IS GAME STATE THE SCENE OWNS, which is why it lives on the
# game rather than on a feature: the level and its physics are GAME-SIDE, and
# the routines that read and write these words are all in scenes/run.asm. One
# deliberate exception — the camera pair is sr_bg's `sr_cam` claim, because the
# routine that READS it is that feature's NMI commit.
#
# NAMED WORDS RATHER THAN STACK SCRATCH, deliberately. `tent` holds the
# tentative 8.8 position across a probe instead of riding PHA/PLA: a value
# pushed in one width and popped in another is the silent-corruption class
# rule 6 exists for, and a named DP word cannot drift that way (jumper's
# US_TENT makes the same trade). `yb`/`topy` are the one-way-platform probe
# words, named here for the same reason rather than borrowing a WRAM scratch
# byte for a moment. `bx`/`by` are sr_solid_box's box-corner operands.
[scene.run]
px = "u16@dp"            # player world x, pixels 0..511 — the full two pages
pyf = "u16@dp"           # player y, 8.8 fixed — the physics owns this
vy = "u16@dp"            # vertical velocity, signed 8.8 (negative = up)
tent = "u16@dp"          # tentative 8.8 y, held across the probe
pyi = "u16@dp"           # draw-pixel mirror of pyf's high byte
newx = "u16@dp"          # horizontal move-check scratch
bx = "u16@dp"            # sr_solid_box in: box top-left x
by = "u16@dp"            # sr_solid_box in: box top-left y
yb = "u16@dp"            # one-way probe row: the tile row being tested
topy = "u16@dp"          # one-way crossing compare: the new bottom's tile top
grounded = "u16@dp"      # 1 = standing (physics owns this; the jump gates on it)
scrx = "u16@dp"          # player screen x = px - cam_x (the rail's subtraction)
state = "u16@dp"         # 0 = playing, 1 = won (input frozen, GOAL on BG3)
frames = "u16@dp"        # frames since enter — the free-running heartbeat

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# TWO RATES, TWO PAIRS, and the second pair is the one worth reading. A
# ballistic arc has a VELOCITY (px per frame, region scale r) and a GRAVITY
# (px per frame SQUARED, region scale r^2), and tick_scale's TS_STEP applies
# exactly one r. So the run rate is an ordinary consumer pair, while gravity
# feeds TS_STEP a base that already carries one r on the PAL arm — see
# scenes/run.asm, which is the only place that arithmetic is spelled.
#
# Each pair is (carried fraction, this frame's published whole-unit step). The
# step is computed ONCE at the top of the tick and read by every add.
tsr_acc = "u16@dp"       # the run: SR_SPEED px per frame
                         # TICK: ok — the carried FRACTION of a scaled rate.
                         # It exists to remove a frame coupling, not to hold
                         # one, and it has no meaning in frames.
tsr = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok — the OUTPUT of the scaler; already
                         # expressed against the declared tick.
tsg_acc = "u16@dp"       # gravity: SR_GRAVITY of 8.8 velocity per frame
                         # TICK: ok — as tsr_acc.
tsg = "u16@dp"           # ...and this frame's answer, in whole 8.8 counts
                         # TICK: ok — as tsr.

# --- the two velocity constants, region-selected once at enter --------------
# These are ASSIGNMENTS rather than accumulations — a take-off writes one and
# the terminal clamp writes the other — so there is no fraction to carry and
# no accumulator to declare. What they need is the region's answer, and a
# console cannot change region, so the pair is chosen once at enter and every
# site reads the word.
vmax = "u16@dp"          # terminal fall speed, 8.8 (SR_MAX_FALL * r)
                         # TICK: ok — a VELOCITY already expressed against the
                         # declared tick; it is the scaler's output, not a
                         # frame count.
vjump = "u16@dp"         # take-off velocity, 8.8 two's complement
                         # TICK: ok — as vmax.
