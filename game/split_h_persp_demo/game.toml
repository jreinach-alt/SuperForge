# split_h_persp_demo — two perspective cameras, one frame.
#
# TWO PERSPECTIVE CAMERAS over one wrapping checker plane, stacked at a clean
# single-scanline seam. The top 112 scanlines are camera A's full per-scanline
# trapezoid and the bottom 112 are camera B's — a DIFFERENT trapezoid, at a
# different world position, animating on a DIFFERENT axis. Neither band runs a
# live perspective solve: each streams a ROM-resident band-local pose straight
# through INDIRECT HDMA, so the whole per-frame work is four stores in VBlank.
#
# ONE SCENE, no edges, mirroring split_h_2p_demo's, split_v_fight's and
# m7_dungeon's shape. The picture is the showcase.
#
# THE PADS ARE THE TWO DRIVERS. Left/Right steps camera A's heading one pose
# per frame held; Up/Down steps camera B's zoom. Both could as easily animate
# themselves off a free-running counter, and they do not on purpose: a
# free-running animation can only be SAMPLED, while a pad-driven one can be
# stopped, held and walked BACK.
# It also makes the rail's central claim directly assertable: drive ONE axis
# and the OTHER band's pixels must not move in the same frame.
#
# NOT COMPOSED, and each for a reason the allocator would enforce anyway:
#   sh2_cam     -- the obvious candidate, and NOT this rail's supply (run as a
#                  composition rather than reasoned): it streams ONE
#                  heading-indexed pose set on both bands, and this rail's
#                  camera B animates its SCALE. Composing it renders two
#                  heading cameras of the same trapezoid, which is
#                  split_h_2p_demo. Sibling, not parameterisation.
#   shm_cam     -- the OTHER direction of the same error: its matrix claims
#                  are DIRECT with ONE constant 4-byte unit per band, which is
#                  a FLAT camera per band by construction. This rail's bands
#                  are per-scanline trapezoids.
#   mode7_persp -- one band, a CPU origin shadow, a 180-line 1024-B stride and
#                  a 128 KB pose_rom. Sibling, on the settled ruling.
#   m7_affine   -- a 2,048 B LUT at scale 1.0 ONLY, so it cannot express either
#                  band's ramp; and it REFUSES anyway, because its single
#                  `m7_matrix` claim covers the ORIGIN registers as well as
#                  M7A-M7D and collides with shp_origin_seed on the reg x reg
#                  check before the matrix conflict is reached.
#   m7_project  -- depends on m7_affine, and its inverse is the transpose of a
#                  UNIFORM rotation, which a per-scanline matrix does not have.
#   split_band  -- splits BGMODE/TM per scanline. This rail writes BGMODE 7 and
#                  TM 1 ONCE under forced blank for all 224 lines: the split is
#                  of the camera MATRIX and ORIGIN, not of the video mode, so
#                  there is no second splitter to generalise.
#   mode7_floor -- depends on world_rom (a 256 KB map this rail never reads)
#                  and pins CGRAM 0..16 for microzero's palette.
#   sh2_floor   -- the right SHAPE and the wrong blob: `depends = ["sh2_rom"]`
#                  and its floor_arm names that rail's labels. shp_floor's
#                  header records why "the same code against a different blob"
#                  is a new feature here by construction.
#   backdrop    -- shp_floor claims CGRAM word 0, which in Mode 7 is BOTH
#                  palette index 0 and the backdrop slot, so it has exactly one
#                  owner by hardware contract.
#   bg_text     -- BG3 does not exist in Mode 7. The picture is the whole HUD.
#   oam_sprites -- nothing draws, and no OAM is initialised. A cast would add
#                  claims with no content behind them.
#   input2      -- one pad drives both axes, on different buttons. A second pad
#                  would add a claim with no reader.
#   audio       -- silent, deliberately: nothing here is timed to sound, and a
#                  "prettify the demo" addition buys picture at the cost of the
#                  signal.
# REGION PARITY IS NOT THIS RAIL'S SUBJECT, so it does not compose `region` +
# `tick_scale`. Its central claim is a PER-FRAME structural one — drive one
# axis and the other band's pixels must not move IN THE SAME FRAME — and its
# -DSHP_AUTODEMO build makes the heading literally the frame counter mod 64.
# Both are statements about a frame, and a region-scaled step is a statement
# about a second.
globals = ["scene_mgr", "fade", "input", "shp_rom"]

[[scene]]
id = "persp"
features = ["shp_floor", "shp_cam"]
