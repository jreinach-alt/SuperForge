# maze user state.
#
# The player's position and the tentative pair the per-axis move-check probes.
# ALL @dp: every word is on the per-frame path. col_map's own CM_PX/CM_PY/
# CM_FLAG are NOT here — they are that feature's `cm_hot` dp claim; the
# candidate pair below is the GAME's half of the handshake (m7_dungeon's
# cand_px/cand_py division, unchanged).
#
# NO [init]-style zero fill: `enter` writes px/py/frames and every tick writes
# cand_x/cand_y before anything reads them (rule 5 — power-on WRAM is random,
# and a zero fill "to be safe" would hide the day that stops being true).
[scene.room]
px = "u16@dp"            # player box top-left, world px (= screen px = OAM x:
py = "u16@dp"            #   the room is one screen and scroll is pinned)
cand_x = "u16@dp"        # the tentative position under probe, before the
cand_y = "u16@dp"        #   move-check's verdict commits or drops it
# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# ONE RATE, ONE PAIR. MZ_SPEED is the only velocity here: both
# axes step by it and the collision probe only gates whether the step is kept,
# so one accumulator serves the whole rail. The pair is per-RATE, not per-axis
# — x and y share a base, so they share the carried fraction.
ts_acc = "u16@dp"        # the carried fraction, 8.8 — what makes a
                         # non-integer per-frame step exact over time instead
                         # of re-quantised every frame.
                         # TICK: ok — this word EXISTS to remove a frame
                         # coupling, not to express one; it is the fraction the
                         # scaler carries and has no meaning in frames.
ts_step = "u16@dp"       # this frame's whole-unit step in px, published once
                         # by TS_STEP and consumed by every axis move.
                         # TICK: ok — the OUTPUT of the scaler; already
                         # expressed against the declared tick.

frames = "u16@dp"        # frames since enter — the free-running heartbeat a
                         #   test reads to tell "tick running" from "stuck"
