# mode7_chamber user game state. One scene, so everything is
# scene-scoped: nothing survives a transition because there is no transition.
#
# THE WHOLE OF IT IS THE ROLL. This rail has no player, no score, no collision
# and no camera heading — the only thing that changes frame to frame is where
# the chamber's vertical scroll has got to, and the state machine that decides
# where it goes next. The bow step is m7_barrel's (an engine claim, because the
# feature is what indexes its own tables); everything here is the game's.
#
# ALL @dp: every one of these is read and written by the same kernel every
# frame, and the kernel is the rail's entire per-frame CPU cost.
[scene.chamber]
posy   = "u24@dp"        # the 16.8 vertical position accumulator: +0 fraction,
                         # +1..+2 the integer world Y. The integer half is read
                         # as one word at +1: a 24-bit add with a
                         # sign-extension byte is exactly what a signed 8.8
                         # sign-extension byte is exactly what a signed 8.8
                         # velocity into a 16-bit position needs
vmag   = "u16@dp"        # unsigned 8.8 speed magnitude, this frame
vel    = "u16@dp"        # SIGNED 8.8 velocity applied this frame (= +/-vmag)
hcur   = "u16@dp"        # the current surge's randomised target peak (8.8)
hump   = "u16@dp"        # surge index within the leg, 0..NUM_HUMPS-1
subph  = "u16@dp"        # 0 = rising toward the peak, 1 = falling away
dir    = "u16@dp"        # 0 = roll forward (+), 1 = reverse (-)
rstate = "u16@dp"        # 0 = ROLLING, 1 = HOLDING (the dead stop between legs)
hold   = "u16@dp"        # hold-timer countdown, in frames
rng_f  = "u16@dp"        # forward-leg LFSR — its own variance pattern
rng_r  = "u16@dp"        # reverse-leg LFSR — a DIFFERENT pattern, so the two
                         # directions do not replay each other's surges

# --- the roll's four numbers, in the units of the RUNNING console ----------
# (engine/features/tick_scale, composed in game.toml)
#
# THE ROLL IS A VELOCITY MODEL, so nothing here is a published integer step of
# the kind `scroller` and `brawler` consume. What the timebase changes is the
# four constants the velocity is BUILT from, and each takes a different power
# of the frame ratio — m7c_roll.asm's "THE ROLL IN TWO REGIONS" block derives
# which and why. `roll_region_init` writes all four once, from ES_RGN_PAL, and
# the kernel reads them instead of the immediates it used to carry.
#
# WORDS RATHER THAN A BRANCH AT EACH SITE: there are seven use sites across
# roll_tick and roll_draw_peak, and a region test at each one is seven chances
# to test the wrong sense. One test, four words, and the kernel stops knowing
# there are two machines.
r_accel  = "u16@dp"      # the rise rate the running console uses
                         # TICK: ok — this word EXISTS to remove a frame
                         # coupling: it is ROLL_ACCEL re-expressed for the
                         # frame the console actually has, so that the
                         # acceleration per REAL second is the same number on
                         # both machines.
r_decel  = "u16@dp"      # ...and the fall rate
                         # TICK: ok — as r_accel.
r_vfloor = "u16@dp"      # ...the creep floor between surges (a velocity)
                         # TICK: ok — as r_accel.
r_hold   = "u16@dp"      # ...and the dead-stop dwell, 30 on NTSC and 25 on
                         #   PAL — half a second on both
                         # TICK: ok — the whole point of the word is that the
                         # dwell is half a second on both machines rather than
                         # thirty frames on both.
r_frac   = "u16@dp"      # the ramp accumulator's carried fraction, in 1/256
                         #   of an LSB of velocity. It is what lets a PAL rise
                         #   rate of 2.889 LSB/frame be applied exactly rather
                         #   than rounded to 3 — see ROLL_RAMP.
                         # TICK: ok — a carried FRACTION, the thing that
                         # REMOVES the frame coupling. It has no meaning in
                         # frames and is cleared at the top of every leg.
gtmp     = "u16@dp"      # roll_gain's and ROLL_RAMP's one scratch word (the
                         #   surge peak's region scale, the fall arm's step).
                         #   Dead between calls.
