# split_v_fight user state.
#
# `mid` and `spread` are NOT here: they are split_v_bg's own dp claims, because
# the routine that reads them is the feature's VBlank commit. What lives here
# is what the GAME's director owns -- the fighters, the easing accumulator and
# the side-swap latch.
[scene.fight]
fx1     = "u16@dp"       # fighter 1 (red) world x, px
fx2     = "u16@dp"       # fighter 2 (blue) world x, px
spreadf = "u16@dp"       # the spread EASE accumulator, 8.8. The integer part
                         # is what reaches split_v_bg; keeping the fraction
                         # here is what makes the divergence smooth rather
                         # than stepping a pixel at a time.
crossed = "u16@dp"       # 0 = red left, 1 = the fighters have swapped sides.
                         # Latched so a crossover is an EDGE, not a state.

# --- the two fighters, as PAIRS ---------------------------------------------
# Every word below is `u16[2]@dp`: ONE claim holding fighter 1's word and
# fighter 2's, adjacent and in that order because the allocator places an array
# contiguously. That is what lets one routine serve both fighters indexed by
# X = 0 or 2 -- the shape fx1/fx2 already use, but declared rather than
# asserted after the fact. (fx1/fx2 stay two scalars: their symbol names are
# read by tests and by the gallery drive, and renaming them would move a
# published surface for no gain.)
hp = "u16[2]@dp"         # life segments left, SV_HP_MAX..0. 0 = KO'd
ast = "u16[2]@dp"        # anim state — ALSO the sv_anim table stride index
atk = "u16[2]@dp"        # anim clock (the frame-rate divider)
afr = "u16[2]@dp"        # anim step within the current table
swg = "u16[2]@dp"        # frames left in the swing; 0 = not attacking
swh = "u16[2]@dp"        # 1 = this swing already landed. The one-hit-per-swing
                         # latch that makes the active window a combat pattern
                         # rather than a per-frame damage tick
jmp = "u16[2]@dp"        # height above the floor, 8.8. 0 = grounded, and the
                         # fraction is what makes the arc smooth rather than
                         # stepping a pixel a frame
jvel = "u16[2]@dp"       # vertical velocity, 8.8 SIGNED (up is positive)
hitt = "u16[2]@dp"       # frames left in the hit reaction; 0 = in control

# --- the round --------------------------------------------------------------
rstate = "u16@dp"        # SV_R_COUNT / SV_R_LIVE / SV_R_KO
rtimer = "u16@dp"        # frames left in the current round phase. The
                         # countdown DERIVES its glyph from this rather than
                         # keeping a second word that could disagree with it

# --- the pad the fighter step is reading (write-before-read per call) -------
# ONE step routine serves both fighters, indexed by X, but the two pads are
# input's and input2's separate words and cannot be indexed as a pair. So the
# caller stages them: two stores per fighter per frame, against a second copy
# of the whole control block.
pcur = "u16@dp"          # this fighter's held buttons
ppress = "u16@dp"        # ...and the ones that went down THIS frame
fx0 = "u16@dp"           # where this fighter stood when the frame began. The
                         # walk animation is chosen from whether it MOVED, not
                         # from whether a direction is held: a fighter pinned
                         # against an arena wall would otherwise run on the
                         # spot forever

# --- draw scratch (write-before-read per call) ------------------------------
tile = "u16@dp"          # the OAM tile byte being assembled
attr = "u16@dp"          # ...and its attribute byte
oy = "u16@dp"            # the sprite's screen y for this placement
slot = "u16@dp"          # ...and the OAM slot it is going into, while the
                         # index registers are busy carrying x and the
                         # fighter's pair index

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# FIVE RATES, FIVE PAIRS. A ballistic arc has a VELOCITY (px per frame, region
# scale r) and a GRAVITY (px per frame SQUARED, region scale r^2), and
# tick_scale's TS_STEP applies exactly one r -- so four of these are ordinary
# consumer pairs and gravity feeds TS_STEP a base that already carries one r
# on the PAL arm. scenes/fight.asm is the only place that arithmetic is
# spelled.
#
# The walk and the lunge keep SEPARATE pairs even though both bases are 2 px
# per frame today: they are two different tuning knobs (SV_WALK_SPD against
# SV_SWING_LUNGE) and a shared accumulator would couple them the day either
# moves. The two FIGHTERS share every pair, which is the other half of the
# same rule -- they are two consumers of ONE rate, and the published step is
# the same number for both.
tsw_acc = "u16@dp"       # the walk: SV_WALK_SPD px per frame, both fighters
                         # TICK: ok -- the carried FRACTION of a scaled rate.
                         # It exists to remove a frame coupling, not to hold
                         # one, and it has no meaning in frames.
tsw = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok -- the OUTPUT of the scaler; already
                         # expressed against the declared tick.
tsl_acc = "u16@dp"       # the lunge: SV_SWING_LUNGE px per active frame
                         # TICK: ok -- as tsw_acc.
tsl = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok -- as tsw.
tss_acc = "u16@dp"       # the divider's EASE: SV_SPR_STEP of 8.8 px per frame
                         # TICK: ok -- as tsw_acc.
tss = "u16@dp"           # ...and this frame's answer, in 8.8 px (the published
                         # step is doubled at the point it is stored -- see
                         # fight.asm's TS_SPREAD_BASE for why the base is a
                         # HALF unit)
                         # TICK: ok -- as tsw.
tsa_acc = "u16@dp"       # the animation clock: one anim unit per frame, both
                         # fighters. This is the pair that answers docs/95
                         # §5.2's class C -- a small-integer divider with no
                         # correct x5/6 -- by scaling what the clock ADVANCES
                         # BY instead of the divider it is compared against.
                         # TICK: ok -- as tsw_acc.
tsa = "u16@dp"           # ...and this frame's answer, in whole anim units
                         # TICK: ok -- as tsw.
tsg_acc = "u16@dp"       # gravity: SV_GRAV of 8.8 velocity per frame
                         # TICK: ok -- as tsw_acc.
tsg = "u16@dp"           # ...and this frame's answer, in whole 8.8 counts
                         # TICK: ok -- as tsw.

# --- the one velocity constant, region-selected once at enter ---------------
# An ASSIGNMENT rather than an accumulation -- a take-off writes it and
# nothing else does -- so there is no fraction to carry and no accumulator to
# declare. A console cannot change region, so it is chosen once at enter and
# the take-off reads the word. On NTSC it holds SV_JUMP_V0 to the bit.
vjump = "u16@dp"         # take-off velocity, 8.8 (SV_JUMP_V0 * r; up is
                         # positive on this rail, so no negation)
                         # TICK: ok -- a VELOCITY already expressed against
                         # the declared tick; the scaler's output, not a frame
                         # count.
