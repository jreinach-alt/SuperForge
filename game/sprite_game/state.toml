# sprite_game user game state.
#
# Six words, all `@dp` and all scene-scoped: the player pair, the dot pair, the
# score and the dot's preset index. They are DECLARED rather than placed, so the
# allocator picks the addresses and a collision with a feature's own DP claim is
# a build failure rather than a silent overlap.
#
# NO [global] SECTION: one scene, no transitions, nothing survives anything.

[scene.play]
px = "u16@dp"            # player x, screen pixels, top-left of the 8x8 box
py = "u16@dp"            # player y
dot_x = "u16@dp"         # dot x — one of the four preset spots
dot_y = "u16@dp"         # dot y
score = "u16@dp"         # catches so far, plain binary +1 per catch. Nothing
                         # prints it, so no BCD — the rendered output of a
                         # catch is the dot's JUMP
dot_idx = "u16@dp"       # which preset the dot sits on (0-3, wraps by mask)

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# ONE RATE, ONE PAIR. Everything that moves on this rail moves at SPRG_SPEED —
# the player is the only actor with a velocity, and the dot teleports between
# four preset spots rather than travelling. A second rate would declare a
# second pair; two consumers on the SAME base may share one, because what the
# pair carries is a property of the RATE and not of the thing being moved.
ts_acc = "u16@dp"        # the carried fraction, 8.8. It is what makes a
                         # non-integer per-frame step exact over time instead
                         # of re-quantised every frame.
                         # TICK: ok — this word EXISTS to remove a frame
                         # coupling, not to express one; it is the fraction the
                         # scaler carries and has no meaning in frames.
ts_step = "u16@dp"       # this frame's whole-unit step in screen px, published
                         # once by TS_STEP and consumed by the four axis moves.
                         # TICK: ok — the OUTPUT of the scaler; it is already
                         # expressed against the declared tick.
