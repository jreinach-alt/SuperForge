# scroller user state.
#
# NEARLY EMPTY, and that is the rail. The camera is NOT here: cam_x/cam_y are
# scroller_bg's own `scr_cam` dp claim, because the routine that READS them is
# that feature's VBlank commit (pfs_bg's division, unchanged). What the GAME
# owns is one word, and it owns nothing else.
[scene.world]
frames = "u16@dp"        # frames since enter. Drives nothing — it is the
                         # free-running heartbeat a test reads to tell "the
                         # tick is running" from "the tick is stuck", the same
                         # role breaker's `blink` plays.

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# TWO WORDS PER RATE, and this rail has exactly one rate: the camera moves
# SCR_SPEED px per frame and nothing else moves at all. A consumer on a second
# rate would declare a second pair; two consumers on the SAME base may share
# one, because what the pair carries is a property of the RATE, not of the
# thing being moved.
#
# The prototype these replace lived behind `-D SF_TICK=n` and needed four
# (docs/96 §4.2): a phase word for the lump scheme and a region word of its
# own. The lump scheme is gone (its cost is O(tick) and does not fit the
# tightest rail — docs/95 §4.3) and the region flag is now `region`'s claim,
# so the promoted form is two words instead of four.
#
# `frames` stays the scene's FIRST user word across the change — the allocator
# packs a scene's user words alphabetically and f sorts before t either way —
# but its dp offset does move, because `region`'s global flag is placed first.
# Nothing reads a dp offset by hand; every consumer takes the emitted symbol.
ts_acc = "u16@dp"        # the carried fraction, 8.8. It is what makes a
                         # non-integer per-frame step exact over time instead
                         # of quantised each frame.
                         # TICK: ok — this word EXISTS to remove a frame
                         # coupling, not to express one; it is the fraction the
                         # scaler carries, and it has no meaning in frames.
ts_step = "u16@dp"       # this frame's whole-unit step in world px, published
                         # once by TS_STEP and consumed by the four axis adds.
                         # TICK: ok — the OUTPUT of the scaler; it is already
                         # expressed against the declared tick.
