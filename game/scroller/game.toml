# scroller — the BG pipeline alone.
#
# A green checkerboard fills BG1, the d-pad scrolls it in all four directions
# at 2 px/frame, and a red sprite holds screen centre so the world appears to
# slide beneath it.
#
# ONE SCENE, no edges, mirroring split_v_fight's and split_h_2p_demo's shape.
# This rail's subject is one screen and one camera; a title screen would be
# surface the subject does not have. scene_mgr is composed anyway because it
# owns the INIDISP commit and the frame sync every SuperForge rail's main loop
# is built on; `world` is simply its only destination.
#
# TWO REFUSALS, BOTH RUN RATHER THAN REASONED. `room_bg` and `backdrop` are the
# two features a reader would reach for to supply this picture, and the
# allocator rejects each one when it is actually composed:
#
#   room_bg   -- REFUSED. Adding it to this scene makes the allocator say:
#                  "REGISTER ownership contention in scene 'world': scr_layers
#                   (engine:scroller_bg) and room_layers (engine:room_bg) both
#                   write ['BG12NBA', 'BG1HOFS', 'BG1SC', 'BG1VOFS', 'BGMODE',
#                   'TM'] — a CPU-written register has one owner per scene."
#                So it is refused before its welding to `room` even comes up —
#                and it IS welded: `depends = ["room_rom"]`, and room_bg.asm
#                resolves six of that blob's symbols by name (:61-:144). What
#                carries across rails is the PATTERN, not the feature;
#                scroller_bg is this rail's instance of it, and that
#                feature.toml carries the full argument.
#   backdrop  -- REFUSED, also run:
#                  "CGRAM overlap in scene 'world': backdrop_color
#                   (engine:backdrop) pinned at [0..1) words collides with
#                   another sub-palette"
#                The collision is on the CGRAM side. scroller_bg's BG reads
#                palette group 0, whose word 0 IS the backdrop slot, so it
#                necessarily claims it; `backdrop` pins the same one. (Both also
#                declare BGMODE + TM, which would refuse next.) The refusal is
#                correct — colour 0 and the scene's base display mode each have
#                exactly one owner per scene.
#
# NOT COMPOSED, and each for a reason the allocator would enforce anyway:
#   bg_text   -- claims BG3SC/BG34NBA. There is no text in this rail; the
#                picture is the whole of it.
#   col_map   -- nothing collides. The camera wraps rather than clamping
#                (scroller_bg/feature.toml's scr_cam note).
#   audio     -- this rail is silent by design. Adding music would be the
#                "prettify the demo" move, and a demo that prettifies stops
#                measuring what it was built to measure.
# REGION + TICK_SCALE: the two features that make this cart one cart.
#   region      reads $213F bit 4 once at boot and publishes ES_RGN_PAL.
#   tick_scale  turns a per-frame delta into a REGION-CORRECT one, carrying
#               the fraction. It `depends = ["region"]`, so the allocator
#               pulls `region` in with it — `resolve_features` expands
#               `depends`, so listing both here is documentation rather than a
#               requirement, and dropping `region` from this list builds the
#               same bytes. A silent 1.0 is ruled out by a different route:
#               with `region` uncomposed, ES_RGN_PAL is undefined and ca65
#               refuses.
# This rail is where the mechanism was prototyped (docs/96 §4) and it is where
# the promoted form is proven: tools/rate_oracle.py reads cam_x at 0.83208
# uncompensated and 0.99919 with these two composed.
globals = ["scene_mgr", "fade", "input", "oam_sprites", "scroller_rom",
           "region", "tick_scale"]

[[scene]]
id = "world"
features = ["scroller_bg", "scroller_obj"]
