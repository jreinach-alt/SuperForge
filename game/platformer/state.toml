# platformer user game state.
#
# The round lives in `@dp` scene state, because the play scene is the only one
# that has a game and scene DP is the cheaper kind -- the allocator reuses the
# space in the three menu scenes. Only the four facts that must SURVIVE a scene
# transition are global.

[global]
runs = "u16"             # games started this power-on. Survives the
                         # play -> ending -> title -> play loop, which is the
                         # only game-lifetime fact this rail keeps for itself.

# THE SAVE'S STAGING WORD, and it is deliberately NOT the live coin counter.
# `sv_load` takes a 24-bit WRAM dest pointer, so the payload needs a global
# home; giving it its own word means a rejected or oversize load cannot touch
# the round's state, and the fresh-run baseline simply stands.
bank = "u16"

# The title's two continue facts. `contok` is what cont_gate decided about slot
# 0 on THIS title entry (and therefore whether the SELECT line is on screen);
# `contpend` is the answer SELECT gave, consumed by play::enter. They are
# separate because the offer and the choice are separate events in separate
# frames, and folding them would make "the line is showing" and "the player
# took it" the same bit.
contok = "u16"
contpend = "u16"

[scene.title]
t_frames = "u16"         # frames on title -- the free-running heartbeat a test
                         # reads to tell "the tick runs" from "the tick is stuck"

[scene.play]
# --- the hero ---
px = "u16@dp"            # world x of the 8x8 physics box, in pixels
pyf = "u16@dp"           # world y of the box, 8.8 fixed point
vy = "u16@dp"            # vertical velocity, 8.8 signed
pixy = "u16@dp"          # pyf's integer part, recomputed after physics
newy = "u16@dp"          # the tentative y one physics step wants
grounded = "u16@dp"      # 1 = standing on something this frame
facing = "u16@dp"        # 0 right / 1 left -- the sprite's H-flip
hurt = "u16@dp"          # i-frames: invulnerability AND the blink phase

# --- the round ---
lives = "u16@dp"
coins = "u16@dp"
gover = "u16@dp"         # 1 = the round is over; the world freezes for a beat
paused = "u16@dp"        # 1 = frozen by START. Everything below the pause gate
                         # stops, which is also what makes the parallax FREEZE
                         # invariant testable: the camera stops advancing, the
                         # rebuilt table is identical frame to frame, and the
                         # sky pixels do not move. (Never by zeroing a ratio --
                         # see platformer_bg/feature.toml.)
dirty = "u16@dp"         # HUD reprint request

# --- the two ghosts ---
e1x = "u16@dp"           # ghost 1 patrols the ground
e1d = "u16@dp"           # 0 = walking west, 1 = east
e2x = "u16@dp"           # ghost 2 patrols the seam ledge (row 16, cols 26-38),
e2d = "u16@dp"           #   which crosses the world's page boundary at col 32
e1alive = "u16@dp"
e2alive = "u16@dp"

# --- the shared animation clock (hero and ghosts run on one) ---
atick = "u16@dp"
aframe = "u16@dp"

# --- the pause banner, written one cell per frame ---
msg = "u16@dp"           # pending block address, 0 = idle
msgpos = "u16@dp"        # the next cell of that block

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# FOUR RATES, FOUR PAIRS, and the fourth is the one worth reading. A ballistic
# arc has a VELOCITY (px per frame, region scale r) and a GRAVITY (px per
# frame SQUARED, region scale r^2), and tick_scale's TS_STEP applies exactly
# one r. So three of these are ordinary consumer pairs and gravity feeds
# TS_STEP a base that already carries one r on the PAL arm -- see
# scenes/play.asm, the only place that arithmetic is spelled.
#
# The ghost beat and the animation clock keep SEPARATE pairs even though both
# bases are numerically 1: they are different quantities (world px against
# animation units) and a shared accumulator would couple them the day either
# is tuned. tick_scale carries the fraction per RATE, not per consumer.
tsw_acc = "u16@dp"       # the hero's walk: PLF_WALK px per frame
                         # TICK: ok -- the carried FRACTION of a scaled rate.
                         # It exists to remove a frame coupling, not to hold
                         # one, and it has no meaning in frames.
tsw = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok -- the OUTPUT of the scaler; already
                         # expressed against the declared tick.
tsg_acc = "u16@dp"       # gravity: PLF_GRAVITY of 8.8 velocity per frame
                         # TICK: ok -- as tsw_acc.
tsg = "u16@dp"           # ...and this frame's answer, in whole 8.8 counts
                         # TICK: ok -- as tsw.
tsa_acc = "u16@dp"       # the animation clock: one anim unit per frame. This
                         # is the pair that answers docs/95 §5.2's class C --
                         # a small-integer divider with no correct x5/6 -- by
                         # scaling what the clock ADVANCES BY instead of the
                         # divider it is compared against.
                         # TICK: ok -- as tsw_acc.
tsa = "u16@dp"           # ...and this frame's answer, in whole anim units
                         # TICK: ok -- as tsw.
tsh_acc = "u16@dp"       # both ghosts' beat: 1 px per frame (gh_step's
                         # inc a / dec a, which is why the base is spelled in
                         # play.asm rather than in platformer.inc)
                         # TICK: ok -- as tsw_acc.
tsh = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok -- as tsw.

# --- the three velocity constants, region-selected once at enter ------------
# ASSIGNMENTS rather than accumulations -- a launch writes one, the rise cut
# and the stomp bounce the second, the terminal clamp the third -- so there is
# no fraction to carry and no accumulator to declare. A console cannot change
# region, so all three are chosen once at enter and every site reads the word.
# On NTSC each holds the constant platformer.inc authored, to the bit.
vmax = "u16@dp"          # terminal fall speed, 8.8 (PLF_MAX_FALL * r)
                         # TICK: ok -- a VELOCITY already expressed against
                         # the declared tick; the scaler's output, not a
                         # frame count.
vjump = "u16@dp"         # launch velocity, 8.8 signed (PLF_JUMP_VEL * r)
                         # TICK: ok -- as vmax.
vcut = "u16@dp"          # the rise cut AND the stomp bounce, 8.8 signed
                         # TICK: ok -- as vmax.

# --- scratch, never live across a phase boundary ---
ax = "u16@dp"            # obj_put's x / y arguments...
ay = "u16@dp"
tmp = "u16@dp"           # ...its size class, then the collision probe's cell
tmp2 = "u16@dp"          # the probe's second corner, then a draw scratch
probex = "u16@dp"        # a box probe's world coordinates
probey = "u16@dp"
