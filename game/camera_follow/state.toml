# camera_follow user game state.
#
# Five words, all `@dp` and all scene-scoped: `world` is the only scene, and
# every one of these is read or written on the frame path.
#
# THE SPLIT: the player and the derived screen position are GAME state (this
# file), while the camera is cf_bg's `cf_cam` dp claim — because the routine
# that READS the camera is that feature's VBlank commit (the scroller_bg /
# pfs_bg division, unchanged).
#
# pwx/pwy and scrx/scry are DIFFERENT SPACES, and keeping both named is the
# rail's lesson made structural: the player LIVES in world coordinates; the
# sprite is DRAWN at world - camera. The subtraction happens in the scene's
# tick (game-side); cf_obj_place consumes scrx/scry
# and never sees a world coordinate.
#
# NO [global] SECTION, deliberately: this rail has no transitions, so
# game-lifetime state would be a claim on the game-lifetime region for
# something never observed to survive anything (hud_game's reasoning).

[scene.world]
pwx = "u16@dp"           # player x, WORLD px, top-left of the 8x8 box.
                         # Clamped to [0, CF_WORLD_W - 8] by the tick.
pwy = "u16@dp"           # player y, WORLD px. Clamped to [0, CF_WORLD_H - 8].
scrx = "u16@dp"          # sprite x, SCREEN px = pwx - cam_x. In [0, 248] by
                         # construction once both clamps hold.
scry = "u16@dp"          # sprite y, SCREEN px = pwy - cam_y. In [0, 216].
# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# ONE RATE, ONE PAIR. CF_SPEED is the only velocity on the rail: the camera and
# the screen position are both PURE FUNCTIONS of the player, recomputed from
# scratch every tick, so neither carries a rate of its own and neither needs an
# accumulator. A second rate would declare a second pair.
ts_acc = "u16@dp"        # the carried fraction, 8.8 — what makes a
                         # non-integer per-frame step exact over time instead
                         # of re-quantised every frame.
                         # TICK: ok — this word EXISTS to remove a frame
                         # coupling, not to express one; it is the fraction the
                         # scaler carries and has no meaning in frames.
ts_step = "u16@dp"       # this frame's whole-unit step in world px, published
                         # once by TS_STEP and consumed by the four axis moves.
                         # TICK: ok — the OUTPUT of the scaler; already
                         # expressed against the declared tick.
# ---------------------------------------------------------------------------
# (`make tick-check` binds an override to the ONE declaration whose comment
# block holds it, so a reason written above cannot reach past this break onto
# the word below. The heartbeat below is a real frame-unit declaration with no
# override of its own, and it must keep being counted.)
cell = "u16@dp"          # the 16 px STRIDE the player last occupied, packed
                         # (row << 8) | col — the edge a footstep fires on.
                         # This rail walks freely in world pixels, so there is
                         # no step COMMIT to hang a cue on and "is moving" is
                         # true on every held-input frame. maze carries the
                         # same latch for the same reason, at the same
                         # CF_SPEED = 2 px/frame, and 16 px is the stride the
                         # EAR wanted there: 8 px put the step voice on 63% of
                         # walking frames, which is no cadence anyone walks at.
                         # TICK: ok — a POSITION, not a count of anything. The
                         # frame-assumption lint reads the word for "previous
                         # update" as a declared frame unit, but nothing here
                         # scales with the frame rate: the same stride is the
                         # same stride on both machines, and the walk that
                         # crosses it is already region-scaled by ts_step.
frames = "u16@dp"        # frames since enter. Drives nothing — the
                         # free-running heartbeat a test reads to tell "the
                         # tick is running" from "the tick is stuck" (the
                         # breaker/scroller convention).
