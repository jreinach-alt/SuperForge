# camera_follow — the camera/world-space split.
#
# A red player moved with the d-pad through a 512x448 world (four screens)
# over a repeating checkerboard. The camera centres the player and scrolls BG1
# to follow, but CLAMPS at the world edges — there the player walks toward the
# screen edge instead. The sprite is drawn at world - camera, which is the
# whole trick behind a scrolling actor, and this rail's whole subject.
#
# ONE SCENE, no edges, mirroring scroller / hud_game / split_v_fight. This rail
# has no scene machine at all — one RESET, one game loop — so a title screen
# would be surface its subject does not have. scene_mgr is composed anyway
# because it owns the INIDISP commit and the frame sync; `world` is simply its
# only destination.
#
# WHY NOT room_bg. The allocator ACCEPTS it (it drags room_rom in via `depends`
# and places the whole room art pack, 22 placements, allocation OK) — and it
# still cannot express this rail, because the disqualification lives in the
# feature's own code where no allocator can see it: room_bg.asm PINS
# BG1HOFS/BG1VOFS at zero for the room's life ("the room is one screen and does
# not scroll"), and the follow camera is this rail's entire subject. The
# allocator proves collision-freedom, not sufficiency. What carries over is the
# keystone BG PATTERN; cf_bg is its instance and carries the full argument.
#
# NOT COMPOSED, and each for a reason the allocator would enforce anyway:
#   backdrop  -- cf_bg's BG reads palette group 0, whose word 0 IS the
#                backdrop slot, so the BG feature necessarily owns it (the same
#                refusal scroller's game.toml records).
#   bg_text   -- no text in this rail; the picture is the whole of it.
#   col_map   -- the player's world clamp is two compares against assemble-
#                time constants, not a tile probe.
#   audio     -- this rail is silent: nothing queues music or SFX.
globals = ["scene_mgr", "fade", "input", "oam_sprites", "cf_rom"]

[[scene]]
id = "world"
features = ["cf_bg", "cf_obj"]
