# patrol — the composition reference: every surface at once.
#
# Two
# magenta enemies pace their beats — one on the ground between two low walls,
# one on a floating platform turning at its ledges — while a red player runs
# and jumps through. Touching an enemy knocks the player back to the spawn and
# ticks a "HITS" counter; getting past them is the game. The rail composes
# every surface at once: sprites, BG terrain, text HUD, tile collision, jump
# physics, and patrol.
#
# ONE SCENE, no edges — this rail has no scene machine (one RESET, one game
# loop); scene_mgr is composed for the INIDISP commit and the frame sync.
# NO AUDIO — nothing here queues music or SFX; hud_game's shape.
#
# WHY NOT room_bg. The allocator ACCEPTS it ("allocation OK: 1 scene(s), 31
# placements", room_rom dragged in via depends) and it still cannot express the
# rail, on maze's exact grounds: room_bg renders room_rom's OWN baked art (six
# of that blob's symbols by name), so the picture would be the `room` game's
# room, not patrol's level; and col_map composed against it has nothing to bind
# — its six `.error`-guarded CM_* symbols need a packed byte tile-id map + a
# 256-entry flag table, and room_rom carries VRAM-format word tilemaps. The
# build would stop at ASSEMBLY time. What carries over is the keystone BG
# *pattern*, which `patrol_bg` re-instantiates; `bg_text`, `col_map`,
# `oam_sprites` and `input` compose as written.
# REGION + TICK_SCALE: what makes this cart one cart on both machines.
#   region      reads $213F bit 4 once at boot and publishes ES_RGN_PAL.
#   tick_scale  turns a per-frame delta into a REGION-CORRECT one, carrying
#               the fraction between frames. It `depends = ["region"]`, so the
#               allocator pulls `region` in with it.
# THREE RATES SCALED: the player's run (PAT_SPEED), the patrol beat both
# enemies walk (PAT_PATROL_SPEED), and the gravity the jump falls under
# (PAT_GRAVITY). Separate pairs, because they are different rates and
# tick_scale carries the fraction per rate.
# THE BALLISTIC ARC IS SCALED TOO, AND IT TAKES TWO FACTORS. Preserving a jump
# in REAL time needs the take-off velocity times r AND gravity times r
# SQUARED — the arc's height is v^2/2g, so a single factor changes the shape
# rather than the speed. tick_scale supplies exactly ONE gain (docs/97 §3.1:
# the step plus 0.2018039 of it), and this rail's earlier note concluded from
# that a second gain would be surgery on machinery other rails compose. It is
# not: TS_STEP applies one r, so the OTHER one rides the BASE — TS_STEP's own
# PAL arm written as a build-time expression over that feature's
# TS_GAIN_NUM / TS_GAIN_DEN, chosen before the macro rather than after it.
# The ratio stays single-sourced in `tick_scale` and that feature is
# untouched; scenes/play.asm is the only place the arithmetic is spelled.
#   x r      PAT_SPEED, PAT_PATROL_SPEED, PAT_JUMP_VEL, PAT_MAX_FALL
#   x r^2    PAT_GRAVITY
# WHAT THAT BUYS, stated as the thing a player sees: a jump used to last 34
# frames in BOTH regions — 566 ms of real time on NTSC against 680 on PAL,
# which is the frame ratio showing through an unscaled arc. Now it lasts the
# same REAL time in both and only the frame count differs, with the apex
# preserved: (v0*r)^2 / (2*g*r^2) is v0^2/2g.
# NOT SCALED, and each is a class rather than an oversight: the HITS counter
# and the knockback (events), US_DIRTY (a request), and US_FRAMES (the
# free-running heartbeat).
globals = ["scene_mgr", "input", "fade", "text_dp", "font_rom", "enter_scr",
           "oam_sprites", "patrol_rom", "region", "tick_scale"]

[[scene]]
id = "play"
features = ["bg_text", "patrol_bg", "patrol_obj", "col_map"]
# col_map is composed here rather than globally because its code belongs to
# the one scene that has a world (m7_dungeon's reasoning). Its SIX binding
# symbols are defined at the include site in scenes/play.asm — the level blob
# pat_map is the world, pat_flags the tile-id -> flag table, both patrol_rom's
# claims. BGMODE/TM belong to patrol_bg (the feature that defines the scene's
# display shape); bg_text deliberately does not claim them (its own toml).
