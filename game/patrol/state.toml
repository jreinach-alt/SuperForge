# patrol user game state.
#
# All `@dp`, all scene-scoped: `play` is the only scene and every word is on
# the frame path — player pos/physics exactly as jumper, two enemies, shared
# patrol scratch, a hits counter.
#
# NO [global] SECTION: game-lifetime state is what survives a scene
# transition, and this rail has none (game.toml).

[scene.play]
# --- player ------------------------------------------------------------------
px = "u16@dp"            # player x, pixels, top-left of the 8x8 box
pyf = "u16@dp"           # player y, 8.8 fixed (high byte = the draw pixel)
vy = "u16@dp"            # signed 8.8 vertical velocity (negative = up)
newy = "u16@dp"          # physics scratch: tentative pixel y for the probe
grounded = "u16@dp"      # 1 = standing (the physics step owns it)
pyi = "u16@dp"           # the integer draw pixel of pyf (derived per frame)
newx = "u16@dp"          # tentative x for the per-axis move-check

# --- enemies (E1 ground beat, E2 platform beat) + shared patrol scratch -----
e1x = "u16@dp"           # ground enemy x (its y is the constant beat row 200)
e1dir = "u16@dp"         # 0 = walking left, 1 = walking right
e2x = "u16@dp"           # platform enemy x (its y is the constant 152)
e2dir = "u16@dp"
pnewx = "u16@dp"         # patrol scratch: the tentative x — shared between
pleadx = "u16@dp"        #   both enemies, consumed within each step
pfooty = "u16@dp"

# --- the solid-box probe's input pair (m7_dungeon's US_PROBEX/Y shape) ------
# pat_solid_box reads the box top-left from here; every caller writes both
# first (write-before-read by construction — the cm_hot argument).
probex = "u16@dp"
probey = "u16@dp"

# --- the HUD ----------------------------------------------------------------
hits = "u16@dp"          # PACKED BCD, +$0001 per contact — so bg_text's
                         # text_queue_hex4 nibble walk prints four DECIMAL
                         # digits (hud_game makes the same call)
dirty = "u16@dp"         # HUD reprint request: bit 0 = the hits cells. Set
                         # only on the frame the value changed; an idle frame
                         # stages nothing and VRAM is not rewritten.
frames = "u16@dp"        # frames since enter. Drives nothing — the
                         # free-running heartbeat (breaker's blink convention)

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# THREE RATES, THREE PAIRS — the player's run, the enemies' patrol beat and
# the gravity the jump falls under. The first two are different bases
# (2 px/frame against 1), so they cannot share a carried fraction even in
# principle; the third is a per-frame-SQUARED quantity and feeds TS_STEP a
# base that already carries one r on the PAL arm (scenes/play.asm is the only
# place that arithmetic is spelled).
tsr_acc = "u16@dp"       # the player's run: PAT_SPEED px per frame
                         # TICK: ok — the carried FRACTION of a scaled rate.
                         # It exists to remove a frame coupling, not to hold
                         # one, and it has no meaning in frames.
tsr = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok — the OUTPUT of the scaler; already
                         # expressed against the declared tick.
tse_acc = "u16@dp"       # the patrol beat: PAT_PATROL_SPEED px per frame,
                         # shared by both enemies because they share the base
                         # TICK: ok — as tsr_acc.
tse = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok — as tsr.
tsg_acc = "u16@dp"       # gravity: PAT_GRAVITY of 8.8 velocity per frame
                         # TICK: ok — as tsr_acc.
tsg = "u16@dp"           # ...and this frame's answer, in whole 8.8 counts
                         # TICK: ok — as tsr.

# --- the two velocity constants, region-selected once at enter --------------
# These are ASSIGNMENTS rather than accumulations — a take-off writes one and
# the terminal clamp writes the other — so there is no fraction to carry and
# no accumulator to declare. What they need is the region's answer, and a
# console cannot change region, so the pair is chosen once at enter and every
# site reads the word.
vmax = "u16@dp"          # terminal fall speed, 8.8 (PAT_MAX_FALL * r)
                         # TICK: ok — a VELOCITY already expressed against the
                         # declared tick; it is the scaler's output, not a
                         # frame count.
vjump = "u16@dp"         # take-off velocity, 8.8 two's complement
                         # TICK: ok — as vmax.
