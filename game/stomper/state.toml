# stomper user game state.
#
# All `@dp`, all scene-scoped: `play` is the only scene and every word is on
# the frame path. Three groups — the player block (`jumper`'s shape), two enemy
# triples, and shared patrol scratch. Placement is the ALLOCATOR's and nothing
# here depends on adjacency: the per-enemy code is a macro expanded once per
# enemy, so no field needs to sit next to any other.
#
# NO [global] SECTION: game-lifetime state is what survives a scene
# transition, and this rail has none.

[scene.play]
# --- player -------------------------------------------------------------------
px = "u16@dp"            # player world x, pixels (world = screen: no camera)
pyf = "u16@dp"           # player y, 8.8 fixed (high byte = the drawn pixel)
vy = "u16@dp"            # signed 8.8 vertical velocity (negative = up)
newy = "u16@dp"          # physics scratch: tentative pixel y for the probes
grounded = "u16@dp"      # 1 = standing on solid ground (stable at rest)
pyi = "u16@dp"           # player y as the integer draw pixel (pyf high byte)
newx = "u16@dp"          # tentative x before the solid-box move check
tent = "u16@dp"          # the tentative 8.8 y position. A DP word rather than
                         # a PHA/PLA stack slot across the width-toggling arms:
                         # same value, no push/pop byte balance to audit, which
                         # is the WIDTH-RISK a stack-carried tentative invites
# --- enemies ------------------------------------------------------------------
# Live position is state; the beat is emergent from the level geometry (the
# probes turn the walk at walls and ledges). Each enemy's y is an assemble-time
# constant at the call site rather than a stored word.
e1x = "u16@dp"           # enemy 1 x (ground beat, drawn at ST_E1_Y = 200)
e1dir = "u16@dp"         # enemy 1 heading: 0 = left, 1 = right
e1alive = "u16@dp"       # 1 = alive, 0 = stomped (culls patrol + draw + hit)
e2x = "u16@dp"           # enemy 2 x (platform beat, drawn at ST_E2_Y = 152)
e2dir = "u16@dp"
e2alive = "u16@dp"
# --- patrol scratch (shared between enemies, consumed within the call) -------
pnewx = "u16@dp"         # tentative enemy x
pleadx = "u16@dp"        # leading bottom-corner x for the ledge probe
pfooty = "u16@dp"        # ey + 8: the tile row under the enemy's feet
# --- solid-box probe arguments (write-before-read per call) ------------------
# `st_solid_box` is a subroutine rather than a macro over verbatim operands, so
# its two arguments are argument SLOTS. Every caller writes both before the
# jsr — the same contract as cm_hot's CM_PX/CM_PY, one level up.
boxx = "u16@dp"          # box top-left x, pixels
boxy = "u16@dp"          # box top-left y, pixels
# --- the round ---------------------------------------------------------------
foes = "u16@dp"          # enemies still alive; the HUD counter (2 -> 1 -> 0)
hurts = "u16@dp"         # times knocked back. Not mirrored anywhere for a test
                         # to read: the observable IS the knockback (OAM +
                         # picture), and a debug-region copy would be a second
                         # surface that can agree with the counter while
                         # disagreeing with the screen
clearp = "u16@dp"        # CLEAR pending-print countdown (5..1, then 0 done).
                         # bg_text's VBlank queue holds ONE run of up to 4
                         # cells per frame and "CLEAR" is five, so the win
                         # print is spread one cell per frame over the five
                         # frames after the closing stomp
blink = "u16@dp"         # frames since enter. Drives nothing — the
                         # free-running heartbeat a test reads to tell "the
                         # tick is running" from "the tick is stuck" (the
                         # breaker/shmup/hud_game convention)

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
#
# THREE RATES, THREE PAIRS, and the third is the one worth reading. A
# ballistic arc has a VELOCITY (px per frame, region scale r) and a GRAVITY
# (px per frame SQUARED, region scale r^2), and tick_scale's TS_STEP applies
# exactly one r. So the two walk rates are ordinary consumer pairs, while
# gravity feeds TS_STEP a base that already carries one r on the PAL arm --
# see scenes/play.asm, which is the only place that arithmetic is spelled.
#
# The two ENEMIES share one pair, and that is correct rather than thrifty:
# tick_scale carries the fraction PER RATE, and both patrol at
# ST_PATROL_SPEED. Two consumers on the SAME base may share one pair; the
# player is kept separate because ST_SPEED is a different base and a shared
# accumulator would silently couple the two the day either is tuned.
tsp_acc = "u16@dp"       # the player's walk: ST_SPEED px per frame
                         # TICK: ok -- the carried FRACTION of a scaled rate.
                         # It exists to remove a frame coupling, not to hold
                         # one, and it has no meaning in frames.
tsp = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok -- the OUTPUT of the scaler; already
                         # expressed against the declared tick.
tse_acc = "u16@dp"       # BOTH enemies' patrol: ST_PATROL_SPEED px per frame
                         # TICK: ok -- as tsp_acc.
tse = "u16@dp"           # ...and this frame's answer, in whole px
                         # TICK: ok -- as tsp.
tsg_acc = "u16@dp"       # gravity: ST_GRAVITY of 8.8 velocity per frame
                         # TICK: ok -- as tsp_acc.
tsg = "u16@dp"           # ...and this frame's answer, in whole 8.8 counts
                         # TICK: ok -- as tsp.

# --- the three velocity constants, region-selected once at enter ------------
# ASSIGNMENTS rather than accumulations -- a take-off writes one, a terminal
# clamp the second, a stomp the third -- so there is no fraction to carry and
# no accumulator to declare. What they need is the region's answer, and a
# console cannot change region, so all three are chosen once at enter and
# every site reads the word. On NTSC each holds the constant stomper.inc
# authored, to the bit.
vmax = "u16@dp"          # terminal fall speed, 8.8 (ST_MAX_FALL * r)
                         # TICK: ok -- a VELOCITY already expressed against
                         # the declared tick; the scaler's output, not a
                         # frame count.
vjump = "u16@dp"         # take-off velocity, 8.8 two's complement
                         # TICK: ok -- as vmax.
vbounce = "u16@dp"       # the stomp bounce, 8.8 two's complement
                         # TICK: ok -- as vmax.
