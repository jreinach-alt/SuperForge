# four_pads user game state — four players' worth, all `@dp`, all scene-scoped.
#
# Every per-player word is an ARRAY of four, indexed by player*2 — one claim
# per quantity rather than four, so a fifth player is a count, not a rename.
#
# NO [global] SECTION: one scene, no transitions, nothing survives anything.

[scene.play]
px = "u16[4]@dp"         # token x per player, screen px (clamped FP_X_MIN..MAX)
py = "u16[4]@dp"         # token y per player (clamped FP_Y_MIN..MAX)
flip = "u16[4]@dp"       # $0000 or OAM attr bit 6 (h-flip), toggled per A press
held = "u16@dp"          # the held buttons of the player being moved (pad_btn)

# --- the TIMEBASE's per-consumer state (engine/features/tick_scale) ---------
# ONE RATE, ONE PAIR: all four tokens move at FP_SPEED.
ts_acc = "u16@dp"        # the carried fraction, 8.8.
                         # TICK: ok — this word EXISTS to remove a frame
                         # coupling, not to express one; it is the fraction the
                         # scaler carries and has no meaning in frames.
ts_step = "u16@dp"       # this frame's whole-unit step in screen px, published
                         # once by TS_STEP and consumed by every axis move.
                         # TICK: ok — the OUTPUT of the scaler; it is already
                         # expressed against the declared tick.
