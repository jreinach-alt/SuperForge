# superforge — 64 KB LoROM linker config: window 0 = CODE+RODATA (allocator
# rom.code_windows), window 1 = AUDIO_DATA0 + BANK1 (allocator-claimed assets;
# each claim site .asserts its blob's bank/addr against the emitted
# _BANK/_ADDR symbols).
#
# AUDIO_DATA0 is here so a rail that composes `audio` and fits its whole
# allocation in ONE window can ship a 64 KB cart instead of a 512 KB one. It
# mirrors lorom_512k.cfg exactly, alignment included — see the note at BANK1.
#
# TADZP/TADBSS mirror the audio feature's PINNED claims (feature.toml at=),
# exactly as lorom_512k.cfg does: the vendored tad-audio.s lays its variables
# out via .zeropage/.bss, so the LINKER places them — these windows say where,
# the allocator's pins arbitrate the same ranges against every other claim, and
# tad_wrapper.asm's lderror asserts refuse the build if the two disagree. They
# overlap the ZP/RAM areas by design: memory areas are address counters, and
# the pinned claims keep every allocator placement out of these ranges. Without
# them a rail linked here fails with "TAD .bss drifted from the allocator's
# tad_bss pin ($1F00)" — which is how they came to be here.
MEMORY {
    ZP:     start = $00,      size = $0100, type = rw, define = yes;
    RAM:    start = $0100,    size = $1F00, type = rw, define = yes;
    TADZP:  start = $F0,      size = $0002, type = rw, define = yes;
    TADBSS: start = $1F00,    size = $0010, type = rw, define = yes;
    ROM0:   start = $008000,  size = $7FC0, type = ro, file = %O, fill = yes, fillval = $00;
    ROMH:   start = $00FFC0,  size = $0020, type = ro, file = %O, fill = yes;
    ROMV:   start = $00FFE0,  size = $0020, type = ro, file = %O, fill = yes;
    ROM1:   start = $018000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE:   load = TADZP, type = zp,  optional = yes;
    BSS:        load = TADBSS, type = bss, optional = yes;
    CODE:       load = ROM0,  type = ro,  define = yes;
    RODATA:     load = ROM0,  type = ro;
    HEADER:     load = ROMH,  type = ro;
    VECTORS:    load = ROMV,  type = ro;
    # AUDIO_DATA0 must sit at ROM1's start — the generated export asserts
    # .loword(*) = $8000, and window 1 begins at a LoROM bank start. Listed
    # before BANK1 so nothing in the same area can precede it. Deliberately NO
    # AUDIO_DATA1: this config has no window 2, so a spill fails the link
    # loudly rather than landing somewhere LoadAudioData's bank arithmetic
    # cannot follow.
    AUDIO_DATA0: load = ROM1, type = ro,  optional = yes;
    # `align` is what keeps ld65's packing and the ALLOCATOR's arithmetic
    # agreeing, exactly as in lorom_512k.cfg: tad_export claims the window's
    # first HALF (16,384 B) but the export's real content is 8,752 B, so an
    # unaligned BANK1 would start ~$01A230 while the allocator emitted
    # $01C000 for the blobs it packed behind it. Aligning to $4000 puts BANK1
    # at $01C000 when the export is present and leaves it at $018000 when it
    # is not, so a rail without audio pays nothing for this line.
    BANK1:      load = ROM1,  type = ro,  optional = yes, align = $4000;
}

# The image size, DECLARED where it is DECIDED (docs/94 R0).
#
# $FFD7 is "2^N KB". Nothing the assembler can see knows how big the linked
# image will be -- that is settled here, by the MEMORY areas above -- so
# vendor/rom/header.inc imports this symbol instead of carrying a default it
# cannot check. It shipped one for a long time ($05, 32 KB) and TWENTY of the
# thirty-seven rails inherited it while linking 524,288 B: docs/94 §1's
# declaration-lies defect, in the one file every rail includes.
#
# The value is not taken on trust either. tools/fix_checksum.py runs over
# every linked image and REFUSES to patch one whose declared size is not its
# real length, so a config that grows a bank and forgets this line fails the
# build rather than shipping a lie.
SYMBOLS {
    SF_LD_ROM_SIZE: type = export, value = $06;   # 2^6 KB = 64 KB
}
