# superforge — 512 KB LoROM: window 0 = CODE+RODATA; windows 1..15 = BANK1..15
# (allocator-claimed; claim sites .assert bank/addr against emitted symbols).
#
# TADZP/TADBSS mirror the audio feature's PINNED claims (feature.toml at=):
# the vendored tad-audio.s lays its variables out via .zeropage/.bss, so the
# linker places them — these windows say where, the allocator's pins arbitrate
# the same ranges against every other claim, and tad_wrapper.asm's lderror
# asserts refuse the build if the two ever disagree. The windows overlap the
# ZP/RAM areas by design: memory areas are address counters, and the pinned
# claims keep every allocator placement out of these ranges.
MEMORY {
    ZP:     start = $00,      size = $0100, type = rw, define = yes;
    RAM:    start = $0100,    size = $1F00, type = rw, define = yes;
    TADZP:  start = $F0,      size = $0002, type = rw, define = yes;
    TADBSS: start = $1F00,    size = $0010, type = rw, define = yes;
    ROM0:   start = $008000,  size = $7FC0, type = ro, file = %O, fill = yes, fillval = $00;
    ROMH:   start = $00FFC0,  size = $0020, type = ro, file = %O, fill = yes;
    ROMV:   start = $00FFE0,  size = $0020, type = ro, file = %O, fill = yes;
    ROM1:   start = $018000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM2:   start = $028000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM3:   start = $038000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM4:   start = $048000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM5:   start = $058000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM6:   start = $068000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM7:   start = $078000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM8:   start = $088000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM9:   start = $098000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM10:  start = $0A8000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM11:  start = $0B8000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM12:  start = $0C8000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM13:  start = $0D8000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM14:  start = $0E8000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
    ROM15:  start = $0F8000,  size = $8000, type = ro, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    # ZEROPAGE/BSS load into the TAD windows: tad-audio.s is the only
    # .zeropage/.bss author in the tree (verified 2026-07-30), so the
    # segments ARE its variables; games without the audio feature leave
    # them empty and the windows place nothing.
    ZEROPAGE:   load = TADZP,  type = zp,  optional = yes;
    BSS:        load = TADBSS, type = bss, optional = yes;
    CODE:       load = ROM0,  type = ro,  define = yes;
    RODATA:     load = ROM0,  type = ro;
    HEADER:     load = ROMH,  type = ro;
    VECTORS:    load = ROMV,  type = ro;
    # AUDIO_DATA0 must sit at ROM1's start — the generated export asserts
    # .loword = $8000, and the allocator's whole-window tad_export claim
    # reserves exactly this bank. Listed before BANK1 so any same-area
    # content could never precede it. Deliberately NO AUDIO_DATA1: window 2
    # holds ordinary blob claims, and LoadAudioData's bank arithmetic needs
    # any spill bank ADJACENT — if the export ever emits AUDIO_DATA1 the
    # link fails loudly and the tad_export claim grows to 65536 first.
    AUDIO_DATA0: load = ROM1, type = ro,  optional = yes;
    BANK1:      load = ROM1,  type = ro,  optional = yes;
    BANK2:      load = ROM2,  type = ro,  optional = yes;
    BANK3:      load = ROM3,  type = ro,  optional = yes;
    BANK4:      load = ROM4,  type = ro,  optional = yes;
    BANK5:      load = ROM5,  type = ro,  optional = yes;
    BANK6:      load = ROM6,  type = ro,  optional = yes;
    BANK7:      load = ROM7,  type = ro,  optional = yes;
    BANK8:      load = ROM8,  type = ro,  optional = yes;
    BANK9:      load = ROM9,  type = ro,  optional = yes;
    BANK10:     load = ROM10, type = ro,  optional = yes;
    BANK11:     load = ROM11, type = ro,  optional = yes;
    BANK12:     load = ROM12, type = ro,  optional = yes;
    BANK13:     load = ROM13, type = ro,  optional = yes;
    BANK14:     load = ROM14, type = ro,  optional = yes;
    BANK15:     load = ROM15, type = ro,  optional = yes;
}
