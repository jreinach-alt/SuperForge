name: CI

# The hosted gate block. The sequence mirrors what `make gates` runs locally,
# so a green run here means the same thing as a clean local bring-up — with two
# properties a local run structurally cannot have: a machine that is not yours,
# and a tree with no build/ in it.
#
# MANUAL TRIGGER ONLY. There is deliberately no `push:` trigger — hosted CI
# minutes are a budget, and most of what a push trigger buys is bought more
# cheaply by `make bare-check`, which clones HEAD into a scratch directory and
# runs this same gate block against committed content only (docs/44). Fire this
# workflow by hand when you want the three things bare-check states it does NOT
# reproduce: a genuinely different machine, a genuinely absent toolchain, and a
# different OS image.
#
# Restore automatic coverage by putting back:
#     push:
#       branches: ['**']
# NOTE: workflow_dispatch is only offered for workflows present on the DEFAULT
# branch, so fire it from main's copy.
on:
  workflow_dispatch:

# A new push to the same branch supersedes the in-flight run; the Mesen build
# is expensive enough that queuing duplicates is wasteful.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # fetch-depth: 0 — actions/checkout defaults to a depth-1 shallow clone.
      # tests/test_register.py replays historical commits; under a shallow
      # clone `git show` returns empty and those parameters ERROR rather than
      # fail, which is how they once went unnoticed. The test now reads
      # vendored fixtures under tests/fixtures/register_drift/ and is hermetic,
      # but full history is still fetched so the fixture-vs-history CONSISTENCY
      # check actually runs here instead of skipping — that check is what stops
      # a fixture drifting from what it claims to record.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # MesenCore.so takes ~10 minutes to build from source. tools/setup.sh
      # deploys this repo-local cache to /tmp when present and only falls back
      # to a source build on a miss, so a warm cache turns the emulator step
      # into a file copy.
      - name: Cache MesenCore.so
        uses: actions/cache@v4
        with:
          path: tools/Mesen
          # Keyed on what actually determines the binary — the script that
          # builds it — not on this workflow file. Hashing ci.yml meant every
          # unrelated CI tweak (a comment, a trigger change) invalidated the
          # cache and paid the ~10-minute Mesen source build again.
          key: mesen-core-${{ runner.os }}-${{ hashFiles('tools/setup.sh') }}
          restore-keys: |
            mesen-core-${{ runner.os }}-

      - name: Toolchain setup
        run: bash tools/setup.sh

      # ---- the build gates ------------------------------------------------

      - name: make toy
        run: |
          make toy
          size=$(stat -c%s build/toy.sfc)
          echo "build/toy.sfc = $size bytes"
          test "$size" -eq 32768 || { echo "::error::expected 32768 bytes, got $size"; exit 1; }

      - name: make microzero
        run: |
          make microzero
          size=$(stat -c%s build/microzero.sfc)
          echo "build/microzero.sfc = $size bytes"
          test "$size" -eq 524288 || { echo "::error::expected 524288 bytes, got $size"; exit 1; }

      # Built here for the same reason microzero is: a green suite proves the
      # SOURCE builds something correct, and only a from-scratch build on a
      # bare runner proves the repo does — the isolation property this whole
      # workflow exists to hold.
      - name: make room
        run: |
          make room
          size=$(stat -c%s build/room.sfc)
          echo "build/room.sfc = $size bytes"
          test "$size" -eq 524288 || { echo "::error::expected 524288 bytes, got $size"; exit 1; }

      # The game rails, and these steps are NOT optional decoration. Many test
      # modules read their allocator map AT MODULE SCOPE. On a bare runner
      # those maps do not exist, conftest's freshness guard raises inside
      # pytest_collectstart, and under xdist an exception from that hook
      # CRASHES THE WORKER rather than reporting a collection error — which
      # surfaces as `INTERNALERROR> assert not crashitem` naming whichever
      # test the worker happened to hold, and "no tests ran in 0.5s". The
      # diagnostic names an innocent module, so the cause is nowhere near the
      # symptom; it has bitten on a rail merge more than once.
      #
      # Adding a rail to the local `make gates` block is not enough: this
      # workflow does not run `make gates`, it runs these steps. A new rail
      # needs BOTH, and `make rail-registered` checks that it got both.
      - name: make breaker
        run: |
          make breaker
          size=$(stat -c%s build/breaker.sfc)
          echo "build/breaker.sfc = $size bytes"
          test "$size" -eq 524288 || { echo "::error::expected 524288 bytes, got $size"; exit 1; }

      - name: make hud_game
