      - name: make rpg
        run: |
          make rpg
          size=$(stat -c%s build/rpg.sfc)
          echo "build/rpg.sfc = $size bytes"
          test "$size" -eq 524288 || { echo "::error::expected 524288 bytes, got $size"; exit 1; }

      # The collision gate's teeth: an infeasible declaration MUST stop the
      # allocator, with the collision diagnostic and not some other refusal.
      #
      # This step used to invert the target (`if make toy-bad; then error; fi`)
      # because the target failed on every path. That made the step blind —
      # with the collision deleted from engine/toy_bad, `make toy-bad` still
      # exited non-zero and this step still printed "refused as designed"
      # with no teeth at all. The target now reports its verdict in its exit
      # status:
      # 0 = the allocator refused, correctly. So run it plainly.
      - name: make toy-bad (the allocator must refuse the collision toy)
        run: make toy-bad

      # The BACKING gate's teeth: a rom claim the allocator packs but no
      # `.incbin` fills MUST stop the build (docs/37). Same non-inverted
      # polarity as toy-bad above and for the same reason — exit 0 means the
      # gate refused the unbacked arm AND accepted the backed one.
      #
      # It landed covered only through `make test`, which is the wrong surface
      # for a seconds-scale gate: `make test` is ~8 minutes and is skipped once
      # an earlier gate fails, so the one check for this bug class would
      # otherwise ride on the slowest step in the run.
      - name: make rom-unbacked (the rom-claim backing gate must refuse)
        run: make rom-unbacked

      # ---- the lint gate --------------------------------------------------

      # Strict, zero baseline — see the Makefile target and CLAUDE.md rule 6.
      - name: make width-check
        run: make width-check

      - name: make time-check (the time-coupling gate)
        run: make time-check

      # docs/09's supply census is generated from the tree; this fails with a
      # diff when the committed doc has drifted, and also when a TABLE ROW in
      # docs/09 resolves to an existing feature dir (through its
      # subject cell or its `supplied by` column) while claiming it is not
      # built. That second half is the one that matters: the hand-written
      # census has drifted repeatedly when hand-written, and most of those
      # drifts lived in prose the generator is not allowed to emit. Read-only
      # — never rewrites.
      #
      # Bounded on purpose, and the bound is measured rather than assumed: the
      # step prints "demand lint reached N/M demand rows". Rows naming no dir
      # in either place, and claims made in paragraphs rather than tables, are
      # NOT covered.
      - name: make register
        run: make register

      # A rail under game/ has to be registered in a dozen places, and
      # `make rail-registered` checks all of them (Makefile .PHONY, the
      # `gates:` rail list, the `gates:` md5 list — a separate list — this
      # workflow's own step list, conftest.MAPS and conftest._SUBDIR_MAP among
      # them). Most have been missed at least once, and one of them fails
      # SILENTLY: a map in MAPS but not in _SUBDIR_MAP makes the freshness
      # guard check the TOY map instead, so a rail's tests can be green
      # against another game's freshness.
      #
      # This step is site 4's own enforcement, and it is also where the gate
      # checks that IT is registered — `make gates` and this file are two
      # different lists, which is the asymmetry that put site 4 on the list.
      - name: make rail-registered
        run: make rail-registered

      # ---- the measurement gate -------------------------------------------

      # The substrate-pin drift check. The pins are substrate FACTS the rest
      # of the build is budgeted against, so drift there invalidates
      # downstream decisions silently. Note that `make test` alone does NOT
      # cover it: the measurement tests write build/measurements_*.json but
      # never read substrate.toml, and pin_budgets.py — the only pinned-vs-
      # fresh comparison there is — runs from this target only.
      #
      # Placed in the same order the local gate block uses: after register,
      # before test. Check-only on a pinned substrate: fresh measurements vs
      # the pins
      # (vblank + arm exact, cpu within 5%). It cannot quietly re-pin — the
      # pin path requires MEASURE placeholders, which a pinned tree does not
      # have. ~50 s measured locally (probe builds + 3 measurement suites +
      # the check).
      - name: make measure
        run: make measure

      # ---- the test suite -------------------------------------------------

      # Includes test_measure_cpu.py, which builds probe_cpu from
      # vendor/probe_ref. A hosted runner has nothing on disk but this
      # checkout, so that build passing here is the proof the vendored
      # reference sources are complete — this step is also the isolation gate.
      #
      # `make test` rather than bare pytest, for two reasons. It writes
      # build/pytest.log, which the upload-on-failure step below needs. And it
      # propagates the exit code in BOTH directions through the tee — a masked
      # exit code let a red suite land once, which is why the target exists at
      # all.
      #
      # XDIST is the worker count (Makefile `test:` target). MEASURED on this
      # runner rather than carried over from a dev box, and that mattered more
      # than expected: a four-core dev box was fastest at -n 4, and this runner
      # prints **nproc = 2**. None of those numbers transfer, and the widest
      # one is not merely slower here, it is unsafe. Measured here, `make test`
      # step, 657 tests:
      #
      #   single-threaded  6:26 (386 s)  green
      #   -n 3             4:05 (245 s)  green
      #   -n 3             >18:00        STALLED, abandoned
      #   -n 2             4:29 (269 s)  green   <- SHIPPED
      #   -n 2             4:41 (281 s)  green
      #
      # -n 3 IS DISQUALIFIED. Same config, same runner image, adjacent commits:
      # one run finished in 4:05 and the next was still inside pytest eighteen
      # minutes later having emitted nothing. The suite is emulator-bound --
      # every worker drives a Mesen core -- so three workers on two vCPUs
      # oversubscribe 1.5x, emulated-frames-per-wall-second collapses, and the
      # frame-bounded waits stretch without limit. Faster on a good day is not
      # a property worth having when the bad day is a 45-minute job timeout.
      #
      # -n 2 is one worker per core: the parallelism this runner actually has,
      # with nothing oversubscribed.
      #
      # `nproc` stays printed so whoever changes this number next can see what
      # it was chosen against -- a runner resize is invisible otherwise, and
      # this entire finding turns on that one line.
      #
      # Parallel is safe HERE specifically because the steps above leave the
      # tree pre-built (toy, microzero, room, and the probes via `make
      # measure`): several fixtures shell out to `make`, and on a cold tree two
      # workers race the same object file. `make probe-colmap` is the one
      # target no earlier step builds, and it has exactly one consumer module,
      # so it is built once by one worker.
      - name: make test
        run: |
          echo "runner nproc = $(nproc)"
          make test XDIST=2

      # The fastest single check that the vendored reference sources under
      # vendor/probe_ref/ still assemble to the bytes they always have.
      - name: probe_cpu md5 (vendored-reference integrity)
        run: |
          make build/probe_cpu.sfc
          actual=$(md5sum build/probe_cpu.sfc | cut -d' ' -f1)
          expected=11e935608b4df193597b9db51d75294e
          echo "probe_cpu.sfc md5 = $actual"
          test "$actual" = "$expected" || {
            echo "::error::probe_cpu md5 drift — expected $expected, got $actual"
            exit 1
          }

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: build/pytest.log
          # `warn`, not `ignore`: `ignore` is how this step once stayed broken
          # and quiet while never uploading anything. Not `error`
          # either — this step also runs when an EARLIER gate fails (make toy,
          # width-check), where no pytest log legitimately exists, and turning
          # that into a second error would bury the real one.
          if-no-files-found: warn
