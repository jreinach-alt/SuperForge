# gear.toml — item bases, enchantments, rarity and drop tuning for SuperForge
# Dungeons. SOURCE DATA: read by tools/dungeons/loot.py (the oracle) and, once
# the rail exists, packed into ROM tables by the asset generator.
# Spec: docs/dungeons/04_gear_and_loot.md. All names here are original.
#
# Numbers are FIRST-PASS TUNING, not measurements. They are in this file so
# that tuning is a data edit, never an ASM edit.

[rarity]
# Out of 256, one draw. A unique is only possible from depth >= unique_min_floor.
weights = { common = 176, rare = 64, unique = 16 }
unique_min_floor = 2
pity_rare_after = 6          # 6 commons in a row for one player -> next is rare

[power]
# item power = floor_threat + offset, offset drawn from this table (one draw).
offset_weights = [16, 48, 96, 64, 32]   # offsets -2, -1, 0, +1, +2 ; sums to 256
offset_base = -2
rare_bonus = 1
unique_bonus = 2
threat_per_floor = 2         # floor_threat = 1 + floor * threat_per_floor (cap 250)

