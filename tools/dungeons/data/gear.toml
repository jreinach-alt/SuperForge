# --- drops -------------------------------------------------------------------
[drops]
# chance out of 256 that a kill drops GEAR, by enemy class; consumables separate.
gear_by_class = { grunt = 10, ranged = 12, brute = 28, elite = 128, boss = 256 }
consumable_by_class = { grunt = 40, ranged = 40, brute = 64, elite = 128, boss = 256 }
chest_items = 2              # gear items per chest (one per player in co-op)
boss_items_per_player = 1    # guaranteed, rarity floor = rare
slot_weights = { melee = 72, ranged = 64, armor = 72, artifact = 48 }   # sums to 256
